<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>편집국 1면</title>
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/outfit/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/oswald/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/oswald/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/oswald/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/bodoni-moda/400-italic.css">
<link rel="stylesheet" href="../node_modules/@fontsource/bodoni-moda/500-italic.css">
<link rel="stylesheet" href="../mz.css">
<style>
:root{--paper:#F3F0E8;--ink:#141414;--ink2:#2A2926;--mu:#625E56;--hair:#C9C3B6}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Gothic A1',sans-serif;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
.wrap{width:1440px;margin:0 auto;padding:0 72px 64px;position:relative}
.wrap::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--grain,none);background-size:170px 170px;mix-blend-mode:multiply;opacity:.25}
.dl{display:flex;justify-content:space-between;align-items:center;padding:20px 0 14px;font-family:'IBM Plex Mono';font-size:12.5px;letter-spacing:.02em;color:var(--ink2)}
.np{text-align:center;padding:14px 0 18px}
.np h1{margin:0;font-family:'Noto Serif KR';font-weight:900;font-size:132px;line-height:1.02;letter-spacing:-.035em}
.np p{margin:12px 0 0;font-family:'Bodoni Moda';font-style:italic;font-weight:500;font-size:21px;letter-spacing:.02em;color:var(--ink2)}
.np p span{font-family:'Gothic A1';font-style:normal;font-weight:600;font-size:14px;letter-spacing:.02em;color:var(--mu);margin-left:14px}
.rule{height:8px;border-top:4px solid var(--ink);border-bottom:1px solid var(--ink)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--ink);font-size:14.5px;font-weight:800}
.nav .l{display:flex;gap:30px}
.nav .l span{color:var(--ink2)}
.nav .l .on{color:var(--ink);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.nav .s{display:flex;align-items:center;gap:10px;width:280px;border-bottom:1px solid var(--ink);padding:4px 2px;font-weight:500;font-size:13.5px;color:var(--mu)}
.front{display:grid;grid-template-columns:500px 1fr;gap:56px;padding:40px 0 44px;border-bottom:3px solid var(--ink)}
.front figure{margin:0}
.front figcaption{margin-top:16px;font-family:'Bodoni Moda';font-style:italic;font-size:16px;color:var(--mu);display:flex;justify-content:space-between}
.kick{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--ink);font-size:13px;font-weight:800;letter-spacing:.14em}
.kick span:last-child{letter-spacing:.04em;font-weight:700;color:var(--ink2)}
.front h2{margin:26px 0 0;font-family:'Noto Serif KR';font-weight:900;font-size:64px;line-height:1.2;letter-spacing:-.04em;text-wrap:balance}
.deck{margin:24px 0 0;font-family:'Noto Serif KR';font-weight:500;font-size:19.5px;line-height:1.78;color:var(--ink2);max-width:720px}
.fig{display:grid;grid-template-columns:repeat(3,1fr);margin-top:30px;border-top:3px solid var(--ink)}
.fig > div{padding:16px 18px 0 0;border-right:1px solid var(--hair)}
.fig > div + div{padding-left:18px}
.fig > div:last-child{border-right:0}
.fig span{display:block;font-size:12px;font-weight:800;letter-spacing:.1em}
.fig b{display:block;font-family:Oswald;font-weight:500;font-size:50px;line-height:1.1;margin-top:8px}
.fig i{display:block;font-style:normal;font-family:'IBM Plex Mono';font-size:13px;color:var(--mu);margin-top:4px}
.read{display:inline-block;margin-top:30px;font-weight:800;font-size:15.5px;border-bottom:2px solid var(--ink);padding-bottom:3px}
.prev{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:38px;padding-top:22px;border-top:1px solid var(--ink)}
.pv{display:grid;grid-template-columns:104px 1fr;gap:18px;align-items:start}
.pv .m{font-family:'IBM Plex Mono';font-size:12px;color:var(--mu);letter-spacing:.02em}
.pv h3{margin:8px 0 0;font-family:'Noto Serif KR';font-weight:700;font-size:21px;line-height:1.45;letter-spacing:-.02em}
.pv p{margin:8px 0 0;font-size:13px;color:var(--mu);line-height:1.6}
.sh{display:flex;align-items:baseline;justify-content:space-between;padding:34px 0 14px;border-bottom:1px solid var(--ink)}
.sh h2{margin:0;font-family:'Noto Serif KR';font-weight:900;font-size:36px;letter-spacing:-.03em}
.sh span{font-family:'IBM Plex Mono';font-size:13px;color:var(--ink2)}
.idx{display:grid;grid-template-columns:repeat(8,1fr);gap:30px 20px;padding-top:28px}
.idx .c{font-family:'IBM Plex Mono';font-size:12px;margin-top:10px;display:flex;justify-content:space-between;color:var(--ink2)}
.idx .c b{font-weight:500;color:var(--ink)}
.band{display:grid;grid-template-columns:repeat(30,1fr);gap:4px;padding-top:26px}
.band div{display:flex;flex-direction:column;align-items:center;gap:7px}
.band i{width:100%;height:40px;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:Outfit;font-weight:700;font-size:15px;background:var(--ink);color:var(--paper)}
.band i.no{background:transparent;border-top:1px solid var(--ink);height:1px;margin:20px 0 19px}
.band i.q{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.band i.two{font-size:11px;background:linear-gradient(90deg,var(--ink) 50%,#5E5A52 50%)}
.band i.now{outline:3px solid var(--ink);outline-offset:3px}
.band small{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--mu)}
.bnote{margin-top:16px;font-size:13px;color:var(--mu)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);padding-top:26px}
.cols > div{padding:0 26px 0 0;border-right:1px solid var(--hair)}
.cols > div + div{padding-left:26px}
.cols > div:last-child{border-right:0}
.cols h3{margin:0;font-size:13px;font-weight:800;letter-spacing:.1em}
.cols b{display:block;font-family:Oswald;font-weight:500;font-size:34px;margin-top:6px}
.cols p{margin:6px 0 12px;font-size:12.5px;color:var(--mu);line-height:1.6}
.colo{margin-top:40px;padding-top:14px;border-top:4px solid var(--ink);display:flex;justify-content:space-between;font-family:'IBM Plex Mono';font-size:12px;color:var(--ink2)}
</style></head><body>
<div class="wrap" id="app"></div>
<script src="../data.js"></script>
<script>
(function(){
<<MZ>>
<<COMMON>>
var st=stats(), dl=deltas(L), app=document.getElementById('app'), R=B.slice().reverse();
var h='';
h+='<div class="dl"><span>'+L.date.slice(0,4)+'년 '+(+L.date.slice(5,7))+'월 '+(+L.date.slice(8))+'일 '+wd(L.date)+'요일</span><span>제'+vol(L)+'호 · 매일 아침 06:10 발행</span><span>브리핑 '+st.n+'회 · 지표 적립 '+st.days+'일</span></div>';
h+='<div class="rule"></div><div class="np"><h1>크립토 브리핑</h1><p>The Crypto Brief Archive<span>날짜별로 모아 두는 크립토 브리핑 서고</span></p></div><div class="rule"></div>';
h+='<div class="nav"><div class="l"><span class="on">1면</span><span>지난 호 색인</span><span>국면 연표</span><span>발행 목록</span><span>지표</span><span>부속 문서</span><span>갱신 방식</span></div>'
  +'<div class="s"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>날짜나 낱말로 찾기</div></div>';
var ph=parts(L.phase), phs=ph.length?'국면 '+ph.join('→')+' · '+PHN[ph[ph.length-1]]:'국면 미기록';
var deck='오늘 브리핑은 국면을 '+ph.join('→')+'('+PHN[ph[ph.length-1]]+')로 판정했다. BTC.D는 '+f(L.btcd,2)+'%로 전날보다 '+sg(dl.dB,2)+'%p 움직였고, ΣSTABLECOIN.D는 '+f(L.stableD,3)+'%, BTCUSD는 한 달 동안 '+sg(L.btc1m,2)+'% 움직였다.';
var pk=BK.pick(L,B).split(' · ');
h+='<section class="front"><figure>'+cover(L)+'<figcaption><span>제'+vol(L)+'호 표지 · '+pk[0]+'</span><span>'+pk[1]+' 배색</span></figcaption></figure>'
  +'<div><div class="kick"><span>오늘의 1면</span><span>'+phs+(L.provisional?' · 임시 기준':'')+'</span></div>'
  +'<h2>'+esc(L.headline)+'</h2><p class="deck">'+esc(deck)+'</p>'
  +'<div class="fig"><div><span>BTC.D</span><b>'+f(L.btcd,2)+'%</b><i>전날 '+sg(dl.dB,2)+'%p</i></div><div><span>ΣSTABLECOIN.D</span><b>'+f(L.stableD,3)+'%</b><i>1개월 '+sg(L.stable1m,3)+'%p</i></div><div><span>BTCUSD 1개월</span><b>'+sg(L.btc1m,2)+'%</b><i>'+runLabel(L)+'</i></div></div>'
  +'<span class="read">브리핑 전문 읽기 →</span>'
  +'<div class="prev">'+R.slice(1,3).map(function(b){return '<div class="pv"><div>'+cover(b)+'</div><div><div class="m">제'+vol(b)+'호 · '+mdot(b.date)+' '+wd(b.date)+'요일</div><h3>'+esc(b.headline||b.note)+'</h3><p>'+phaseText(b.phase)+' · BTC.D '+f(b.btcd,2)+'%</p></div></div>';}).join('')+'</div>'
  +'</div></section>';
h+='<div class="sh"><h2>지난 호 색인</h2><span>2026년 9월 · '+B.length+'호 · 최신 호부터</span></div><div class="idx">'
  +R.map(function(b){return '<div>'+cover(b)+'<div class="c"><b>No.'+vol(b)+'</b><span>'+mdot(b.date)+' '+wd(b.date)+(b.seq>1?' '+b.seq+'회':'')+'</span></div></div>';}).join('')+'</div>';
var dm=dayMap(), band='';
for(var d=1;d<=30;d++){var ds='2026-09-'+(d<10?'0'+d:d), xs=dm[ds];
  if(!xs){band+='<div><i class="no"></i><small>'+d+'</small></div>'; continue;}
  var ps=parts(xs[xs.length-1].phase), cls=d===30?' now':'';
  band+='<div><i class="'+(ps.length?(ps.length>1?'two':''):'q')+cls+'">'+(ps.length?ps.join(''):'?')+'</i><small>'+d+'</small></div>';}
h+='<div class="sh"><h2>국면 연표</h2><span>하루 한 칸 · 여러 번 발행한 날은 마지막 회차</span></div><div class="band">'+band+'</div>'
  +'<p class="bnote">A BTC! · B 알트시즌? · C 선별적 · D STICKY BTC.D · E 튀어? · 가는 줄은 브리핑이 없는 날, 물음표는 국면을 기록하지 않은 날입니다.</p>';
h+='<div class="sh"><h2>지표</h2><span>브리핑이 기록한 숫자, 날짜별</span></div><div class="cols">'
  +'<div><h3>BTC.D</h3><b>'+f(L.btcd,2)+'%</b><p>비트코인 점유율. 9월 3일부터 기록했습니다.</p>'+spark(daily('btcd'),380,96,'#141414',{sw:1.6,r:3.2})+'</div>'
  +'<div><h3>ΣSTABLECOIN.D 1개월</h3><b>'+sg(L.stable1m,3)+'%p</b><p>E 판정의 임시 기준은 +1.0%p입니다.</p>'+spark(daily('stable1m'),380,96,'#141414',{sw:1.6,r:3.2})+'</div>'
  +'<div><h3>BTCUSD 1개월</h3><b>'+sg(L.btc1m,2)+'%</b><p>0 아래로 내려가야 D·E 판정의 전제가 섭니다.</p>'+spark(daily('btc1m'),380,96,'#141414',{sw:1.6,r:3.2})+'</div></div>';
h+='<div class="colo"><span>크립토 브리핑 서고 · 매일 아침 06:10 발행 실행이 한 호씩 등록합니다.</span><span>매크로 리스크 서고 →</span></div>';
app.innerHTML=h;
ready();
})();
</script></body></html>
