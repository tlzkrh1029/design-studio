# 크립토 브리핑 서고 · 시안 3 「달력 벽」 디자인 명세 (개정)
meta:
  theme: "calendar"
  document_title: "크립토 브리핑 서고 · 2026년 9월"
  render: "데스크톱 1440px 한 장으로 비교. 모바일 390px은 mobile_390 규칙만 적는다"
  data_state: "31호(9/2~9/30). 오늘 = 최신 호 날짜 2026-09-30(수). 처음 고른 호 = 제31호"

intent:
  concept: "벽에 건 월간 달력. 날짜 칸마다 그날 표지가 꽂혀 발행한 날·빈 날·여러 번 낸 날이 한눈에 보이고, 오른쪽 카드가 고른 날(처음엔 오늘)의 표지와 지표를 크게 보여 준다. 날짜로 찾기가 가장 쉬운 서고"
  mood: "옅은 청회색 벽, 흰 종이 카드, 남색 잉크. 차분하고 반듯한 사무용 달력. 색은 표지와 국면 표식만 내고 페이지는 물러선다"
  hierarchy: "① 월 제목과 오늘 표지 ② 달력 칸 표지의 리듬 ③ 국면 흐름 띠 ④ 지표 차트 ⑤ 발행 목록"
  fixes_from_draft:
    - "여러 회차를 겹쳐 쌓고 뒤 표지를 어둡게 하던 방식 폐기(겹침·필터 금지 위반). 칸에는 표지 1장, 날짜 줄에 ‘3회’ 배지, 회차 전환은 오른쪽 카드에서"
    - "표지 모서리를 가리던 ‘3회’ 배지를 날짜 줄로 옮김. 어떤 표식도 표지 위에 얹지 않는다"
    - "하루 한 칸 ‘국면 흐름’ 띠 추가. 주마다 끊기던 국면 흐름을 한 줄로 읽는다"
    - "명암비 미달 글자(#8994A2) 폐기. 벽 위 보조 글자는 #4A5663"
    - "‘2026년 9월’과 ‘9월의 표지’ 제목 중복, 정의 안 된 ‘달력/서가/목록’ 탭 제거. 요약 줄은 ‘9월 기록’ 카드로"
    - "고른 날 카드: 칩 4개 → 국면 칩 + 임시 기준 + 메타 한 줄. ‘브리핑 펼치기’를 헤드라인 바로 아래로 올려 첫 화면(높이 900) 안에"
    - "스파크라인 카드 → 축·기준선·고른 날 세로선이 있는 차트 3개. 지표 표는 발행 목록 열로 합침"
    - "검색 범위 선택·결과 상태, 발행 목록, 형제 서고·부속 문서·갱신 방식 링크 복원. 8월 기록이 없으니 이전 달 화살표도 비활성. 9/1 ‘기록 전’과 9/18·19 ‘브리핑 없음’을 다른 모양으로"

