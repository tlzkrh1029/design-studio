    split: "걸친 판정(예: C→D)은 왼쪽 반 = 앞 국면, 오른쪽 반 = 뒤 국면. 반마다 그 국면의 fill과 ink로 글자 하나씩. 화살표 기호는 그리지 않는다"
    usage: "국면 색은 국면 표식(배지, 띠, 범례, 모바일 국면 막대)에만. 칸 바탕·버튼·차트 선에는 쓰지 않는다"
