# 크립토 브리핑 서고 · 시안 1 「밤의 가판대」 디자인 명세
# 읽는 법: “ ” 안의 글은 화면 문구 그대로(바깥 따옴표는 빼고). 크기 단위는 모두 px. 괄호 속 영문은 데이터 필드 이름. {N}은 계산해 넣는 값.
meta:
  theme: 밤의 가판대
  page: 크립토 브리핑 서고 (한 페이지 세로 스크롤, lang=ko)
  targets: 데스크톱 1440 렌더링 기준. 모바일 390 적응은 mobile_390.
  data_rule: 브리프에 있는 값만 쓴다. 없는 값은 지어내지 않고 숨기거나 “—”로 둔다.

intent:
  concept: 밤에 불 켜진 신문 가판대. 거의 검은 바탕에서 표지만 빛을 받는다. 최신 호는 전등 아래 받침대에 홀로 세우고, 지난 호는 조명 선반에 줄지어 꽂는다.
  mood: 조용하고 따뜻한 밤. 빛은 은은하고 글자와 숫자는 또렷하다. 장식은 빛과 받침뿐이다.
  daily_accent: 강조색은 최신 호 표지의 테두리색을 따른다(9/30은 복숭아색). 날마다 전등 색이 바뀌는 가판대처럼 보인다.
  hierarchy: 표지 > 헤드라인 > 국면 > 지표 숫자 > 날짜·메타. 표지가 늘 화면에서 가장 밝은 물체다.
  fixes_from_draft:
    - 72px 날짜가 헤드라인을 누르던 위계를 바로잡는다. 날짜 48, 헤드라인 44/800이 주인공.
    - 성격이 섞인 칩 4개를 “국면 줄” 하나로 정리하고, 서고 통계(31호, 기록 26일)는 해당 구역 머리로 옮긴다.
    - 기준선 없는 작은 추세선을 히어로에서 빼고, 기준선(+1.0%p, 0)을 그은 “지표 추이” 구역을 새로 둔다.
    - 가판대 첫 칸이 히어로와 같은 호였다. 가판대는 지난 호 30장을 모두 꽂고 “더 보기”를 없앤다. 브리핑 없는 날은 빈 자리로 보인다.
    - 국면 띠를 히어로 바로 아래로 올린다. 발행 전인 9월 1일 칸을 지우고(29칸), “판정 없음”·“걸친 판정” 범례를 더한다.
    - 영어 장식 라벨(SEPTEMBER 2026, 30 DAYS, LATEST)과 한글 넓은 자간을 없앤다. 로고도 한국어로.
    - 초록 등락색을 없앤다(국면 C 초록과 겹친다). 등락은 부호로만 말한다.
    - 검색에 범위 선택과 결과 판을 더하고, 부속 문서·갱신 방식을 “서고 안내”로 되살린다.

tokens:
  color:
    bg: {hex: "#0C0E12", role: "페이지 바탕"}
    bg_band: {hex: "#101318", role: "국면 띠의 전폭 바탕"}
    surface_1: {hex: "#14181E", role: "지표 카드·검색 결과 판·툴팁"}
    surface_2: {hex: "#1A1F26", role: "입력창·목록 행 hover·표지 자리표시"}
    line_subtle: {hex: "#232932", role: "구분선·격자선"}
    line_strong: {hex: "#39414C", role: "버튼·입력 테두리, 빈 자리 점선"}
    line_ref: {hex: "#6B727C", role: "차트 기준선 점선, 임시 기준 태그 점선"}
    lamp_shade: {hex: "#5A616B", role: "히어로 전등 갓의 선"}
    stand_top: {hex: "#2E3440", role: "받침·선반 윗면"}
    stand_front: {hex: "#181C23", role: "받침·선반 앞면"}
    lamp: {hex: "#FFF3E4", role: "전등빛. 불투명 2~10%로만 쓴다(전구 자체만 90%)"}
    text_primary: {hex: "#F2F0EC", role: "헤드라인·제목·값"}
    text_secondary: {hex: "#B4B9C1", role: "보조 문장·날짜"}
    text_tertiary: {hex: "#8A919B", role: "라벨·메타·축 눈금"}
    accent: {hex: "#F2B39F", role: "오늘의 강조색. 최신 호 표지 테두리색을 accent_rule로 보정한 값(9/30 복숭아)"}
    accent_ink: {hex: "#0C0E12", role: "강조색 면 위의 글자"}
  accent_rule:
    source: '최신 호 표지 모듈이 쓰는 테두리색 값을 그대로 받는다. 못 받으면 "#F2B39F".'
    contrast: surface_2 대비 4.5 미만이면 흰색을 8%씩 섞어 4.5 이상이 될 때까지 밝힌다(색상은 유지).
    variants: 'glow = 강조색 16% 불투명, wash = 12%, line = 45%.'
    used_for: 로고 불빛 점, 킥커, 헤드라인 둘째 줄, 주 버튼, 현재 메뉴 밑줄, 포커스 링, 국면 띠 최신 칸 링과 날짜 숫자, 차트 선과 끝점, 검색 일치 표시, 히어로 후광.
    never: 국면 표시와 등락 표시에는 쓰지 않는다.
  phase:
    A: {hex: "#CB8242", name: "BTC!", ink: "#0C0E12"}
    B: {hex: "#A96CAF", name: "알트시즌?", ink: "#0C0E12"}
    C: {hex: "#056F15", name: "선별적", ink: "#FFFFFF"}
    D: {hex: "#594D99", name: "STICKY BTC.D", ink: "#FFFFFF"}
    E: {hex: "#2B97FF", name: "튀어?", ink: "#0C0E12"}
    none: {hex: "#2A3039", name: "판정 없음", ink: "#B4B9C1", glyph: "?"}
    edge: 모든 국면 면 안쪽에 1px 흰색 14% 선. 어두운 바탕에서 C·D 면의 가장자리가 보이게 한다.
  type:
    families:
      sans: Gothic A1 (한국어 전부)
      display: Oswald (날짜, 큰 숫자, 국면 글자)
      mono: IBM Plex Mono (작은 숫자, 티커, 축). 한글이 섞이면 한글만 Gothic A1으로 대체.
      unused: Noto Serif KR, Bodoni Moda, Outfit은 쓰지 않는다.
    # 형식: 글꼴 / 크기 / 굵기 / 줄 높이(배수) / 자간
    roles:
      wordmark: {family: Gothic A1, size: 17, weight: 800, line_height: 1.0, letter_spacing: "-0.01em"}
      nav: {family: Gothic A1, size: 14, weight: 600, line_height: 1.0, letter_spacing: "0"}
      kicker: {family: Gothic A1, size: 14, weight: 700, line_height: 1.3, letter_spacing: "0.04em"}
      date_display: {family: Oswald, size: 48, weight: 500, line_height: 1.0, letter_spacing: "0.01em"}
      headline: {family: Gothic A1, size: 44, weight: 800, line_height: 1.28, letter_spacing: "-0.02em"}
      section_title: {family: Gothic A1, size: 28, weight: 800, line_height: 1.3, letter_spacing: "-0.01em"}
      phase_name: {family: Gothic A1, size: 18, weight: 700, line_height: 1.3, letter_spacing: "0"}
      card_title: {family: Gothic A1, size: 16, weight: 700, line_height: 1.4, letter_spacing: "0"}
      figure_xl: {family: Oswald, size: 40, weight: 500, line_height: 1.0, letter_spacing: "0"}
      figure_l: {family: Oswald, size: 28, weight: 500, line_height: 1.0, letter_spacing: "0"}
      body: {family: Gothic A1, size: 16, weight: 400, line_height: 1.6, letter_spacing: "0"}
      body_s: {family: Gothic A1, size: 15, weight: 400, line_height: 1.7, letter_spacing: "0"}
      row_headline: {family: Gothic A1, size: 16, weight: 600, line_height: 1.5, letter_spacing: "-0.005em"}
      meta: {family: Gothic A1, size: 14, weight: 500, line_height: 1.5, letter_spacing: "0"}
      small: {family: Gothic A1, size: 13, weight: 500, line_height: 1.45, letter_spacing: "0"}
      caption: {family: Gothic A1, size: 12, weight: 500, line_height: 1.4, letter_spacing: "0"}
      button: {family: Gothic A1, size: 16, weight: 700, line_height: 1.0, letter_spacing: "0"}
      ticker: {family: IBM Plex Mono, size: 12, weight: 500, line_height: 1.3, letter_spacing: "0.06em"}
      data_l: {family: IBM Plex Mono, size: 15, weight: 500, line_height: 1.3, letter_spacing: "0"}
      data: {family: IBM Plex Mono, size: 14, weight: 500, line_height: 1.4, letter_spacing: "0"}
      data_m: {family: IBM Plex Mono, size: 13, weight: 500, line_height: 1.4, letter_spacing: "0"}
      data_s: {family: IBM Plex Mono, size: 12, weight: 400, line_height: 1.3, letter_spacing: "0.02em"}
    rules: 한국어 줄바꿈은 낱말 단위(keep-all). 한글 자간은 0.04em을 넘기지 않는다. 가장 작은 글자는 12(배지 글자 포함). 열로 늘어선 숫자(목록·표·축)는 고정폭 숫자, 큰 단독 숫자는 비례폭.
  space: [4, 8, 12, 16, 20, 24, 32, 44, 48, 64, 96]
  radius: {cover: 0, badge_s: 4, badge_m: 6, badge_l: 8, cell: 6, tag: 6, tooltip: 8, button: 10, input: 10, popover: 12, card: 14, pill: 999}
  # 그림자 형식: x y 흐림 색(검정 불투명도)
  shadow:
    cover_hero: '0 40 80 검정 60% + 0 12 24 검정 45%'
    cover_rack: '0 10 18 검정 55%'
    cover_rack_hover: '0 18 30 검정 60%'
    plank: '0 12 20 검정 55%'
    popover: '0 24 48 검정 50%'
  motion:
    hover: 180ms ease-out (표지 들림, 행 바탕, 버튼, 링).
    load: 첫 화면에서 전등빛·빛기둥·후광만 0→100% 700ms ease-out 한 번. 표지와 글은 처음부터 보인다.
    scroll: 메뉴·버튼 이동은 부드러운 스크롤, 상단 막대 높이만큼 띄워 멈춘다.

frame:
  canvas: 폭 1440, 바탕 bg. 내용 폭 1312, 좌우 여백 64.
  grid: '12열, 열 80, 사이 32. n열 폭 = 112n − 32 (4열 416, 6열 640).'
  vertical_rhythm: 큰 구역 위 여백 96. 국면 띠만 위 40·아래 64로 히어로에 바로 붙인다.
  section_head: '왼쪽 제목(section_title, text_primary) + 16 + 메타(meta, text_tertiary), 글자 밑선 맞춤. 오른쪽 안내(meta, text_tertiary, 오른쪽 정렬, 최대 폭 480). 20 아래 1px line_subtle 선, 선 아래 32부터 내용.'
  order: 상단 막대 → 오늘 호 → 국면 흐름 → 가판대 → 지표 추이 → 발행 목록 → 서고 안내 → 바닥글

sections:
  - id: topbar
    layout: 높이 64, 화면 위에 고정(sticky). 바탕 bg 86% 불투명 + 뒤 흐림 12, 아래 1px line_subtle. 모든 요소 세로 가운데.
    left: 'x 64. 로고 = 8×8 강조색 원(glow로 8 번짐) + 8 + “크립토 브리핑”(wordmark, text_primary) + 5 + “서고”(wordmark 400, text_secondary). 누르면 맨 위로.'
    nav: '로고 끝에서 56 뒤, 항목 사이 28(components.nav_item). “오늘 호” “국면 흐름” “가판대” “지표 추이” “발행 목록” “서고 안내”.'
    right: 'components.search, 오른쪽 끝 x 1376.'
  - id: hero
    name: 오늘 호 (전등 아래 받침대)
    size: 높이 802(막대 아래부터), 넘친 빛은 구역 안에서 자른다. 900 높이 첫 화면에 표지·받침·캡션이 다 들어온다.
    stage: '1~6열(x 64~704). 표지 400×588을 무대 가로 가운데(x 184~584), 구역 위에서 104 아래에 세운다.'
    layers_bottom_to_top:
      - '후광: 표지 중심에 타원 840×880, 강조색 16% → 가장자리 0.'
      - '빛기둥: 전등 갓 아래(y 50, 폭 64)에서 받침(y 706, 폭 600)으로 벌어지는 사다리꼴. lamp 9%(위) → 2%(아래), 가장자리 흐림 32.'
      - '전등(선 SVG, 표지 중심 위): 줄 1px line_strong(y 0~28) + 갓(윗변 20, 아랫변 64, 높이 22, 선 1.5 lamp_shade, 속 surface_1) + 갓 아래 전구빛 타원 24×6, lamp 90%.'
      - '표지(shadow cover_hero) → 받침(components.stand, y 692~706) → 바닥 빛웅덩이 타원 560×56(중심 y 712), lamp 7% → 0.'
    stand_caption: '받침 아래 24, 무대 가운데, small, text_tertiary. “다음 호 · 10월 1일 목요일 06:10 예정” (최신 date + 1일, 시각은 06:10 고정).'
    text_block: '7~12열(x 736~1376, 폭 640). 아래 여섯 줄을 한 묶음으로 표지와 세로 가운데 정렬.'
    kicker: '32×1 강조색 선 + 12 + “오늘의 호 · 제31호”(kicker, 강조색). 최신 date가 오늘(KST)이 아니면 “최신 호 · 제31호”. 그날 호가 둘 이상이면 끝에 “ · 2회차”(seq).'
    dateline: '16 아래. “2026.09.30”(date_display, text_primary) + 16 + “수요일 · 06:10 본실행”(body, text_secondary; 요일 · run), 글자 밑선 맞춤.'
    headline: '28 아래, h1(headline). 첫 “, ” 뒤에서 줄을 바꾸고 둘째 줄을 강조색으로: “BTC는 일주일 만에 되밀렸는데,” / “알트 점유율은 오히려 올랐다”. 쉼표가 없으면 전부 text_primary로 흘린다. 44에서 4줄 이상이면 36. headline이 없으면 note를 32/700으로.'
    phase_line: 28 아래, components.phase_line.
    figures: 36 아래, components.figure_row (폭 640, 3칸).
    actions: '36 아래, 버튼 둘 사이 12. 주 “브리핑 펼치기” + 오른쪽 화살표(url, 같은 탭) / 보조 “지난 호 넘겨 보기” + 아래 화살표(가판대로 이동).'
  - id: phases
    name: 국면 흐름 (가판대 앞 전광판 띠)
    layout: '전폭 bg_band 띠, 위·아래 1px line_subtle, 안쪽 위 40·아래 64. 구역 머리 → 칸 줄 → 8 아래 날짜 숫자 → 20 아래 범례.'
    head: '제목 “국면 흐름”, 메타 “9월 2일 – 9월 30일 · 29일”, 안내 “하루 한 칸입니다. 여러 번 발행한 날은 마지막 회차의 판정을 씁니다.”'
    window: 최신 date에서 거슬러 30일. 단 첫 호 date보다 앞 날짜는 그리지 않는다. 지금은 9/2~9/30, 29칸.
    cells: '1312를 같은 폭 칸으로 채움. 간격 6, 폭 = (1312 − 6×(칸 수 − 1)) ÷ 칸 수(지금 약 39.4), 높이 48. components.timeline_cell. 한 날에 여러 호면 마지막 회차 phase.'
    day_numbers: '칸 가운데 아래 “2” … “30”(data_s, text_tertiary). 최신 date 숫자만 강조색 500. 달이 바뀌는 칸 위에는 “10월”(data_s, text_secondary).'
    legend: '견본 14×14(모서리 3) + 8 + 이름(small, text_secondary), 항목 사이 24, 한 줄. “A · BTC!” “B · 알트시즌?” “C · 선별적” “D · STICKY BTC.D” “E · 튀어?” “걸친 판정”(반반 견본) “판정 없음”(? 견본) “브리핑 없음”(점선 견본).'
  - id: rack
    name: 가판대 (지난 호 표지 전부)
    head: '제목 “가판대”, 메타 “지난 호 30장 · 브리핑 없는 날 2일”, 안내 “표지를 누르면 그날 브리핑이 열립니다.”'
    scope: '히어로의 최신 호를 뺀 모든 호. 최신순, 같은 날은 seq 큰 것 먼저. 브리핑 없는 날(9/18, 9/19)은 그 날짜 자리에 components.empty_slot.'
    groups: '달마다 한 묶음. 묶음 머리 “2026년 9월”(card_title, text_secondary) + 16 + 오른쪽 끝까지 1px line_subtle, 아래 24. 묶음 사이 64. 이번 달과 지난달만 펼치고 그 앞 달은 “{YYYY}년 {M}월 · {N}장 펼치기” 한 줄 보조 버튼(높이 40)으로 접는다.'
    grid: '한 줄 8칸, 표지 143×210, 칸 사이 24(8×143 + 7×24 = 1312), 줄 사이 44, 마지막 줄 왼쪽 정렬. 지금 30장 + 빈 자리 2 = 32칸 = 4줄.'
    row: '표지 밑변을 선반 윗면에 세운다 → components.plank → 12 아래 components.rack_slot 라벨 두 줄.'
    row_light: '줄마다 뒤벽 빛: 폭 1312, 표지 윗변 40 위에서 선반까지, lamp 5%(위) → 높이 70% 지점 0. 표지 위에는 아무것도 덮지 않는다.'
  - id: metrics
    name: 지표 추이
    head: '제목 “지표 추이”, 메타 “기록한 날 26일”, 오른쪽에 작은 보조 버튼(높이 36) “표로 보기” ↔ “표 접기”. 처음엔 접힘.'
    cards: '4열씩 3장(각 416×320), 사이 32. components.chart_card.'
    card_1: '제목 “BTC.D”, 설명 “단위 %”, 최근 값 “59.18%”(btcd). 기준선 없음.'
    card_2: '제목 “ΣSTABLECOIN.D 1개월 변화”, 설명 “단위 %p · 점선은 E 판정 임시 기준”, 최근 값 “−0.705%p”(stable1m). 기준선 +1.0, 라벨 “E 임시 기준 +1.0%p”. 0에는 1px line_strong 실선.'
    card_3: '제목 “BTCUSD 1개월 변화”, 설명 “단위 % · 0 아래로 내려가야 D·E 판정 전제”, 최근 값 “+6.71%”(btc1m). 기준선 0, 라벨 “0”.'
    table: '펼치면 카드 아래 32, 전폭. 열 “날짜” “호” “국면” “BTC.D” “전날 대비” “ΣSTABLECOIN.D” “1개월 변화” “BTCUSD 1개월”. 기록한 날만 최신순(지금 26행), 여러 호인 날은 마지막 회차 값. 머리 행 40(ticker, text_tertiary), 행 40(data, 숫자 오른쪽 정렬, 아래 1px line_subtle), 국면은 배지 S.'
  - id: list
    name: 발행 목록
    head: '제목 “발행 목록”, 메타 “31호 · 최신순”.'
    column_head: '높이 36, ticker, text_tertiary: “날짜” “호” “국면” “헤드라인” “BTC.D” “실행”.'
    columns: '행 안쪽 좌우 16, 열 사이 24. 날짜 104 | 호 72 | 국면 48 | 헤드라인 나머지(692) | BTC.D 96 오른쪽 정렬 | 실행 148 오른쪽 정렬.'
    rows: 'components.list_row. 처음 7행, 아래 24에 가운데 보조 버튼(높이 44) “나머지 24호 모두 보기”, 펼친 뒤 “접기”.'
    search_mode: '검색 중이면 제목 “검색 결과”, 메타 “‘{검색어}’ · {N}호”, 오른쪽 글자 버튼 “검색 지우기”. 일치한 행을 접지 않고 모두 보이며 일치 글자를 표시한다.'
  - id: about
    name: 서고 안내
    layout: '1~6열 “부속 문서”, 7~12열 “갱신 방식”. 소제목 h3(card_title), 아래 16.'
    docs: '현재 서고의 부속 문서 링크를 문구 그대로. 행 52: 문서 아이콘 18 + 12 + 제목(body_s, text_primary) + 오른쪽 끝 바깥 화살표 16(text_tertiary). 행 아래 1px line_subtle.'
    update: 현재 서고의 갱신 방식 문단을 문구 그대로(body_s, text_secondary). 새 문구를 만들지 않는다.
  - id: footer
    layout: '위 1px line_subtle, 안쪽 위 32·아래 48. 왼쪽 “크립토 브리핑 서고 · 매일 아침 06:10에 한 호씩 꽂힙니다.”(small, text_tertiary). 오른쪽 형제 서고 링크 = 보조 버튼(높이 40) “매크로 리스크 서고” + 바깥 화살표.'

components:
  cover:
    rule: 표지 모듈이 그린 그대로 쓴다. 테두리·필터·기울임·둥근 모서리·겹치기·위에 글자나 배지 얹기 금지. 그림자와 받침만 허용.
    widths: '히어로 400, 가판대 143, 모바일 히어로 240, 모바일 가판대 110. 높이 = 폭 ÷ 0.68(반올림).'
    placeholder: 그려지기 전에는 같은 크기의 surface_2 판(무늬·글자 없음).
    link: 표지 전체가 그 호 url 링크(같은 탭).
  stand: '히어로 받침. 440×14, 표지와 가로 가운데. 윗면 4 stand_top + 앞면 10 stand_front, 모서리 2, shadow plank. 표지 밑변이 윗면에 닿는다.'
  plank: '가판대 선반. 폭 1344(내용 양쪽으로 16씩 더), 높이 12 = 윗면 3 stand_top + 앞면 9 stand_front, 모서리 2, shadow plank.'
  rack_slot:
    label_1: '“09.29”(data_m, text_secondary) + 6 + “화”(small, text_tertiary), 오른쪽 끝에 국면 배지 S(phase).'
    label_2: '4 아래 “제30호”(caption, text_tertiary). 그날 호가 둘 이상이면 “제{N}호 · 2회차”(seq).'
    rest: 'shadow cover_rack.'
    hover: '표지 6 위로, shadow cover_rack_hover, 선반 윗면 표지 밑에 강조색 30% 타원 빛 160×10, 라벨 1줄 text_primary.'
    focus: 슬롯 전체(표지+라벨) 바깥 6에 2px 강조색 링, 모서리 8. 표지 자체에는 선을 긋지 않는다.
  empty_slot: '143×210, 1px line_strong 점선(4/4), 모서리 0, 가운데 “브리핑 없음”(small, text_tertiary). 선반은 이어지고, 라벨은 1줄 날짜만 text_tertiary(배지·2줄 없음). 누를 수 없음.'
  phase_badge:
    sizes: 'S 22×22(글자 13, 모서리 4) / M 28×28(글자 15, 모서리 6) / L 36×36(글자 20, 모서리 8). 글자 Oswald 600, 가운데.'
    fill: 면은 tokens.phase의 hex, 글자는 ink, 안쪽 edge 선.
    split: '걸친 판정(예 “C→D”)은 폭을 넓힌다(S 32, M 40, L 52). 왼쪽 반 앞 국면, 오른쪽 반 뒤 국면, 반마다 제 글자(12/13/17).'
    none: 'none 면에 “?”.'
  phase_line: '배지 L + 12 + “국면 C · 선별적”(phase_name, text_primary) + 12 + 태그 “임시 기준”(provisional일 때만) + 16 + 세로선 1×16 line_subtle + 16 + “전날 국면”(small, text_tertiary) + 8 + 배지 S(prevPhase). 걸친 판정이면 “국면 C→D · 선별적 → STICKY BTC.D” 꼴.'
  tag: '높이 28, 좌우 10, 1px line_ref 점선(3/3), 모서리 6, small 600 text_secondary. 점선이 “임시”를 뜻한다.'
  figure_row:
    frame: '위 1px line_subtle, 안쪽 위 20. 같은 폭 3칸, 칸 사이 1px line_subtle 세로선, 둘째·셋째 칸 왼쪽 안쪽 24.'
    cell: '라벨(ticker, text_tertiary) → 10 → 값(figure_xl, text_primary) → 10 → 변화(data_m, text_secondary) → 4 → 기준(caption, text_tertiary). 빈 줄도 자리를 지켜 세 칸의 값 높이를 맞춘다.'
    item_1: '“BTC.D” / “59.18%”(btcd) / “전날 +0.01%p” / 없음'
    item_2: '“ΣSTABLECOIN.D” / “9.125%”(stableD) / “1개월 −0.705%p”(stable1m) / “E 임시 기준 +1.0%p”'
    item_3: '“BTCUSD 1개월” / “+6.71%”(btc1m) / 없음 / “0 아래여야 D·E 판정 전제”'
  timeline_cell: '높이 48, 모서리 6. 국면 면 + 글자(Oswald 600 16, ink). 걸친 판정은 좌우 반반, 글자 13. 판정 없음은 none 면 + “?”. 브리핑 없음은 투명 + 1px line_strong 점선, 글자 없음, 누를 수 없음. 최신 date 칸은 2 띄우고 2px 강조색 링. 누르면 그날 마지막 회차 url. hover는 바깥 1px text_secondary 링 + tooltip.'
  tooltip: '대상 위 8. surface_1, 1px line_strong, 모서리 8, 안쪽 8/12, shadow popover. 1줄 값·판정(small 600, text_primary), 2줄 날짜·설명(small, text_secondary). 국면 칸 예: “국면 {X}→{Y}” / “{M}월 {D}일 {요일} · {N}회 발행, 마지막 회차 판정”.'
  chart_card:
    box: 'surface_1, 1px line_subtle, 모서리 14, 안쪽 24.'
    head: '왼쪽 h3 제목(card_title, text_primary) + 4 아래 설명(small, text_tertiary). 오른쪽 위 최근 값(figure_l, text_primary).'
    plot: '머리 아래 20, 368×176. 가로 격자 3줄(1px line_subtle 실선), y 눈금은 격자 위 왼쪽(data_s, text_tertiary, 단위 없이). x 눈금은 첫 기록일·가운데·최신 기록일, “9.30” 꼴.'
    y_range: 데이터와 그 카드의 기준선을 모두 담고 위아래 10% 여유.
    line: '강조색 2, 둥근 이음·끝. 점은 최신 값에만 8 강조색 + 2 surface_1 고리. 기록 없는 날은 선을 끊는다. 끝 값 라벨은 머리의 최근 값으로 대신한다.'
    ref_line: '1px line_ref 점선(4/4) + 선 바로 위 왼쪽 라벨(data_s, text_tertiary). 격자는 실선, 기준선만 점선.'
    hover: '가장 가까운 기록일에 세로 1px line_strong + 그 점 8 + tooltip(값 먼저: “59.17%” / “9월 29일 화요일”).'
  list_row: '최소 높이 64, 위아래 안쪽 16, 아래 1px line_subtle, 세로 가운데. 날짜 “09.30”(data_l, text_primary) 아래 “수요일”(caption, text_tertiary) | “제31호”(small, text_tertiary) | 배지 M | 헤드라인(row_headline, text_primary, 최대 2줄 뒤 …) | “59.18%”(data_l, text_primary) | pill. 행 전체가 url 링크, hover는 surface_2 바탕 모서리 10.'
  pill: '높이 26, 좌우 10, 모서리 999, 1px line_strong, caption 600. “06:10 본실행”은 text_tertiary, 그 밖(“안전판”, “지연 실행 10:57”)은 text_primary로 조금 도드라지게.'
  button:
    primary: '높이 52, 좌우 24, 모서리 10, 강조색 면, 글자 accent_ink(button), 아이콘 16(선 2) 글자와 10. hover 강조색에 흰색 10% 섞기, 누름 1 아래로.'
    secondary: '높이 52(작은 것 44/40/36, 글자 14), 투명 면, 1px line_strong, 글자 text_primary(button). hover surface_2 면 + 테두리 text_tertiary.'
    text: 'small 600 강조색, 밑줄 없음. hover 1px 밑줄.'
  nav_item: '높이 64 전체가 누르는 영역. nav, text_secondary. hover text_primary. 현재 구역(스크롤 위치로 판정)은 text_primary + 막대 아래 끝에 강조색 2px 밑줄(글자 폭).'
  search:
    box: '폭 360, 높이 40, surface_2, 1px line_strong, 모서리 10. 입력 포커스 때 테두리 강조색(공통 포커스 링 대신).'
    scope: '왼쪽 범위 선택 폭 88: 선택값(small 600, text_primary) + 아래 꺾쇠 12, 오른쪽 1px line_strong 세로선. 선택지 “전체” “헤드라인” “날짜” “국면”. 전체 = title·headline·note·date.'
    input: '돋보기 16(text_tertiary) + 8 + 입력(meta, text_primary). 자리 글 “날짜(09.24)나 낱말로 찾기”(text_tertiary). 오른쪽 끝 단축키 표시 “/” 20×20(data_s, 1px line_strong, 모서리 4). “/” 키로 입력에 포커스.'
    matching: '대소문자 무시, 부분 일치, 최신순. 날짜는 “09.24” “9.24” “9/24” “2026-09-24”를 모두 받는다. 국면 “C”는 “C→D”까지 찾는다.'
    results: '입력하는 대로 아래 8에 판: 폭 480 오른쪽 맞춤, surface_1, 1px line_strong, 모서리 12, shadow popover, 안쪽 8. 행 44 최대 6개: “09.24”(data_m) + 배지 S + 헤드라인 한 줄(meta, 넘치면 …). 일치 글자는 강조색 wash 바탕 + text_primary. 맨 아래 글자 버튼 “발행 목록에서 {N}호 모두 보기”(목록 search_mode로 이동). Esc로 닫힘.'
    empty: '“맞는 호가 없습니다. 날짜는 09.24처럼 적어 보세요.”(small, text_secondary)'
  icons: '선 SVG, 굵기 1.5(16 이하는 2), 둥근 끝, 색은 글자색을 따른다. 오른쪽 화살표, 아래 화살표, 바깥 화살표(↗), 돋보기, 아래 꺾쇠, 문서, 메뉴(세 줄), 닫기(×), 전등.'

states:
  hover: 부품마다 정의한 대로, 모두 180ms ease-out. 손가락 커서는 링크·버튼에만.
  focus: '키보드 포커스(focus-visible)에만 2px 강조색 바깥 링, 간격 3, 모서리는 부품 모서리 + 3. 표지는 rack_slot.focus.'
  empty: '브리핑 없는 날은 가판대 빈 자리와 국면 띠 점선 칸으로만 보이고 목록·표에는 행이 없다. 검색 결과가 없으면 search.empty.'
  missing:
    headline: 'note로 대신하고 앞에 작은 태그 “메모”(tag, 높이 22). note도 없으면 title.'
    phase: '배지 “?”, 이름 자리는 “판정 없음”.'
    prevPhase: 전날 국면 묶음(세로선 포함)을 숨긴다.
    provisional: '거짓이면 “임시 기준” 태그를 숨긴다.'
    numbers: '값 자리에 “—”(text_tertiary), 변화 줄은 “기록 없음”. 차트는 그날을 비운다(0으로 그리지 않는다).'
    btcd_change: '바로 앞 날짜에 btcd가 없으면 “전날 기록 없음”, 차이가 0이면 “전날과 같음”.'
    run: 실행 알약과 날짜 줄의 실행 문구를 숨긴다.
    url: 링크를 걸지 않는다. 표지·행은 누를 수 없고, 주 버튼은 40% 불투명으로 비활성.

formats:
  issue_no: '“제31호”. date·seq 오름차순으로 센 순번(첫 호 = 제1호).'
  date: '히어로 “2026.09.30” + “수요일” / 가판대 “09.30” + “수” / 목록 “09.30” + “수요일” / 툴팁 “9월 30일 수요일” / 축 “9.30” / 기간 “9월 2일 – 9월 30일”.'
  btcd: '“59.18%”, 소수 둘째 자리.'
  btcd_change: '“전날 +0.01%p” = 이번 호 btcd − 바로 앞 날짜 마지막 회차 btcd, 소수 둘째 자리.'
  stableD: '“9.125%”, 소수 셋째 자리.'
  stable1m: '“1개월 −0.705%p”, 소수 셋째 자리.'
  btc1m: '“+6.71%”, 소수 둘째 자리.'
  sign: '양수 “+”, 음수 “−”(U+2212, 하이픈 아님). 등락을 색으로 나타내지 않는다.'
  phase: '“국면 C · 선별적”, 걸친 판정 “국면 C→D”(U+2192).'
  run: '데이터 문구 그대로(“06:10 본실행”, “안전판”, “지연 실행 10:57”).'

accessibility:
  contrast: 'text_tertiary는 bg 대비 6.1, surface_2 대비 5.2. text_secondary는 어느 면에서도 8.4 이상. 강조색은 규칙상 surface_2 대비 4.5 이상(9/30 복숭아 9.2), accent_ink와 강조색은 5.2 이상. 국면 글자: A 6.3, B 5.0, C 6.4, D 7.1, E 6.4, ? 6.7. 기준선·태그 점선(line_ref)은 3.4 이상.'
  not_color_alone: 국면은 늘 글자(A~E, ?)와 함께. 최신 칸은 링과 날짜 숫자 색 두 가지로. 빈 자리는 점선과 “브리핑 없음” 글로. 임시 기준은 글과 점선으로.
  structure: 'header(상단 막대) · nav · main(히어로~서고 안내) · footer. h1은 히어로 헤드라인 하나, 구역 제목 h2, 카드·소제목 h3.'
  skip_link: '첫 Tab에 왼쪽 위 “본문으로 건너뛰기”(주 버튼 모양, 높이 40).'
  focus_order: '건너뛰기 → 로고 → 메뉴 6개 → 검색 범위 → 검색 입력 → 브리핑 펼치기 → 지난 호 넘겨 보기 → 국면 띠(Tab 한 번, 안에서 ←→, Enter로 열기) → 가판대 표지(최신순) → 표로 보기 → 목록 행 → 나머지 보기 → 부속 문서 링크 → 매크로 리스크 서고.'
  labels:
    cover: '“제31호, 2026년 9월 30일 수요일, 국면 C 선별적, 임시 기준, BTC는 일주일 만에 되밀렸는데, 알트 점유율은 오히려 올랐다, 브리핑 열기” 꼴. 표지 그림은 aria-hidden.'
    cell: '“{M}월 {D}일 {요일}, 국면 {X}에서 {Y}로 걸친 판정, {N}회 발행 중 마지막 회차” / “9월 18일 금요일, 브리핑 없음”.'
    chart: 'figure + 캡션 “BTC.D, 기록 26일, 최근 59.18%”. 펼치는 표가 대체 수단.'
    search: '범위 “검색 범위”, 입력 “지난 호 검색”, 결과 수는 polite 알림 “{N}호 찾음”.'
  motion: prefers-reduced-motion이면 들림·페이드·부드러운 스크롤을 끄고 색 변화만 남긴다.

