do:
  - 표지를 화면에서 가장 밝은 물체로 둔다. 후광·빛기둥·선반빛은 불투명 16%를 넘기지 않는다.
  - 강조색은 매일 최신 호 표지 테두리에서 한 번 뽑아 보정한 뒤, 페이지 전체에 같은 값으로 쓴다.
  - 국면은 어디서나 같은 배지 부품(S/M/L, 반반, ?)으로 보인다.
  - 숫자는 늘 부호와 단위(%, %p)를 붙이고, 열로 늘어선 숫자는 고정폭으로 맞춘다.
  - 화면 문구는 한국어. 티커(BTC.D, ΣSTABLECOIN.D, BTCUSD)와 국면 이름(BTC!, STICKY BTC.D)만 원문 그대로.
dont:
  - 표지에 테두리·필터·기울임·둥근 모서리·겹치기, 표지 위에 배지나 글자 얹기.
  - 등락에 빨강·초록·파랑 쓰기, 국면 색을 장식으로 쓰기, 강조색을 국면 표시에 쓰기.
  - 영어 장식 라벨, 0.04em을 넘는 한글 자간, 12 미만 글자.
  - 기록 없는 날을 0으로 그리거나 선으로 잇기, 발행 전 날짜를 빈칸으로 그리기.
  - 가판대에 최신 호를 다시 꽂기, 이번 달 표지를 “더 보기” 뒤에 숨기기.
  - 브리프에 없는 값(독자 수, 가격 등)이나 부속 문서·갱신 방식의 새 문구 만들기.
