# 크립토 브리핑 서고 — 시안 2 「편집국 1면」 디자인 명세. 개발자는 이 문서만 보고 그대로 구현한다.
meta:
  theme: "편집국 1면 (paper)"
  canvas: "데스크톱 1440px 한 장이 렌더 기준. 모바일 390px 적응은 mobile_390에 적는다."
  copy_rule: "화면 문구는 한국어. 브리프에 없는 값은 만들지 않는다. 통계·날짜 계산은 모두 데이터에서 한다."

intent:
  concept: "흑백 신문 1면. 종이색 바탕에 먹 한 가지, 굵은 괘선과 가는 괘선, 명조 제호. 페이지는 무채색만 쓰고 색은 표지에만 두어 표지가 1면 보도사진처럼 보이게 한다."
  mood: ["아침 조간의 정돈된 긴장", "절제된 권위", "촘촘하지만 줄이 맞는 지면", "시세표처럼 믿을 수 있는 숫자"]
  improvements_over_draft:
    - "제호를 132px에서 112px로 낮추고 좌우 귀퉁이 상자(오늘의 국면, 다음 호)를 단다. 판정과 다음 발행이 첫 화면 맨 위에서 읽힌다."
    - "'브리핑 전문 읽기'를 헤드라인 바로 밑 먹색 버튼으로 올려 1440×900 첫 화면 안에 둔다."
    - "숫자를 되풀이하던 해설 문단을 없애고, 지표 상자에 기준선(+1.0%p, 0)과의 관계를 적는다. '06:10 본실행'은 BTCUSD 밑이 아니라 킥커로 옮긴다."
    - "구역을 색(1면) → 흑백(국면과 지표) → 색(전체 표지) → 흑백(발행 목록) 순으로 번갈아 리듬을 만든다."
    - "국면 연표와 차트 3개를 한 날짜 축에 세로로 맞춰 같은 날을 한 세로줄로 읽게 하고, 차트에 눈금과 기준선을 넣는다."
    - "빠져 있던 발행 목록·지표 표를 한 표로 되살리고, 부속 문서·갱신 방식은 서고 안내로 모은다. 메뉴 이름은 구역 제목과 같게 한다."
    - "'No.31'을 '제31호'로 통일하고 모든 구역 머리를 같은 괘선 규칙으로 맞춘다. 9.18–19 공백을 표지 격자에도 드러낸다."

tokens:
  color:
    paper:      { hex: "#F2EEE4", role: "페이지 바탕(신문 용지). 질감·그라데이션 없는 단색" }
    paper_deep: { hex: "#E6E0D2", role: "눌린 면: 표 행 호버, 날짜 칸 강조 띠, 검색 결과 띠, 브리핑 없는 날 행" }
    ink:        { hex: "#16140F", role: "주 글자, 모든 괘선, 국면 도장, 먹색 버튼, 차트 선, 포커스 윤곽" }
    ink_2:      { hex: "#2D2A24", role: "본문·메모 글자, 먹색 버튼 호버 바탕" }
    ink_3:      { hex: "#5C574D", role: "보조 글자(날짜, 캡션, 눈금, 자리 표시), 점선 윤곽, 브리핑 없음 막대" }
    rule_hair:  { hex: "#C4BCAC", role: "가는 괘선, 표 행 구분, 차트 격자, 단 사이 세로선. 글자에는 쓰지 않는다" }
    halftone:   { hex: "#9A9281", role: "차트 기준 구역 망점: 지름 1.5px 점을 5px 간격 격자로" }
    on_ink:     { hex: "#F2EEE4", role: "먹 바탕 위 글자(도장, 버튼, 깃발)" }
    shadow:     { hex: "#16140F", role: "그림자 색. 불투명도는 shadow 토큰에" }
  font_family:
    serif:  "Noto Serif KR — 제호, 헤드라인, 구역 제목, 귀퉁이 본문, 목록 헤드라인"
    sans:   "Gothic A1 — 메뉴, 라벨, 캡션, 버튼, 표 머리, 안내문"
    mono:   "IBM Plex Mono — 날짜, 호 번호 숫자, 표·축 숫자"
    figure: "Oswald — 큰 지표 숫자와 국면 도장 글자에만. 숫자는 라이닝·고정폭"
    unused: "Outfit과 Bodoni Moda는 쓰지 않는다(영문 부제 없음). 한글에 가짜 기울임을 쓰지 않는다."
  type:  # size·line 단위 px
    nameplate:       { font: serif,  size: 112, weight: 900, line: 112, tracking: "-2px" }
    tagline:         { font: serif,  size: 16,  weight: 500, line: 24,  tracking: "0", color: ink_2, use: "제호 밑 표어 한 줄" }
    dateline:        { font: mono,   size: 13,  weight: 400, line: 20,  tracking: "0" }
    nav:             { font: sans,   size: 15,  weight: 700, line: 20,  tracking: "0" }
    label:           { font: sans,   size: 12,  weight: 800, line: 16,  tracking: "0.72px", use: "지표 이름·작은 제목. 라틴 대문자도 같은 값" }
    flag:            { font: sans,   size: 12,  weight: 800, line: 16,  tracking: "1px", color: on_ink }
    headline_lead:   { font: serif,  size: 56,  weight: 800, line: 68,  tracking: "-1px", use: "1면 헤드라인. 4줄 이상이면 48/58" }
    section_title:   { font: serif,  size: 36,  weight: 800, line: 44,  tracking: "-0.5px" }
    month_title:     { font: serif,  size: 22,  weight: 800, line: 28,  tracking: "-0.3px" }
    ear_main:        { font: serif,  size: 22,  weight: 800, line: 28,  tracking: "-0.3px" }
    teaser_headline: { font: serif,  size: 18,  weight: 700, line: 26,  tracking: "-0.2px" }
    list_headline:   { font: serif,  size: 15,  weight: 600, line: 22,  tracking: "0" }
    figure_lg:       { font: figure, size: 44,  weight: 500, line: 48,  tracking: "0" }
    figure_md:       { font: figure, size: 28,  weight: 500, line: 32,  tracking: "0" }
    stamp_letter:    { font: figure, weight: 600, size: "도장 L 24 · M 18 · S 12, 걸친 도장은 L 20 · M 15 · S 12", line: "도장 높이" }
    meta:            { font: sans,   size: 13,  weight: 500, line: 20,  tracking: "0", color: ink_3 }
    caption:         { font: sans,   size: 13,  weight: 500, line: 18,  tracking: "0", color: ink_3 }
    body_small:      { font: sans,   size: 14,  weight: 400, line: 22,  tracking: "0", color: ink_2 }
    button:          { font: sans,   size: 16,  weight: 800, line: 20,  tracking: "0.3px" }
    link_text:       { font: sans,   size: 13,  weight: 700, line: 20,  tracking: "0", use: "늘 밑줄 1px, 글자 아래 3px 띄움" }
    number:          { font: mono,   size: 13,  weight: 400, line: 20,  tracking: "0" }
    number_small:    { font: mono,   size: 12,  weight: 400, line: 16,  tracking: "0", color: ink_3 }
  type_rules: ["한글은 어절 단위 줄바꿈(keep-all). 글자 최소 12px", "음수는 U+2212 '−', 양수는 '+'를 붙인다", "표와 축의 숫자는 고정폭이라 소수점이 세로로 맞는다"]
  space: { scale: [4, 8, 12, 16, 24, 32, 40, 48, 64, 96], section_gap: 96, header_to_content: 32 }
  radius: { all: 0, exception: "차트 점만 원형" }
  rule:
    heavy:  "4px ink — 구역 머리 윗선"
    double: "4px ink + 3px 틈 + 1px ink — 제호 아래 겹괘"
    medium: "2px ink — 지표 상자 윗선, 표 머리 아랫선"
    thin:   "1px ink — 윗단 아래, 메뉴 아래, 구역 머리 아랫선, 귀퉁이 상자, 표지 받침선"
    hair:   "1px rule_hair — 표 행, 격자, 단 사이 세로선"
  shadow:  # x y 흐림 퍼짐(px) 불투명도, 색은 shadow
    cover_lead:        "0 1 2 0 16% + 0 14 28 -10 30%"
    cover_lead_hover:  "0 1 2 0 16% + 0 20 36 -10 34%"
    cover_thumb:       "0 1 1 0 18% + 0 6 12 -4 24%"
    cover_thumb_hover: "0 1 1 0 18% + 0 12 22 -6 30%"
    pop:               "0 4 14 0 16% — 툴팁, 범위 목록"
  motion:
    fast: "120ms — 밑줄, 툴팁, 날짜 띠"
    base: "180ms — 표지 들림과 그림자"
    easing: "cubic-bezier(0.2, 0, 0, 1)"
    reduced: "움직임 줄이기 설정이면 전환·들림·부드러운 스크롤 없이 바로 바뀐다"
  icon: "선 SVG, 굵기 1.75px, 끝 butt, 모서리 miter, 색은 글자색과 같게. 20px(버튼)·16px(글줄). 돋보기, →, ↓, ↑, 아래 꺾쇠, ×"

frame:
  width: "1440px. 좌우 여백 72px, 본문 1296px 가운데. 1024–1439px는 여백 48px에 단 폭만 비례로 줄인다."
  grid: "8단: 단 141px, 사이 24px. n단 왼쪽 x = 72 + (n−1)×165."
  background: "body 전체 paper 단색."
  vertical: "구역 사이 96px(앞 구역 내용 끝 → 다음 구역 4px 윗선). 윗단 40 + 1 + 제호 구역 192 + 겹괘 8 + 메뉴 56 + 1 = 298px, 1면 내용은 y 338에서 시작."

formats:
  issue: "'제31호'. 어디서도 'No.' 표기를 쓰지 않는다"
  date_long: "'2026년 9월 30일 수요일'"
  date_short: "'09.30 수'. 여러 번 발행한 날은 그날 모든 호에 '1회'·'2회'·'3회'를 붙인다"
  btcd: "'59.18%' 소수 둘째 자리"
  btcd_delta: "'전날 +0.01%p' — 직전 날짜 마지막 호와의 차이. 직전 날짜에 값이 없으면 '9.17 대비 ±x.xx%p'처럼 비교한 날을 적는다. 차이가 0이면 '전날과 같음'"
  stableD: "'9.125%' 소수 셋째 자리"
  stable1m: "'1개월 −0.705%p' 소수 셋째 자리, 부호"
  btc1m: "'+6.71%' 소수 둘째 자리, 부호"
  phase: "도장 글자 A–E, 이름 A 'BTC!' · B '알트시즌?' · C '선별적' · D 'STICKY BTC.D' · E '튀어?'. 걸친 판정 'C→D', 없으면 '?'와 '판정 없음'. provisional 참이면 '임시 기준'"
  run: "데이터 그대로: '06:10 본실행' · '안전판' · '지연 실행 10:57'"
  missing: "값 없음은 '—'(ink_3), 설명 자리는 '기록 없음'"

sections:
  - id: topbar
    title: "윗단"
    layout: "높이 40px, 세 칸(왼쪽·가운데·오른쪽 정렬), 아래 thin 괘선"
    content: { left: "최신 호 date_long + ' · 제31호' (dateline, ink)", center: "'매일 아침 06:10 발행 · 한국 시각' (dateline, ink_3)", right: "형제 서고 링크 '매크로 리스크 서고 →' (link_text)" }
  - id: nameplate
    title: "제호"
    layout: "위·아래 24px 여백(24 + 112 + 8 + 24 + 24 = 192px). 제호 글줄(112px)은 가운데, 본문 좌우 끝에 ear(256×104px)를 제호 글줄 세로 가운데에 맞춘다. 제호 밑 8px에 표어 한 줄, 그 밑 double 겹괘."
    content:
      nameplate: "'크립토 브리핑' (nameplate, ink)"
      tagline: "'날짜별로 모아 두는 크립토 브리핑 서고'(tagline), 가운데 한 줄. 글자 양옆 12px 띄워 길이 48px 1px ink 가로선(표어 장식)"
      ears: "왼쪽 ear '오늘의 국면', 오른쪽 ear '다음 호'"
  - id: nav
    title: "메뉴와 검색"
    layout: "높이 56px, 아래 thin 괘선. 스크롤하면 화면 위에 붙는다(paper 바탕, 같은 괘선). 왼쪽 nav, 오른쪽 search(400px)."
    content: "메뉴 5개: '1면' · '국면과 지표' · '전체 표지' · '발행 목록' · '서고 안내'"
  - id: front
    title: "1면 (구역 머리 없음)"
    layout: "메뉴 괘선 밑 40px. 1–3단(471px) 표지 열, 4–8단(801px) 기사 열, 두 열 윗선 맞춤."
    cover_column:
      - "cover_lead 471×693px → 최신 호 url"
      - "12px 뒤 캡션 한 줄(caption): '▲ 제31호 표지 · 동전 파이 · 딥 드라마 배색'. 그림·배색 이름은 지금 시안 캡션이 쓰는 값이고, 없으면 그 조각을 뺀다."
    story_column:
      - "킥커 줄 24px: flag '오늘의 1면' + 12px + run '06:10 본실행'(dateline, ink_3). 최신 호 날짜가 오늘(KST)이 아니면 flag는 '최신 호'."
      - "16px 뒤 헤드라인(headline_lead, ink): headline → 없으면 note → 없으면 title. 링크 아님, 자르지 않음, 두세 줄."
      - "24px 뒤 button_primary '브리핑 전문 읽기' → url, 왼쪽 정렬"
      - "32px 뒤 figure_box"
      - "32px 뒤 머리 줄: 왼쪽 label '직전 호', 오른쪽 button_text '전체 표지 ↓'. 밑 hair 괘선, 16px 뒤 teaser 2개 나란히(각 388px, 사이 24px): 제30호, 제29호"
  - id: market
    header: { title: "국면과 지표", meta: "하루 한 칸 · 여러 번 발행한 날은 마지막 회차 · 브리핑이 기록한 숫자" }
    layout:
      - "달 줄: month_title '2026년 9월'. 달이 둘 이상일 때만 오른쪽에 button_text '← {이전 달}' '{다음 달} →' (기본은 최신 달)."
      - "16px 뒤 날짜 축 틀: 왼쪽 96px는 이름·눈금 칸, 오른쪽 1200px 축을 그달 날수로 나눈다(9월 30칸 × 40px). 모든 트랙이 같은 칸 가운데를 쓴다."
      - "국면 트랙(44px): timeline_cell × 날수. 왼쪽 칸에 label '국면'."
      - "날짜 줄(20px): 칸 가운데 날짜 숫자(number_small). 최신 호 날짜만 ink 700. 왼쪽 칸 '9월'."
      - "12px 뒤 범례 한 줄(meta, 항목 사이 20px, 앞에 도장 S 견본): 'A BTC!' 'B 알트시즌?' 'C 선별적' 'D STICKY BTC.D' 'E 튀어?' '걸친 판정' '판정 없음' '브리핑 없음' '여러 번 발행(마지막 회차)' '오늘'"
      - "40px 뒤 chart 3개, 사이 28px: BTC.D → ΣSTABLECOIN.D 1개월 변화 → BTCUSD 1개월. 마지막 차트 밑에 날짜 줄을 한 번 더."
    guides: "월요일 칸의 왼쪽 경계에 세로 점선(1px rule_hair, 점 2px·틈 3px)을 국면 트랙과 각 차트 그림 안에만 긋는다."
    interaction: "국면 칸이나 차트 위 포인터(또는 연표 포커스)가 있는 날: 국면 트랙부터 마지막 차트까지 그 칸을 paper_deep 띠로 칠하고, 차트마다 세로 1px ink 선, 그리고 tooltip."
  - id: covers
    header: { title: "전체 표지", meta: "월별 · 최신 호부터 · 표지를 누르면 브리핑이 열립니다" }
    layout:
      - "달 머리 줄: 왼쪽 month_title '2026년 9월', 오른쪽 meta '31호 · 발행한 날 27일 · 브리핑 없는 날 2일 · 여러 번 발행한 날 3일'. 16px 뒤 격자. 달이 여럿이면 최신 달이 위, 달 사이 64px."
      - "격자 8열(141px, 사이 24px), 최신 호가 왼쪽 위. 칸 = cover_thumb. 브리핑 없는 날이 이어진 묶음마다 cover_gap 한 칸을 날짜 자리에 넣는다(9월: 제20호와 제19호 사이). 9월은 31 + 1 = 32칸으로 네 줄이 꽉 찬다."
      - "받침: 줄마다 표지 밑 10px에 thin 가로 괘선(본문 폭 전체), 괘선 밑 8px에 캡션. 줄 사이 40px."
      - "검색 중: 격자 위 search_result_bar. 맞지 않는 칸은 숨기고 남은 칸을 앞으로 당긴다. cover_gap과 달 머리 통계도 숨긴다."
  - id: list
    header: { title: "발행 목록", meta: "회차마다 한 줄 · 헤드라인을 누르면 브리핑이 열립니다" }
    layout:
      - "달 머리 줄(month_title) → 12px → list_table(본문 폭)."
      - "처음에는 최신 10줄만. 표 밑 row_toggle '나머지 21호 펼치기'(숫자는 계산), 펼친 뒤 '접기'. 검색 중에는 맞는 줄을 모두 보이고 row_toggle을 숨긴다."
      - "12px 뒤 각주(meta): '* 임시 기준으로 판정한 호 · — 기록 없음 · 전날은 직전 날짜 마지막 호와 비교'"
  - id: about
    header: { title: "서고 안내", meta: "갱신 방식 · 기록 현황 · 부속 문서" }
