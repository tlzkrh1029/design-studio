<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크립토 브리핑 서고</title>
<!-- page type: Noto Serif KR, Gothic A1, Oswald, IBM Plex Mono, Bodoni Moda italic -->
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/oswald/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/oswald/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/bodoni-moda/500-italic.css">
<!-- the fixed cover component draws its wordmark in Outfit; the page itself never uses it -->
<link rel="stylesheet" href="../node_modules/@fontsource/outfit/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/outfit/800.css">
<link rel="stylesheet" href="../mz.css">
<style>
:root{
  /* color tokens */
  --paper:#F3EFE6; --paper-2:#E8E2D5; --ink:#1B1916; --ink-2:#4A453D; --ink-3:#655E53;
  --rule-hair:#BDB4A3; --on-ink:#F3EFE6;
  /* font stacks */
  --serif:'Noto Serif KR',serif;
  --sans:'Gothic A1',sans-serif;
  --num:'Oswald','Gothic A1',sans-serif;
  --mono:'IBM Plex Mono','Gothic A1',monospace;
  --disp:'Bodoni Moda',serif;
  /* shadows */
  --sh-rest:0 1px 2px rgba(27,25,22,.16),0 8px 16px -8px rgba(27,25,22,.32);
  --sh-lead:0 2px 4px rgba(27,25,22,.14),0 28px 48px -20px rgba(27,25,22,.45);
  --sh-hover:0 2px 4px rgba(27,25,22,.16),0 18px 30px -12px rgba(27,25,22,.42);
  --sh-tip:0 8px 20px -8px rgba(27,25,22,.35);
  /* rules */
  --r-heavy:3px solid var(--ink); --r-ink:1px solid var(--ink); --r-hair:1px solid var(--rule-hair);
  /* frame */
  --container:1296px; --col:86px; --gut:24px;
  --nav-h:52px; --folio-h:40px; --anchor:76px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
html.is-searching{--anchor:116px}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:break-word}
/* paper grain: fixed layer; its height follows the document so a full-sheet capture is textured top to bottom */
body::before{content:""; position:fixed; inset:0 0 auto 0; height:max(100vh,var(--page-h,100vh)); z-index:-1; pointer-events:none; background-image:var(--grain,none); background-size:170px 170px; opacity:.5}
[hidden]{display:none!important}
a{color:inherit}
button,input,select{font:inherit; color:inherit}
.sr{position:absolute!important; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
.wrap{width:var(--container); margin:0 auto; position:relative}
.ic{display:block; flex:none}
.nil{color:var(--ink-3)}

/* focus */
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink); outline-offset:3px; border-radius:0}
.ix-cell:focus-visible,.side-item:focus-visible{outline-offset:4px}
.skip{position:absolute; left:-9999px; top:16px; z-index:100; background:var(--ink); color:var(--on-ink); font:700 14px/20px var(--sans); padding:10px 14px; text-decoration:none}
.skip:focus{left:16px}

/* shared type */
.meta-s{font:600 12px/18px var(--sans); color:var(--ink-2)}
.caption{font:500 13px/20px var(--sans); color:var(--ink-2); margin:0}
.kicker{font:800 13px/20px var(--sans); letter-spacing:.06em; color:var(--ink)}
.item-hl{font:700 16px/23px var(--serif); letter-spacing:-.01em; color:var(--ink)}
.idx-date{font:700 13px/20px var(--sans); color:var(--ink)}
.mono-s{font:400 12px/18px var(--mono); color:var(--ink-2); font-variant-numeric:tabular-nums}
.text-link{display:inline-flex; align-items:center; gap:6px; color:var(--ink); background:none; border:0; padding:0; cursor:pointer; text-decoration:none}
.text-link span{text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; transition:text-decoration-thickness 120ms linear}
.text-link:hover span{text-decoration-thickness:2px}

/* column head */
.colhead{display:flex; align-items:center; gap:8px; padding-bottom:12px; border-bottom:var(--r-ink)}
.colhead::before{content:""; width:8px; height:8px; background:var(--ink); flex:none}
.colhead .meta-s{margin-left:auto}

/* phase badge */
.bdg{display:inline-flex; align-items:center; justify-content:center; flex:none; width:20px; height:20px; border:1px solid var(--ink); background:var(--paper); font:600 12px/18px var(--num); color:var(--ink)}
.bdg-span{width:40px}
.bdg-span i{flex:1 1 0; font-style:normal; text-align:center; line-height:18px}
.bdg-span i+i{border-left:1px solid var(--ink)}
.bdg-miss{border:1px dashed var(--ink-3); color:var(--ink-3)}

/* covers */
.cv{position:relative; flex:none}
.cv-lead{box-shadow:var(--sh-lead)}
.cv-rest{box-shadow:var(--sh-rest); transition:transform 180ms var(--ease),box-shadow 180ms var(--ease)}
.cv-fb{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; background:var(--paper-2); border:1px dashed var(--ink-3)}
.cv-fb b{font:700 13px/20px var(--sans); color:var(--ink-2)}
a.ix-cell:hover .cv-rest,a.side-item:hover .cv-rest{transform:translateY(-4px); box-shadow:var(--sh-hover)}

/* ---------- header ---------- */
.masthead{position:sticky; top:-204px; z-index:20; background:var(--paper)}
.masthead::before{content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; background-image:var(--grain,none); background-size:170px 170px; opacity:.5}
.folio{height:41px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; border-bottom:var(--r-ink); font:500 13px/20px var(--sans); letter-spacing:.02em; color:var(--ink)}
.folio>:first-child{justify-self:start}
.folio>:nth-child(2){justify-self:center}
.folio>:last-child{justify-self:end}
.folio a{display:inline-flex; align-items:center; gap:6px; text-decoration:none}
.folio a:hover span{text-decoration:underline; text-underline-offset:3px}
.plate{padding:20px 0 18px; display:grid; grid-template-columns:240px 1fr 240px; align-items:center}
.plate h1{grid-column:2; grid-row:1; margin:0; text-align:center; font:900 84px/84px var(--serif); letter-spacing:-.04em; color:var(--ink)}
.ear{grid-row:1; display:flex; flex-direction:column}
.ear-l{grid-column:1; text-align:left}
.ear-r{grid-column:3; text-align:right}
.ear-t{font:800 12px/20px var(--sans); letter-spacing:.06em; color:var(--ink)}
.ear-b{font:500 13px/20px var(--sans); color:var(--ink-2)}
.plate-sub{grid-column:1/-1; grid-row:2; margin-top:10px; display:flex; align-items:center; justify-content:center; gap:12px}
.plate-en{font:italic 500 20px/24px var(--disp); color:var(--ink)}
.plate-bar{width:1px; height:12px; background:var(--ink-3)}
.plate-ko{font:500 13px/20px var(--sans); letter-spacing:.04em; color:var(--ink-2)}
.dbl{height:7px; border-top:3px solid var(--ink); border-bottom:1px solid var(--ink)}
.navbar{height:53px; display:flex; align-items:center; justify-content:space-between; border-bottom:var(--r-ink)}
.nav-list{display:flex; gap:28px; margin:0; padding:0; list-style:none; align-self:stretch}
.nav-link{display:flex; align-items:baseline; gap:6px; height:52px; padding-top:16px; text-decoration:none; color:var(--ink)}
.nav-no{font:600 12px/20px var(--sans); letter-spacing:.02em; color:var(--ink-3)}
.nav-name{position:relative; font:700 15px/20px var(--sans); color:var(--ink)}
.nav-link:hover .nav-name{text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:6px}
.nav-link[aria-current="true"] .nav-name{font-weight:800}
.nav-link[aria-current="true"] .nav-name::after{content:""; position:absolute; left:0; right:0; top:calc(100% + 13px); height:3px; background:var(--ink)}
.search{display:flex; width:420px; height:36px; margin:0; border:1px solid var(--ink); background:var(--paper)}
.s-scope{position:relative; width:104px; flex:none}
.s-scope select{-webkit-appearance:none; appearance:none; display:block; width:100%; height:100%; margin:0; border:0; border-radius:0; background:transparent; padding:0 26px 0 12px; font:600 13px/20px var(--sans); color:var(--ink); cursor:pointer}
.s-scope .ic{position:absolute; right:10px; top:50%; margin-top:-6px; pointer-events:none; color:var(--ink)}
.s-div{width:1px; flex:none; background:var(--ink)}
.s-field{position:relative; flex:1 1 auto; min-width:0}
.s-field .ic{position:absolute; left:12px; top:50%; margin-top:-8px; pointer-events:none; color:var(--ink)}
.s-field input{-webkit-appearance:none; appearance:none; display:block; width:100%; height:100%; margin:0; border:0; border-radius:0; background:transparent; padding:0 4px 0 40px; font:500 14px/20px var(--sans); color:var(--ink); text-overflow:ellipsis}
.s-field input::-webkit-search-cancel-button,.s-field input::-webkit-search-decoration{-webkit-appearance:none; appearance:none; display:none}
.s-field input::placeholder{color:var(--ink-3); opacity:1}
.s-go{width:56px; flex:none; margin:0; border:0; border-radius:0; background:var(--ink); color:var(--on-ink); font:700 13px/20px var(--sans); cursor:pointer; transition:background-color 120ms linear,color 120ms linear,box-shadow 120ms linear}
.s-go:hover{background:var(--paper); color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.srbar{height:41px; display:flex; align-items:center; justify-content:space-between; gap:24px; background:var(--paper-2); border-bottom:var(--r-ink)}
.srbar-t{font:600 13px/20px var(--sans); color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.srbar .text-link{font:600 13px/20px var(--sans); flex:none}

/* ---------- sections ---------- */
.sec{scroll-margin-top:var(--anchor)}
.sec-2{margin-top:0}
.sec-3,.sec-4,.sec-5{margin-top:64px}
.flag{border-top:var(--r-heavy); padding-top:14px; padding-bottom:12px; border-bottom:var(--r-ink); margin-bottom:28px}
.flag-row{height:40px; display:flex; align-items:center; justify-content:space-between; gap:24px}
.flag-l{display:flex; align-items:center; gap:12px}
.page-tag{display:inline-flex; align-items:center; height:24px; padding:0 8px; border:1px solid var(--ink); font:700 12px/22px var(--sans); letter-spacing:.04em; color:var(--ink)}
.sec-title{margin:0; font:800 32px/40px var(--serif); letter-spacing:-.02em; color:var(--ink)}
.sec-meta{font:500 13px/20px var(--sans); color:var(--ink-2)}
.flag-r{display:flex; align-items:center; gap:16px}
.no-hit{color:var(--ink-3)}

/* ---------- 1면 ---------- */
.front{padding:32px 0 48px; scroll-margin-top:var(--anchor)}
.fp{position:relative; display:grid; grid-template-columns:416px 526px 306px; column-gap:24px; align-items:start}
.fp-rule{position:absolute; left:978px; top:0; width:1px; height:612px; background:var(--rule-hair)}
.fp-cover a{display:block; width:416px}
.fp-cap{margin-top:12px}
.fp-story{height:612px; padding-left:24px; display:flex; flex-direction:column; justify-content:space-between}
.fp-top{display:flex; flex-direction:column; align-items:stretch}
.lead-hl{margin:24px 0 0; font:800 48px/60px var(--serif); letter-spacing:-.03em; color:var(--ink); word-break:keep-all; overflow-wrap:break-word}
.lead-hl.is-step{font-size:42px; line-height:52px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:4; overflow:hidden}
.verdict{margin-top:20px; display:flex; align-items:center; gap:16px}
.stamp{display:inline-flex; align-items:center; justify-content:center; flex:none; width:48px; height:48px; border:2px solid var(--ink); font:600 28px/28px var(--num); color:var(--ink)}
.stamp-span{width:96px}
.stamp-span i{flex:1 1 0; align-self:stretch; display:flex; align-items:center; justify-content:center; font-style:normal}
.stamp-span i+i{border-left:2px solid var(--ink)}
.stamp-miss{border-style:dashed; border-color:var(--ink-3); color:var(--ink-3)}
.v-text{display:flex; flex-direction:column; gap:6px}
.v-phase{font:800 18px/24px var(--sans); letter-spacing:-.01em; color:var(--ink)}
.v-sub{display:flex; align-items:center; gap:10px}
.chip{display:inline-flex; align-items:center; height:24px; padding:0 8px; border:1px dashed var(--ink); font:700 12px/16px var(--sans); letter-spacing:.02em; color:var(--ink)}
.btn-primary{margin-top:28px; align-self:flex-start; display:inline-flex; align-items:center; gap:10px; height:52px; padding:0 24px; background:var(--ink); color:var(--on-ink); font:700 16px/20px var(--sans); letter-spacing:.01em; text-decoration:none; transition:background-color 120ms linear,color 120ms linear,box-shadow 120ms linear}
.btn-primary:hover{background:var(--paper); color:var(--ink); box-shadow:inset 0 0 0 2px var(--ink)}
.btn-primary:active{transform:translateY(1px)}
.btn-primary.is-off{background:var(--paper-2); color:var(--ink-3); border:1px dashed var(--ink-3); cursor:default}
.figs{border-top:var(--r-heavy); display:grid; grid-template-columns:repeat(3,1fr)}
.fig{padding:16px 16px 0; min-width:0}
.fig:first-child{padding-left:0}
.fig+.fig{border-left:var(--r-hair)}
.fig-l{font:500 12px/16px var(--mono); letter-spacing:.06em; color:var(--ink); white-space:nowrap}
.fig-v{margin-top:8px; font:500 46px/46px var(--num); letter-spacing:-.01em; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap}
.fig-s{margin-top:8px; font:500 13px/19px var(--sans); color:var(--ink-2)}
.fp-side{height:612px; display:flex; flex-direction:column; justify-content:space-between}
.side-list{margin-top:20px}
.side-sep{height:1px; background:var(--rule-hair); margin:20px 0}
.side-item{display:grid; grid-template-columns:96px 194px; column-gap:16px; align-items:start; text-decoration:none; color:inherit}
.side-item .item-hl{margin-top:6px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:4; overflow:hidden; word-break:keep-all; overflow-wrap:break-word}
a.side-item:hover .item-hl{text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px}
.side-foot{margin-top:8px; display:flex; align-items:center; gap:8px}
.next{margin-top:16px; display:grid; grid-template-columns:96px 194px; column-gap:16px; align-items:start}
.slot{width:96px; height:141px; border:1px dashed var(--ink-3); display:flex; align-items:center; justify-content:center; font:700 12px/18px var(--sans); color:var(--ink-3)}

/* ---------- 2면 ---------- */
.month+.month{margin-top:48px}
.mo-head{display:flex; align-items:center; justify-content:space-between; padding-bottom:10px; border-bottom:var(--r-hair); margin-bottom:24px}
.mo-title{margin:0; font:700 20px/28px var(--serif); color:var(--ink)}
.ix-grid{display:grid; grid-template-columns:repeat(8,141px); column-gap:24px; row-gap:32px}
.ix-cell{position:relative; display:block; width:141px; text-decoration:none; color:inherit}
.ix-l1{margin-top:10px; height:20px; display:flex; align-items:center; justify-content:space-between; gap:8px}
.ix-l2{margin-top:2px}
.ix-cell .tip{position:absolute; top:calc(100% + 8px); left:0; z-index:6}
.ix-cell .tip.to-left{left:auto; right:0}

/* ---------- 3면 ---------- */
.pm{position:relative}
.pm-row{display:grid; grid-template-columns:180px 24px 1044px 48px; box-sizing:content-box}
.pm-row>.pm-name{grid-column:1; grid-row:1; min-width:0}
.pm-row>.pm-area{grid-column:3; grid-row:1; position:relative}
.pm-row>.pm-ticks{grid-column:4; grid-row:1; position:relative}
.pm-dates{height:52px; border-bottom:var(--r-ink)}
.pm-lanes{height:160px; border-bottom:var(--r-hair)}
.pm-panel{height:168px; border-bottom:var(--r-hair)}
.pm-panel.is-end{border-bottom:var(--r-ink)}
.pm-month{align-self:end; padding-bottom:4px; font:700 13px/20px var(--sans); color:var(--ink)}
.pm-dcells{display:flex}
.dc{flex:none; height:52px; padding-top:4px; display:flex; flex-direction:column; align-items:center; transition:background-color 120ms linear}
.dc-n{display:block; font:500 14px/18px var(--num); color:var(--ink); font-variant-numeric:tabular-nums}
.dc.is-today .dc-n{width:28px; height:20px; margin:-1px 0; line-height:20px; text-align:center; background:var(--ink); color:var(--on-ink)}
.dc-w{font:500 11px/14px var(--sans); color:var(--ink-3)}
.dc-c{font:600 10px/12px var(--sans); color:var(--ink-2)}
.dc.is-fut .dc-n,.dc.is-fut .dc-w{color:var(--ink-3)}
.dc.is-hot{background:var(--paper-2)}
.lane-labels{padding-top:8px}
.lane-l{height:24px; display:flex; align-items:baseline; gap:8px; white-space:nowrap}
.lane-k{width:10px; flex:none; font:600 14px/24px var(--num); color:var(--ink)}
.lane-n{font:500 12px/24px var(--sans); color:var(--ink-2)}
.pm-svg{display:block}
.pn{padding-top:24px}
.pn-name{font:500 12px/16px var(--mono); letter-spacing:.06em; color:var(--ink); white-space:nowrap}
.pn-val{margin-top:6px; font:500 32px/32px var(--num); letter-spacing:-.01em; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap}
.pn-sup{margin-top:6px; font:500 12px/18px var(--sans); color:var(--ink-2); display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden}
.pl{position:absolute; left:0; top:24px; width:1044px; height:120px}
.pl svg{position:absolute; left:0; top:0; display:block; overflow:visible}
.pl-ref{position:absolute; right:0; padding:1px 4px; background:var(--paper); font:700 11px/14px var(--sans); color:var(--ink); white-space:nowrap}
.pl-zone{position:absolute; left:6px; font:500 11px/14px var(--sans); color:var(--ink-2); white-space:nowrap}
.tick{position:absolute; left:8px; font:400 11px/14px var(--mono); color:var(--ink-3); white-space:nowrap; font-variant-numeric:tabular-nums}
.s-guide,.s-grid,.s-mon{stroke:var(--rule-hair); stroke-width:1; stroke-dasharray:1 2; fill:none}
.s-bar{fill:var(--ink)}
.s-miss{fill:none; stroke:var(--ink-3); stroke-width:1; stroke-dasharray:3 2}
.s-fill{fill:var(--paper-2)}
.s-zero{stroke:var(--ink-3); stroke-width:1; fill:none}
.s-ref{stroke:var(--ink); stroke-width:1.5; stroke-dasharray:5 4; fill:none}
.s-line{fill:none; stroke:var(--ink); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.s-pt{fill:var(--ink)}
.s-halo{fill:var(--paper)}
.s-hatch{stroke:var(--ink-3); stroke-width:1}
.pm-ov{position:absolute; left:204px; top:53px; pointer-events:none}
.pm-ov svg{display:block}
.hol-l{position:absolute; transform:translateX(-50%); padding:2px 4px; background:var(--paper); font:700 12px/16px var(--sans); color:var(--ink-2); white-space:nowrap}
.pm-hits{position:absolute; left:204px; top:0; width:1044px; height:721px}
.pm-hit{position:absolute; top:0; height:100%; cursor:pointer}
.pm-hit.is-fut{cursor:default}
.pm-hit:focus-visible{outline:none}
.pm-vline{position:absolute; top:53px; width:1px; height:668px; background:var(--ink); pointer-events:none}
.pm-hits:focus-within .pm-hit:focus{outline:2px solid var(--ink); outline-offset:-2px}
.pm .tip{position:absolute; top:53px; z-index:6}
.pm-legend{margin-top:12px; display:flex; align-items:center; gap:20px; font:500 13px/20px var(--sans); color:var(--ink-2)}
.lg{display:inline-flex; align-items:center; gap:8px}
.lg svg{display:block}

/* tooltip */
.tip{width:260px; padding:12px 14px; background:var(--paper); border:var(--r-ink); box-shadow:var(--sh-tip); color:var(--ink); text-align:left; pointer-events:none; opacity:0; transition:opacity 100ms linear}
.tip.is-on{opacity:1}
.tip-t{font:700 13px/20px var(--sans)}
.tip-p{margin-top:4px; font:600 13px/20px var(--sans)}
.tip-n{margin-top:8px; font:400 12px/18px var(--mono); font-variant-numeric:tabular-nums}
.tip-h{margin-top:8px; font:500 14px/21px var(--serif); display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; word-break:keep-all}
.tip-g{margin-top:8px; font:500 11px/16px var(--sans); color:var(--ink-3)}

/* ---------- 4면 ---------- */
.il{width:var(--container); border-collapse:separate; border-spacing:0; table-layout:fixed}
.il th{height:52px; padding:0 12px 8px; vertical-align:bottom; text-align:left; font:700 12px/16px var(--sans); letter-spacing:.02em; color:var(--ink); border-top:var(--r-heavy); border-bottom:var(--r-ink); white-space:nowrap}
.il th:first-child,.il td:first-child{padding-left:0}
.il th:last-child,.il td:last-child{padding-right:0; padding-left:24px}
.il .r{text-align:right}
.il-mo td{padding:16px 0 8px!important; font:700 15px/22px var(--serif); color:var(--ink); border-bottom:var(--r-ink)}
.il-row td{height:56px; padding:12px; vertical-align:middle; border-bottom:var(--r-hair); transition:background-color 120ms linear}
.il-row:hover td{background:var(--paper-2)}
.il-row.is-last td{border-bottom:var(--r-ink)}
.c-vol{font:700 13px/20px var(--sans); color:var(--ink)}
.c-date{font:500 13px/20px var(--sans); color:var(--ink)}
.c-ph .bdg{vertical-align:middle}
.il-hl{font:500 15px/22px var(--serif); letter-spacing:-.01em; color:var(--ink); text-decoration:none; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; word-break:keep-all; overflow-wrap:break-word}
a.il-hl:hover{text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px}
.num{font:400 13px/20px var(--mono); color:var(--ink); text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.btn-more{margin-top:16px; width:100%; height:48px; display:flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--ink); border-radius:0; background:transparent; font:700 14px/20px var(--sans); color:var(--ink); cursor:pointer; transition:background-color 120ms linear}
.btn-more:hover{background:var(--paper-2)}

/* ---------- 판권 ---------- */
.colophon{padding-bottom:64px}
.colo-grid{display:grid; grid-template-columns:526px 416px 306px; column-gap:24px; align-items:start}
.colo-body{margin-top:16px}
.body{margin:0; font:400 15px/26px var(--serif); color:var(--ink-2)}
.att+.att{margin-top:12px; padding-top:12px; border-top:var(--r-hair)}
.att-t{font:600 15px/22px var(--serif); color:var(--ink); text-decoration:none}
a.att-t:hover{text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px}
.att .caption{margin-top:4px}
.sib{display:block; padding:20px; border:1px solid var(--ink); text-decoration:none; color:inherit; transition:background-color 120ms linear}
.sib:hover{background:var(--paper-2)}
.sib-top{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
.sib-name{font:800 20px/28px var(--serif); letter-spacing:-.01em; color:var(--ink)}
.sib-top .ic{margin-top:5px}
.sib .meta-s{margin-top:8px}
.imprint{margin-top:48px; padding-top:14px; border-top:var(--r-heavy); display:flex; align-items:center; justify-content:space-between; gap:24px}
.imprint .text-link{font:500 13px/20px var(--sans)}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important; animation:none!important}
  a.ix-cell:hover .cv-rest,a.side-item:hover .cv-rest{transform:none}
}

<script>
(function(){
  /* Magazine covers for daily briefs. The frame stays the same on every issue (border, masthead, three
     cover lines, bottom strip) so the shelf reads as one publication. Inside it each issue gets its own
     colour scheme and hue, the day's headline in a kicker-lead-main hierarchy, and one of about forty
     pictures chosen from what the headline talks about and which indicators the brief recorded. */
  var BK=(function(){
  var PHN={A:'BTC!',B:'알트시즌?',C:'선별적',D:'STICKY BTC.D',E:'튀어?'};
  var WDK=['일','월','화','수','목','금','토'];
  var UID=0, FL=124;

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function n1(x){return Math.round(x*100)/100;}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function f2(v,d){return v==null?'–':v.toFixed(d);}
  function sgn(v,d){if(v==null) return '–'; var s=Math.abs(v).toFixed(d); return (Number(s)===0?'':(v>0?'+':'−'))+s;}
  function chg(v,d,unit){if(v==null) return ''; return Number(Math.abs(v).toFixed(d))===0?'전날과 같음':'전날 '+sgn(v,d)+unit;}
  function dnum(d){var a=d.split('-').map(Number); return Math.round(Date.UTC(a[0],a[1]-1,a[2])/864e5);}
  function parts(p){if(!p) return []; return String(p).split(/→|->|>/).map(function(s){return s.trim().toUpperCase();}).filter(function(s){return /^[A-E]$/.test(s);});}
  function hash(s){var h=2166136261>>>0; for(var i=0;i<s.length;i++){h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0;} return h;}

    return [4.0767416621*l-3.3077115913*m+0.2309699292*s, -1.2684380046*l+2.6097574011*m-0.3413193965*s, -0.0041960863*l-0.7034186147*m+1.7076147010*s];
  }
  function hex3(c){return '#'+c.map(function(v){var x=Math.round(clamp(toS(clamp(v,0,1)),0,1)*255); return (x<16?'0':'')+x.toString(16);}).join('').toUpperCase();}
  function inG(c){return c[0]>=-1e-4&&c[0]<=1.0001&&c[1]>=-1e-4&&c[1]<=1.0001&&c[2]>=-1e-4&&c[2]<=1.0001;}

    var up=lum(bg)<0.2, L=t[0], c=ok(L,t[1],t[2]);

    return c;

  var SCH=[
    {n:'보색 라이트', bg:[.955,.028,0], ink:[.22,.04,0], fr:[.63,.17,180], c1:[.57,.14,0], c2:[.80,.09,25], c3:[.66,.19,180]},
    {n:'딥 드라마', dk:1, bg:[.27,.075,0], ink:[.97,.012,0], fr:[.84,.14,165], c1:[.56,.12,0], c2:[.74,.08,0], c3:[.86,.15,165], hl:'fr'},
    {n:'파스텔 삼색', bg:[.92,.05,0], ink:[.27,.06,240], fr:[.66,.15,120], c1:[.74,.11,240], c2:[.80,.09,60], c3:[.62,.17,120]},
    {n:'무채색과 포인트', bg:[.94,.006,0], ink:[.19,.01,0], fr:[.63,.19,0], c1:[.78,.012,0], c2:[.64,.014,0], c3:[.62,.19,0]},
    {n:'유사색', bg:[.93,.045,0], ink:[.24,.06,0], fr:[.56,.16,35], c1:[.66,.14,15], c2:[.78,.11,-20], c3:[.55,.18,55]},
    {n:'강한 바탕', bg:[.74,.14,0], ink:[.17,.03,180], fr:[.30,.07,180], c1:[.38,.10,180], c2:[.95,.025,0], c3:[.93,.11,60]},

    {n:'단색조', bg:[.89,.065,0], ink:[.2,.05,0], fr:[.44,.14,0], c1:[.6,.12,0], c2:[.73,.1,0], c3:[.34,.12,0]},

  ];

  function palette(si,H){
    var S=SCH[si], o={si:si, name:S.n, dark:!!S.dk, H:Math.round(H)}, R={};
    ['bg','ink','fr','c1','c2','c3'].forEach(function(k){
      var r=S[k], h=((((r.length>3?r[3]:H+r[2])%360)+360)%360), L=r[0], C=r[1];
      /* yellows go olive when they are dark: lift the bright picture colours near hue 100 */

      R[k]=[L,C,h]; o[k]=ok(L,C,h);
    });

    var bgL=R.bg[0];

      var r=R[k], L=r[0], up=o.dark||(bgL<0.85&&L>bgL), min=o.dark?2.1:1.55;

    o.frInk=cr('#FFFFFF',o.fr)>=cr('#17181A',o.fr)?'#FFFFFF':ok(.2,.03,R.fr[2]);
    o.c3Ink=cr('#FFFFFF',o.c3)>=cr('#17181A',o.c3)?'#FFFFFF':'#17181A';
    o.c2Ink=cr('#FFFFFF',o.c2)>=cr('#17181A',o.c2)?'#FFFFFF':'#17181A';
    o.c1Ink=cr('#FFFFFF',o.c1)>=cr('#17181A',o.c1)?'#FFFFFF':'#17181A';
    /* neutrals for poles, pipes, plinths: tinted with the ground hue, placed away from the ground lightness */
    var hb=R.bg[2], NL=o.dark?[.66,.58,.5,.42]:bgL<0.85?[.93,.87,.54,.38]:[.88,.79,.65,.46];
    o.n0=ok(NL[0],.014,hb); o.n1=ok(NL[1],.016,hb); o.n2=ok(NL[2],.018,hb); o.n3=ok(NL[3],.02,hb);

  }
  function hueOf(b){return ((dnum(b.date)*137.508+(b.seq-1)*57)%360+360)%360;}
  function pickScheme(D,recent){
    var warn=D.P==='D'||D.P==='E', i=((dnum(D.b.date)+(D.b.seq-1)*5)%12+12)%12, last=recent.slice(-2);
    for(var k=0;k<12;k++){var s=CYC[(i+k)%12]; if(warn&&DARKS.indexOf(s)<0) continue; if(last.indexOf(s)<0) return s;}
    return CYC[i];
  }

  /* ---- data ---- */
  function prevOf(b,all){
    var p=null;
    all.forEach(function(x){ if((x.date<b.date||(x.date===b.date&&x.seq<b.seq)) && x.btcd!=null) p=x; });
    return p;
  }
  function valOf(x,key){ if(key==='alt') return (x.btcd!=null&&x.stableD!=null)?100-x.btcd-x.stableD:null; return x[key]; }
  function histOf(b,all,key,n){
    var m={}, order=[];
    all.forEach(function(x){
      var v=valOf(x,key);
      if((x.date<b.date||(x.date===b.date&&x.seq<=b.seq)) && v!=null){ if(!(x.date in m)) order.push(x.date); m[x.date]=v; }
    });
    return order.slice(-n).map(function(d){return {d:d,v:m[d]};});
  }
  /* headline: the clause after the last ', ' or ' — ' is the punchline (main), the part before it the lead */
  function split(h){
    h=String(h||'').trim(); if(!h) return {lead:'',main:''};
    var best=-1, sep='';
    [', ',' — ',' – '].forEach(function(s){var i=h.lastIndexOf(s); if(i>best && h.length-i-s.length>=6 && i>=4){best=i; sep=s;}});
    if(best<0) return {lead:'',main:h};
    return {lead:h.slice(0,best)+(sep===', '?',':''), main:h.slice(best+sep.length)};
  }
  /* numbers with a unit are the one emphasis inside a headline */
  function emph(t){return esc(t).replace(/([+−\-]?\d[\d,.]*\s?(?:%p|%|bp|달러|배))/g,'<em>$1</em>');}
  function textWidth(s){
    var w=0; for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);
      if(c>=0xAC00&&c<=0xD7A3) w+=0.97; else if(c===32) w+=0.26; else if(c>=48&&c<=57) w+=0.6;
      else if(c>=65&&c<=90) w+=0.68; else if(c>=97&&c<=122) w+=0.55; else if(c===37) w+=0.86; else w+=0.36;}
    return w;
  }
  function linesAt(s,fs,width){return Math.max(1,Math.ceil(textWidth(s)*fs*1.1/width));}
  function fitMain(main,hasLead,leadLines){
    var budget=33.4-(2.9*1.1+1.5)-(hasLead?(leadLines*3.55*1.34+1.5):0), W=87.2, sizes=[9,8.4,7.8,7.2,6.6,6,5.4,4.9,4.5];
    for(var i=0;i<sizes.length;i++){var f=sizes[i], L=linesAt(main,f,W); if(L<=4 && L*f*1.14<=budget) return {fs:f,lines:L};}
    var f0=4.5; return {fs:f0,lines:Math.max(1,Math.floor(budget/(f0*1.14)))};
  }
  /* what a clause is about. Share indicators first (earliest mention wins), then policy events, then price */
  var KW={
    BTC:/BTC\.?D|도미넌스|비트코인 점유율|계단|내려앉|밀렸|밀리|대형주/,
    ALT:/알트|꼬리|종목|계열|중소형|점유율/,
    STABLE:/현금|스테이블|STABLE|유동성|자금/i,
    MACRO:/연준|FOMC|금리|\d+bp|법안|표결|클로처|SEC|규제|의회|상원|하원|정책|대통령|관세/,
    PRICE:/\d[\d,]*달러|사이클선|숏|반등|되밀|급등|급락|신고가/
  };
  function kwFocus(t){
    if(!t) return null; var best=null, at=1e9;
    ['BTC','ALT','STABLE'].forEach(function(k){var m=KW[k].exec(t); if(m && m.index<at){at=m.index; best=k;}});
    if(best) return best;
    if(KW.MACRO.test(t)) return 'MACRO';
    if(KW.PRICE.test(t)) return 'PRICE';
    return null;
  }
  function info(b,all,vol){
    var ps=parts(b.phase), P=ps.length?ps[ps.length-1]:'X';
    var a=b.date.split('-').map(Number), wdi=new Date(dnum(b.date)*864e5).getUTCDay();
    var pv=prevOf(b,all), btc=b.btcd, st=b.stableD, alt=(btc!=null&&st!=null)?100-btc-st:null;
    var dB=(pv&&btc!=null&&pv.btcd!=null)?btc-pv.btcd:null, dS=(pv&&st!=null&&pv.stableD!=null)?st-pv.stableD:null;
    var dA=(dB!=null&&dS!=null)?-(dB+dS):null;
    var sp=split(b.headline), noteParts=String(b.note||'').split(/\s·\s/).map(function(s){return s.trim();}).filter(Boolean);
    var lead=sp.lead, main=sp.main;
    if(!main){ main=noteParts[0]||(ps.length?'국면 '+ps.join('→'):'첫 기록'); }
    var cache={};
    return {b:b, P:P, ps:ps, vol:vol, y:a[0], m:a[1], d:a[2], wd:WDK[wdi], wdi:wdi,
      btc:btc, st:st, alt:alt, dB:dB, dS:dS, dA:dA, b1m:b.btc1m, s1m:b.stable1m,
      lead:lead, main:main, noteParts:noteParts, headline:b.headline||'', note:b.note||'',
      r:rng(hash(b.date+'#'+b.seq)), id:'mz'+(++UID),
      hist:function(key,n){var k=key+'/'+n; return cache[k]||(cache[k]=histOf(b,all,key,n));}};
  }
  /* what the picture is about: the indicator the headline names, else the one that moved most since the previous brief */
  function focusOf(D){
    var has={BTC:D.btc!=null, ALT:D.alt!=null, STABLE:D.st!=null, MACRO:true, PRICE:D.b1m!=null};
    var src=[D.main, D.lead]; if(!D.headline) src.push(D.note);
    for(var i=0;i<src.length;i++){var f=kwFocus(src[i]); if(f&&has[f]) return f;}
    var c=[['BTC',D.dB],['STABLE',D.dS],['ALT',D.dA]].filter(function(q){return q[1]!=null;})
      .sort(function(x,y){return Math.abs(y[1])-Math.abs(x[1]);});
    if(c.length && Math.abs(c[0][1])>=0.15) return c[0][0];
    if(D.alt!=null) return 'MIX';
    if(D.btc!=null) return 'BTC';
    return 'TYPE';
  }
  var LAB={BTC:'BTC.D',ALT:'ALT',STABLE:'ΣSTABLECOIN.D'};
  function keyF(F){return F==='ALT'?'alt':F==='STABLE'?'stableD':F==='PRICE'?'btc1m':'btcd';}
  function shareOf(D,F){return F==='BTC'?D.btc:F==='ALT'?D.alt:F==='STABLE'?D.st:null;}
  function dOf(D,F){return F==='BTC'?D.dB:F==='ALT'?D.dA:F==='STABLE'?D.dS:null;}
  function mover(D){
    var c=[['BTC',D.dB],['STABLE',D.dS],['ALT',D.dA]].filter(function(q){return q[1]!=null;})
      .sort(function(x,y){return Math.abs(y[1])-Math.abs(x[1]);});
    return c.length?c[0][0]:(D.btc!=null?'BTC':null);
  }
  /* the share the picture points at: the named one, or for mixed pictures the one that moved most */
  function hiOf(D,F){return (F==='BTC'||F==='ALT'||F==='STABLE')?F:(mover(D)||'ALT');}
  function histN(D,F,n){return D.hist(keyF(F),n);}
  function span(H,min){var vs=H.map(function(h){return h.v;}), lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs); return {lo:lo,hi:hi,rg:Math.max(hi-lo,min||.3)};}
  /* consecutive declines up to the latest value */
  function fallRun(H){var k=0; for(var i=H.length-1;i>0;i--){ if(H[i].v<H[i-1].v) k++; else break; } return k;}

  /* ---- captions under the picture ---- */

  TL.forEach(function(x,i){ if(wd(x.d)==='월'){ var xx=Math.round(i*CW)+.5; ov+='<line class="s-mon" x1="'+xx+'" x2="'+xx+'" y1="0" y2="'+OH+'"/>'; } });
  ov+='</svg>';
  bands.forEach(function(b2){ ov+='<span class="hol-l" style="left:'+(((b2[0]+b2[1]+1)/2)*CW).toFixed(2)+'px; top:'+(80-10)+'px">휴간</span>'; });
  ov+='</div>';
  s+=ov;
  /* hit targets for hover / keyboard */
  s+='<div class="pm-vline" id="pm-vline" hidden></div><div class="pm-hits" id="pm-hits" role="group" aria-label="날짜별 국면과 지표">';
  TL.forEach(function(x,i){
    var lab;
    if(x.hol) lab=dMdw(x.d)+', 휴간';
    else if(x.fut||!x.last) lab=dMdw(x.d)+', 아직 발행 전';
    else { var b=x.last; lab=dMdw(x.d)+', '+volT(b)+', '+phaseAria(b.phase).replace('국면 미기록','국면 미기록')+(b.provisional?', 임시 기준':'')+(b.btcd!=null?', BTC.D '+FMT.btcd(b.btcd):''); }
    var focusable=!x.fut&&(x.hol||x.last);
    s+='<div class="pm-hit'+(x.fut?' is-fut':'')+'" data-i="'+i+'" role="'+(x.last&&x.last.url?'link':'button')+'" tabindex="'+(focusable?(x.d===L.date?0:-1):-1)+'"'+(focusable?'':' aria-disabled="true"')+' aria-label="'+esc(lab)+'" style="left:'+(i*CW).toFixed(2)+'px;width:'+CW.toFixed(2)+'px"></div>';
  });
  s+='</div><div class="tip" id="pm-tip" role="tooltip" hidden></div>';
  /* legend */
  s+='<div class="pm-legend">'
    +'<span class="lg"><svg width="24" height="12" aria-hidden="true"><rect class="s-bar" width="24" height="12"/></svg>그날 판정</span>'
    +'<span class="lg"><svg width="24" height="12" aria-hidden="true"><rect class="s-bar" x="0" y="0" width="12" height="6"/><rect class="s-bar" x="12" y="6" width="12" height="6"/></svg>걸친 판정(왼쪽→오른쪽)</span>'
    +'<span class="lg"><svg width="24" height="12" aria-hidden="true"><rect class="s-miss" x=".5" y=".5" width="23" height="11"/></svg>국면 미기록</span>'
    +'<span class="lg"><svg width="24" height="12" aria-hidden="true"><rect width="24" height="12" fill="url(#hatch)"/></svg>휴간</span>'
    +'<span class="lg"><svg width="24" height="12" aria-hidden="true"><line class="s-ref" x1="0" x2="24" y1="6" y2="6"/></svg>판정 기준선</span>'
    +'</div>';
  s+='</div></div></section>';
  H.push(s);
})();

  s+='</div><p class="caption no-hit" hidden>이 면에는 맞는 항목이 없습니다.</p></div></section>';

H.push('</main>');

(function(){
  var s='<footer class="sec sec-5 colophon" id="p5" aria-labelledby="p5-h"><div class="wrap">'+flag('판권','갱신 방식과 부속 문서','','p5-h');

  s+='</div></footer>';

document.getElementById('app').innerHTML=H.join('');

/* ================= behaviour ================= */
var $=function(s,r){return (r||document).querySelector(s);}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* sticky header: only the nav bar (and result bar) stays on screen */
function pinHeader(){var hd=$('.masthead'), nb=$('.navbar'); if(hd&&nb) hd.style.top=(-nb.offsetTop)+'px';}

/* current section in the menu: the one crossing the line 30% from the top */
var SECS=['p1','p2','p3','p4','p5'];
function markCurrent(){
  var line=window.innerHeight*0.3, cur='p1';
  SECS.forEach(function(id){var el=document.getElementById(id); if(el&&el.getBoundingClientRect().top<=line) cur=id;});
  $$('.nav-link').forEach(function(a){ if(a.getAttribute('data-sec')===cur) a.setAttribute('aria-current','true'); else a.removeAttribute('aria-current'); });
}
if('IntersectionObserver' in window){
  var io=new IntersectionObserver(markCurrent,{rootMargin:'-30% 0px -69% 0px'});
  SECS.forEach(function(id){var el=document.getElementById(id); if(el) io.observe(el);});
}

/* 4면 fold */
var folded=true;
function listLastRow(){ var vis=$$('.il-row').filter(function(r){return !r.hidden;}); $$('.il-row.is-last').forEach(function(r){r.classList.remove('is-last');}); if(vis.length) vis[vis.length-1].classList.add('is-last'); }
function applyFold(){
  $$('.il-row').forEach(function(r,i){ r.hidden=folded&&i>=FOLD; });
  var btn=$('#il-more'); if(btn){ btn.setAttribute('aria-expanded',folded?'false':'true'); btn.innerHTML=folded?'<span>나머지 '+(B.length-FOLD)+'호 모두 보기</span>'+icon('down',16):'<span>최근 '+FOLD+'호만 보기</span>'+icon('up',16); }
  listLastRow(); setPageH();
}
var moreBtn=$('#il-more'); if(moreBtn) moreBtn.addEventListener('click',function(){folded=!folded; applyFold();});
listLastRow();

/* tooltips */
function showTip(tip){ tip.hidden=false; void tip.offsetWidth; tip.classList.add('is-on'); }
function hideTip(tip){ tip.classList.remove('is-on'); tip.hidden=true; }

/* 3면 day targets */
(function(){
  var hits=$('#pm-hits'); if(!hits) return;
  var tip=$('#pm-tip'), vl=$('#pm-vline'), dcs=$$('.dc'), timer=null, on=-1;
  function open(i){
    var x=TL[i]; if(!x||x.fut||(!x.hol&&!x.last)) return close();
    on=i; dcs.forEach(function(d,j){d.classList.toggle('is-hot',j===i);});
    vl.hidden=false; vl.style.left=(204+Math.round(i*CW+CW/2))+'px';
    tip.innerHTML=x.hol?tipHoliday(x.d):tipIssue(x.last,x.is.length);
    var left=204+(i+1)*CW+12; if(left+260>1296) left=204+i*CW-12-260;
    tip.style.left=left+'px'; showTip(tip);
  }
  function close(){ on=-1; clearTimeout(timer); dcs.forEach(function(d){d.classList.remove('is-hot');}); vl.hidden=true; hideTip(tip); }
  function go(i){ var x=TL[i]; if(x&&x.last&&x.last.url) window.open(x.last.url,'_blank','noopener'); }
  var cells=$$('.pm-hit',hits);
  cells.forEach(function(c){
    var i=+c.getAttribute('data-i');
    c.addEventListener('mouseenter',function(){clearTimeout(timer); timer=setTimeout(function(){open(i);},250);});
    c.addEventListener('mouseleave',function(){clearTimeout(timer); if(document.activeElement!==c) close();});
    c.addEventListener('focus',function(){open(i);});
    c.addEventListener('blur',close);
    c.addEventListener('click',function(){go(i);});
  });
  var focusables=cells.filter(function(c){return c.getAttribute('aria-disabled')!=='true';});
  hits.addEventListener('keydown',function(e){
    var k=e.key, cur=focusables.indexOf(document.activeElement); if(cur<0) return;
    var nx=cur;
    if(k==='ArrowRight') nx=Math.min(focusables.length-1,cur+1); else if(k==='ArrowLeft') nx=Math.max(0,cur-1);
    else if(k==='Home') nx=0; else if(k==='End') nx=focusables.length-1;
    else if(k==='Enter'){ go(+document.activeElement.getAttribute('data-i')); e.preventDefault(); return; }
    else if(k==='Escape'){ close(); return; }
    else return;
    e.preventDefault(); focusables.forEach(function(c){c.tabIndex=-1;}); focusables[nx].tabIndex=0; focusables[nx].focus();
  });
})();

/* 2면 cell tooltip */
(function(){
  $$('a.ix-cell').forEach(function(c){
    var timer=null, tip=null, b=B[+c.getAttribute('data-i')];
    function open(){ if(!tip){ tip=document.createElement('div'); tip.className='tip'; tip.setAttribute('role','tooltip'); tip.innerHTML=tipIssue(b,1); c.appendChild(tip); }
      var r=c.getBoundingClientRect(), wr=$('.wrap').getBoundingClientRect(); tip.classList.toggle('to-left',r.left+260>wr.right); showTip(tip); }
    function close(){ clearTimeout(timer); if(tip) hideTip(tip); }
    c.addEventListener('mouseenter',function(){clearTimeout(timer); timer=setTimeout(open,250);});
    c.addEventListener('mouseleave',function(){ if(document.activeElement!==c) close(); });
    c.addEventListener('focus',open); c.addEventListener('blur',close);
    c.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
  });
})();

/* search */
(function(){
  var form=$('#sform'), inp=$('#s-q'), sel=$('#s-scope'), bar=$('#srbar'), barT=$('#srbar-t'), timer=null;
  function low(s){return String(s==null?'':s).toLowerCase();}
  var HAY={};
  B.forEach(function(b){ var p=P(b.date), w=wd(b.date);
    HAY[b.id]=low([volT(b),String(vol(b)),b.date,mdot(b.date),p.m+'.'+p.d,dMd(b.date),dMid(b.date),w+'요일',b.headline,b.note,b.title,b.phase,phaseText(b.phase),parts(b.phase).map(function(k){return PHN[k];}).join(' '),runLabel(b)].join(' \u0001 ')); });
  var AHAY=ATT.map(function(a){return low([a.title,a.desc,a.date,mdot(a.date),dMd(a.date)].join(' \u0001 '));});
  var UHAY=low(UPDATE_TEXT);
  function run(jump){
    var q=inp.value.trim(), nq=low(q), sc=sel.value, on=!!nq;
    function inS(x){return sc==='전체'||sc===x;}
    var n={cv:0,row:0,att:0,upd:0};
    $$('.ix-cell').forEach(function(c){ var ok=!on||!inS('표지')||HAY[B[+c.getAttribute('data-i')].id].indexOf(nq)>=0; c.hidden=!ok; if(on&&inS('표지')&&ok) n.cv++; });
    $$('.month').forEach(function(m){ m.hidden=!$$('.ix-cell',m).some(function(c){return !c.hidden;}); });
    $('#p2 .no-hit').hidden=!(on&&inS('표지')&&n.cv===0);
    if(on&&inS('발행 목록')){
      $$('.il-row').forEach(function(r){ var ok=HAY[B[+r.getAttribute('data-i')].id].indexOf(nq)>=0; r.hidden=!ok; if(ok) n.row++; });
      if(moreBtn) moreBtn.hidden=true;
    } else { if(moreBtn) moreBtn.hidden=false; applyFold(); }
    $$('.il-mo').forEach(function(m){ var k=m.getAttribute('data-month'); m.hidden=!$$('.il-row[data-month="'+k+'"]').some(function(r){return !r.hidden;}); });
    $('#p4 .no-hit').hidden=!(on&&inS('발행 목록')&&n.row===0);
    $('#il-box').hidden=on&&inS('발행 목록')&&n.row===0;
    listLastRow();
    $$('.att').forEach(function(a){ var ok=!on||!inS('부속 문서')||AHAY[+a.getAttribute('data-a')].indexOf(nq)>=0; a.hidden=!ok; if(on&&inS('부속 문서')&&ok) n.att++; });
    $('#c-att .no-hit').hidden=!(on&&inS('부속 문서')&&ATT.length&&n.att===0);
    var uok=!on||!inS('갱신 방식')||UHAY.indexOf(nq)>=0; $('#upd-p').hidden=!uok; if(on&&inS('갱신 방식')&&uok) n.upd=1;
    $('#c-upd .no-hit').hidden=uok;
    setPageH();
    if(!on){ bar.hidden=true; document.documentElement.classList.remove('is-searching'); pinHeader(); return; }
    var parts2=[]; if(n.cv) parts2.push('표지 '+n.cv+'권'); if(n.row) parts2.push('발행 목록 '+n.row+'건'); if(n.att) parts2.push('부속 문서 '+n.att+'건'); if(n.upd) parts2.push('갱신 방식 '+n.upd+'건');
    barT.textContent=parts2.length?'“'+q+'” — '+parts2.join(' · ')+(sc!=='전체'?' · 범위 '+sc:''):'“'+q+'”와 맞는 호가 없습니다.';
    bar.hidden=false; document.documentElement.classList.add('is-searching'); pinHeader();
    if(jump){ var t=n.cv?'p2':n.row?'p4':(n.att||n.upd)?'p5':null; if(t) document.getElementById(t).scrollIntoView({behavior:RM?'auto':'smooth'}); }
  }
  inp.addEventListener('input',function(){clearTimeout(timer); timer=setTimeout(function(){run(false);},120);});
  sel.addEventListener('change',function(){run(false);});
  form.addEventListener('submit',function(e){e.preventDefault(); clearTimeout(timer); run(true);});
  $('#s-all').addEventListener('click',function(){inp.value=''; sel.value='전체'; run(false); inp.focus();});
})();

/* reference-line labels: right end, just above the line; if the plotted data would touch the label there,
   mirror it just below the line (inside the shaded criterion zone) so nothing overlaps */
function touches(g,x0,x1,y0,y1){
  var c=2, i, j, s;
  for(i=0;i<g.pts.length;i++){ var p=g.pts[i], r=p[2]; if(p[0]+r>x0-c&&p[0]-r<x1+c&&p[1]+r>y0-c&&p[1]-r<y1+c) return true; }
  for(s=0;s<g.segs.length;s++){ var sg=g.segs[s];
    for(j=1;j<sg.length;j++){ var a=sg[j-1], b=sg[j], xa=Math.max(a[0],x0-c), xb=Math.min(b[0],x1+c);
      for(var x=xa;x<=xb;x+=0.5){ var yy=a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]); if(yy+1>y0-c&&yy-1<y1+c) return true; } } }
  return false;
}
function placeRefLabels(){
  Object.keys(GEO).forEach(function(pid){
    var el=document.getElementById(pid+'-ref'); if(!el) return;
    var g=GEO[pid], w=el.offsetWidth, h=el.offsetHeight, x1=1044, x0=x1-w, above=g.refY-0.75-h, below=g.refY+0.75, top=above;
    if(touches(g,x0,x1,above,above+h)&&!touches(g,x0,x1,below,below+h)) top=below;
    el.style.top=top.toFixed(2)+'px';
    el.setAttribute('data-side',top===above?'above':'below');
  });
}
function setPageH(){ document.documentElement.style.setProperty('--page-h',document.documentElement.scrollHeight+'px'); }
window.addEventListener('resize',setPageH);

/* type fitting after the fonts arrive: step the lead headline down if it runs past 4 lines */
function fitLead(){
  var h=$('#lead-hl'); if(!h) return;
  h.classList.remove('is-step');
  var lines=Math.round(h.scrollHeight/60);
  var top=$('.fp-top'), figs=$('#figs'), gap=612-top.offsetHeight-figs.offsetHeight;
  if(lines>4||gap<32) h.classList.add('is-step');
}
pinHeader(); markCurrent();
window.addEventListener('scroll',function(){ if(!markCurrent._r){ markCurrent._r=requestAnimationFrame(function(){ markCurrent._r=0; markCurrent(); }); } },{passive:true});
void document.body.offsetHeight;
placeRefLabels(); setPageH();
document.fonts.ready.then(function(){ fitLead(); placeRefLabels(); pinHeader(); markCurrent(); setPageH(); });
ready();   /* 반드시 마지막에 한 번 */
})();
