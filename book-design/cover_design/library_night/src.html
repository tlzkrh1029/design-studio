<title>크립토 브리핑 서고 ⭕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Oswald:wght@500;600&family=Outfit:wght@700;800&display=swap">
<style>
/* Layout: 밤의 가판대. 거의 검은 바탕에서 표지만 빛을 받는다. 최신 호는 전등 아래 받침에 세우고, 지난 호는 선반에 줄지어 꽂는다.
   폭 1440 기준 고정 배치(내용 1312). 1280~1439는 같은 배치를 비율대로 줄이고, 1280 미만은 명세의 모바일 규칙으로 쌓는다. 한 가지 어두운 화면만 쓴다. */
:root{
  color-scheme:dark;
  --bg:#0C0E12; --bg-band:#101318; --s1:#14181E; --s2:#1A1F26;
  --line-subtle:#232932; --line-strong:#39414C; --line-ref:#6B727C; --lamp-shade:#5A616B;
  --stand-top:#2E3440; --stand-front:#181C23;
  --lamp:#FFF3E4; --lamp-rgb:255,243,228;
  --t1:#F2F0EC; --t2:#B4B9C1; --t3:#8A919B;
  --accent:#F2B39F; --accent-ink:#0C0E12;
  --glow:color-mix(in srgb,var(--accent) 16%,transparent);
  --wash:color-mix(in srgb,var(--accent) 12%,transparent);
  --accent-line:color-mix(in srgb,var(--accent) 45%,transparent);
  --ph-a:#CB8242; --ph-b:#A96CAF; --ph-c:#056F15; --ph-d:#594D99; --ph-e:#2B97FF; --ph-none:#2A3039;
  --edge:rgba(255,255,255,.14);

  --f-sans:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --f-disp:'Oswald','Gothic A1','Arial Narrow',sans-serif;
  --f-mono:'IBM Plex Mono','Gothic A1',ui-monospace,monospace;
  --ty-wordmark:800 17px/1 var(--f-sans);
  --ty-nav:600 14px/1 var(--f-sans);
  --ty-kicker:700 14px/1.3 var(--f-sans);
  --ty-date:500 48px/1 var(--f-disp);
  --ty-headline:800 44px/1.28 var(--f-sans);
  --ty-section:800 28px/1.3 var(--f-sans);
  --ty-phase:700 18px/1.3 var(--f-sans);
  --ty-card:700 16px/1.4 var(--f-sans);
  --ty-fig-xl:500 40px/1 var(--f-disp);
  --ty-fig-l:500 28px/1 var(--f-disp);
  --ty-body:400 16px/1.6 var(--f-sans);
  --ty-body-s:400 15px/1.7 var(--f-sans);
  --ty-row:600 16px/1.5 var(--f-sans);
  --ty-meta:500 14px/1.5 var(--f-sans);
  --ty-small:500 13px/1.45 var(--f-sans);
  --ty-caption:500 12px/1.4 var(--f-sans);
  --ty-button:700 16px/1 var(--f-sans);
  --ty-ticker:500 12px/1.3 var(--f-mono);
  --ty-data-l:500 15px/1.3 var(--f-mono);
  --ty-data:500 14px/1.4 var(--f-mono);
  --ty-data-m:500 13px/1.4 var(--f-mono);
  --ty-data-s:400 12px/1.3 var(--f-mono);

  --r-badge-s:4px; --r-badge-m:6px; --r-badge-l:8px; --r-cell:6px; --r-tag:6px; --r-tooltip:8px;
  --r-button:10px; --r-input:10px; --r-popover:12px; --r-card:14px; --r-pill:999px;

  --sh-cover-hero:0 40px 80px rgba(0,0,0,.6),0 12px 24px rgba(0,0,0,.45);
  --sh-cover-rack:0 10px 18px rgba(0,0,0,.55);
  --sh-cover-rack-hover:0 18px 30px rgba(0,0,0,.6);
  --sh-plank:0 12px 20px rgba(0,0,0,.55);
  --sh-popover:0 24px 48px rgba(0,0,0,.5);
  --ease:180ms ease-out;

  --content:1312px;
  --bar-h:64px;
  --hero-h:802px;
  --hero-cover-w:400px;
  --hero-cover-h:calc(400px / .68);
  --rack-w:143px;
  --rack-h:calc(143px / .68);
  --rn:8; --rg:24px;
  --z:1;
}

/*<<MZCSS>>*/

/* ===== base (never reaches into .mz covers) ===== */
html{background:var(--bg);scroll-behavior:smooth;scroll-padding-top:var(--sp,64px)}
body{margin:0;background:var(--bg);color:var(--t1);font:var(--ty-body);word-break:keep-all;overflow-wrap:break-word}
#app{zoom:var(--z)}
:where(body *:not(.mz):not(.mz *)),:where(body *:not(.mz):not(.mz *))::before,:where(body *:not(.mz):not(.mz *))::after{box-sizing:border-box}
:where(h1,h2,h3,p,ul,dl,dt,dd,figure,figcaption):not(.mz *){margin:0;padding:0}
:where(ul):not(.mz *){list-style:none}
:where(a):not(.mz *){color:inherit;text-decoration:none}
:where(button):not(.mz *){font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.wrap{width:min(var(--content),calc(100% - 32px));margin:0 auto}
.ko{font-family:var(--f-sans)}
svg.ic{display:block;flex:none}

/* dashed outlines drawn in SVG so the dash pattern is exact */
.dsh{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.dsh rect{x:.5px;y:.5px;width:calc(100% - 1px);height:calc(100% - 1px);fill:none;stroke-width:1;stroke:var(--line-strong)}

/* ===== skip link ===== */
.skip{position:fixed;left:16px;top:12px;z-index:100;height:40px;padding:0 20px;display:inline-flex;align-items:center;border-radius:var(--r-button);background:var(--accent);color:var(--accent-ink);font:var(--ty-button);transform:translateY(-300%)}
.skip:focus-visible{transform:none}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 24px;border-radius:var(--r-button);font:var(--ty-button);white-space:nowrap;cursor:pointer;transition:background-color var(--ease),border-color var(--ease),transform var(--ease),color var(--ease)}
.btn-pri{background:var(--accent);color:var(--accent-ink);border:0}
.btn-pri:hover{background:color-mix(in srgb,var(--accent),#FFFFFF 10%)}
.btn-pri:active{transform:translateY(1px)}
.btn-pri.off{opacity:.4;pointer-events:none}
.btn-sec{background:transparent;color:var(--t1);border:1px solid var(--line-strong)}
.btn-sec:hover{background:var(--s2);border-color:var(--t3)}
.btn-sec.h44{height:44px;font-size:14px}
.btn-sec.h40{height:40px;font-size:14px}
.btn-sec.h36{height:36px;font-size:14px}
.btn-txt{font:600 13px/1.45 var(--f-sans);color:var(--accent);cursor:pointer;text-underline-offset:3px}
.btn-txt:hover{text-decoration:underline;text-decoration-thickness:1px}

/* ===== phase badge ===== */
.bd{position:relative;display:inline-flex;flex:none;overflow:hidden;vertical-align:middle;font-family:var(--f-disp);font-weight:600;line-height:1}
.bd i{flex:1 1 0;display:flex;align-items:center;justify-content:center;font-style:normal}
.bd::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--edge);pointer-events:none}
.bd-s{width:22px;height:22px;border-radius:var(--r-badge-s);font-size:13px}
.bd-s.split{width:32px;font-size:12px}
.bd-m{width:28px;height:28px;border-radius:var(--r-badge-m);font-size:15px}
.bd-m.split{width:40px;font-size:13px}
.bd-l{width:36px;height:36px;border-radius:var(--r-badge-l);font-size:20px}
.bd-l.split{width:52px;font-size:17px}

/* ===== tag (dashed = provisional) ===== */
.tag{position:relative;display:inline-flex;align-items:center;flex:none;height:28px;padding:0 10px;border-radius:var(--r-tag);font:600 13px/1.45 var(--f-sans);color:var(--t2);white-space:nowrap}
.tag .dsh rect{stroke:var(--line-ref)}
.tag.tag-s{height:22px;vertical-align:1px;margin-right:8px}

/* ===== pill ===== */
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--line-strong);font:600 12px/1.4 var(--f-sans);color:var(--t3);white-space:nowrap}
.pill.hi{color:var(--t1)}

/* ===== top bar ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:var(--bar-h);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 -1px 0 var(--line-subtle)}
.top .wrap{height:100%;display:flex;align-items:center}
.logo{display:flex;align-items:center;height:100%;flex:none}
.logo .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--glow);margin-right:8px}
.logo b{font:var(--ty-wordmark);letter-spacing:-.01em;color:var(--t1)}
.logo .sub{margin-left:5px;font:var(--ty-wordmark);font-weight:400;letter-spacing:-.01em;color:var(--t2)}
.nav{display:flex;gap:28px;margin-left:56px;height:100%}
.nav a{position:relative;display:flex;align-items:center;height:100%;font:var(--ty-nav);color:var(--t2);white-space:nowrap;transition:color var(--ease)}
.nav a:hover{color:var(--t1)}
.nav a.on{color:var(--t1)}
.nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.nav a:focus-visible{outline-offset:-2px}
.nbtns{display:none}

/* search */
.search{position:relative;margin-left:auto;display:flex;align-items:center;width:360px;height:40px;background:var(--s2);border:1px solid var(--line-strong);border-radius:var(--r-input);transition:border-color var(--ease)}
.search:focus-within{border-color:var(--accent)}
.scope{position:relative;flex:none;display:flex;align-items:center;width:88px;height:100%;border-right:1px solid var(--line-strong)}
.scope select{appearance:none;-webkit-appearance:none;width:100%;height:100%;padding:0 26px 0 12px;background:transparent;border:0;border-radius:var(--r-input) 0 0 var(--r-input);color:var(--t1);font:600 13px/1.45 var(--f-sans);cursor:pointer}
.scope select:focus-visible{outline:none}
.scope select option{background:var(--s1);color:var(--t1)}
.scope .ic{position:absolute;right:10px;top:50%;margin-top:-6px;color:var(--t1);pointer-events:none}
.qbox{flex:1;min-width:0;display:flex;align-items:center;height:100%;padding:0 9px 0 12px}
.qbox .ic{color:var(--t3)}
.qbox input{flex:1;min-width:0;height:100%;margin:0 8px;padding:0;background:transparent;border:0;outline:0;color:var(--t1);font:var(--ty-meta)}
.qbox input::placeholder{color:var(--t3);opacity:1}
.kbd{flex:none;display:flex;align-items:center;justify-content:center;width:20px;height:20px;border:1px solid var(--line-strong);border-radius:4px;font:var(--ty-data-s);color:var(--t3)}
.results{position:absolute;right:-1px;top:calc(100% + 9px);width:480px;padding:8px;background:var(--s1);border:1px solid var(--line-strong);border-radius:var(--r-popover);box-shadow:var(--sh-popover)}
.results[hidden]{display:none}
.rs-row{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:8px;transition:background-color var(--ease)}
.rs-row:hover{background:var(--s2)}
.rs-row .d{flex:none;font:var(--ty-data-m);color:var(--t2)}
.rs-row .h{flex:1;min-width:0;font:var(--ty-meta);color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs-foot{display:flex;padding:10px 12px 4px}
.rs-empty{padding:10px 12px;font:var(--ty-small);color:var(--t2)}
mark{background:var(--wash);color:var(--t1);border-radius:2px}

/* ===== hero: today's issue under the lamp ===== */
.hero{position:relative;height:var(--hero-h);overflow:hidden}
.hero .stage{position:relative;width:var(--content);height:100%;margin:0 auto}
.art{position:absolute;left:0;top:0;width:640px;height:100%}
.halo{position:absolute;left:-100px;top:-42px;width:840px;height:880px;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.beam{position:absolute;left:20px;top:50px;width:600px;height:656px;filter:blur(16px);pointer-events:none}
.beam i{position:absolute;inset:0;clip-path:polygon(268px 0,332px 0,600px 656px,0 656px);background:linear-gradient(rgba(var(--lamp-rgb),.09),rgba(var(--lamp-rgb),.02))}
.lamp{position:absolute;left:280px;top:0;overflow:visible}
.lamp .cord{stroke:var(--line-strong);stroke-width:1}
.lamp .shade{fill:var(--s1);stroke:var(--lamp-shade);stroke-width:1.5;stroke-linejoin:round}
.lamp .bulb{fill:rgba(var(--lamp-rgb),.9)}
.hcover{position:absolute;left:120px;top:104px;z-index:3;display:block;width:var(--hero-cover-w);box-shadow:var(--sh-cover-hero)}
.stand{position:absolute;left:100px;top:calc(104px + var(--hero-cover-h));z-index:4;width:440px;height:14px;border-radius:2px;background:linear-gradient(var(--stand-top) 0 4px,var(--stand-front) 4px 100%);box-shadow:var(--sh-plank)}
.pool{position:absolute;left:40px;top:684px;z-index:5;width:560px;height:56px;background:radial-gradient(closest-side,rgba(var(--lamp-rgb),.07),rgba(var(--lamp-rgb),0));clip-path:inset(calc(104px + var(--hero-cover-h) - 684px) 0 0 0);pointer-events:none}
.stand-cap{position:absolute;left:0;width:640px;top:calc(104px + var(--hero-cover-h) + 14px + 24px);text-align:center;font:var(--ty-small);color:var(--t3)}
@keyframes lampOn{from{opacity:0}to{opacity:1}}
.halo,.beam,.lamp .bulb,.pool{animation:lampOn 700ms ease-out both}

.htext{position:absolute;left:672px;top:104px;z-index:6;width:640px;height:var(--hero-cover-h);display:flex;flex-direction:column;justify-content:center}
.kicker{display:flex;align-items:center;gap:12px;font:var(--ty-kicker);letter-spacing:.04em;color:var(--accent)}
.kicker::before{content:"";flex:none;width:32px;height:1px;background:var(--accent)}
.dateline{display:flex;align-items:baseline;gap:16px;margin-top:16px}
.dateline .dd{font:var(--ty-date);letter-spacing:.01em;color:var(--t1);font-variant-numeric:proportional-nums}
.dateline .dw{font:var(--ty-body);color:var(--t2)}
.hl{margin-top:28px;font:var(--ty-headline);letter-spacing:-.02em;color:var(--t1)}
.hl .l2{color:var(--accent)}
.hl.sm{font-size:36px}
.hl.note{font-size:32px;font-weight:700}
.hlead{margin-top:16px;font:var(--ty-body);color:var(--t2)}
.phl{display:flex;align-items:center;margin-top:28px}
.phl .phn{margin-left:12px;font:var(--ty-phase);color:var(--t1);white-space:nowrap}
.phl .tag{margin-left:12px}
.phl .pv{display:contents}
.phl .vr{flex:none;width:1px;height:16px;margin:0 16px;background:var(--line-subtle)}
.phl .prv{font:var(--ty-small);color:var(--t3);margin-right:8px;white-space:nowrap}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:36px;padding-top:20px;border-top:1px solid var(--line-subtle)}
.fig + .fig{padding-left:24px;border-left:1px solid var(--line-subtle)}
.fig .lb{display:block;font:var(--ty-ticker);letter-spacing:.06em;color:var(--t3);white-space:nowrap}
.fig .lb .ko{letter-spacing:.04em}
.fig .v{display:block;margin-top:10px;font:var(--ty-fig-xl);color:var(--t1);font-variant-numeric:proportional-nums;white-space:nowrap}
.fig .v.none{color:var(--t3)}
.fig .ch{display:block;margin-top:10px;min-height:calc(13px * 1.4);font:var(--ty-data-m);color:var(--t2);white-space:nowrap}
.fig .bs{display:block;margin-top:4px;min-height:calc(12px * 1.4);font:var(--ty-caption);color:var(--t3);white-space:nowrap}
.acts{display:flex;gap:12px;margin-top:36px}
.acts .ic{width:16px;height:16px}
.hcover .cv{aspect-ratio:68/100;background:var(--s2)}

/* ===== section frame ===== */
.sec{padding-top:96px}
.shead{display:flex;align-items:baseline;padding-bottom:20px;margin-bottom:32px;border-bottom:1px solid var(--line-subtle)}
.shead h2{font:var(--ty-section);letter-spacing:-.01em;color:var(--t1);white-space:nowrap}
.shead .meta{margin-left:16px;font:var(--ty-meta);color:var(--t3);white-space:nowrap}
.shead .guide{margin-left:auto;max-width:480px;text-align:right;font:var(--ty-meta);color:var(--t3)}
.shead .side{margin-left:auto;align-self:center;display:flex;align-items:center}

/* ===== phase band ===== */
.band{background:var(--bg-band);border-top:1px solid var(--line-subtle);border-bottom:1px solid var(--line-subtle);padding:40px 0 64px}
.band .wrap{position:relative}
.tlscroll{position:relative}
.tl{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:6px}
.tc{position:relative;display:block;height:48px;border-radius:var(--r-cell);transition:box-shadow var(--ease)}
.tc .face{position:absolute;inset:0;display:flex;overflow:hidden;border-radius:inherit}
.tc .face i{flex:1 1 0;display:flex;align-items:center;justify-content:center;font:600 16px/1 var(--f-disp);font-style:normal}
.tc.split .face i{font-size:13px}
.tc .face::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--edge);pointer-events:none}
.tc.empty .face::after{content:none}
.tc.latest{outline:2px solid var(--accent);outline-offset:2px}
a.tc:hover{box-shadow:0 0 0 1px var(--t2)}
.tc .mo{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);font:var(--ty-data-s);letter-spacing:.02em;color:var(--t2);white-space:nowrap}
.tc .mo .ko{letter-spacing:0}
.tdays{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:6px;margin-top:8px}
.tdays span{text-align:center;font:var(--ty-data-s);letter-spacing:.02em;color:var(--t3)}
.tdays span.latest{color:var(--accent);font-weight:500}
.legend{display:flex;flex-wrap:nowrap;align-items:center;gap:24px;margin-top:20px}
.lg{display:flex;align-items:center;gap:8px;font:var(--ty-small);color:var(--t2);white-space:nowrap}
.sw{position:relative;display:flex;flex:none;width:14px;height:14px;border-radius:3px;overflow:hidden}
.sw i{flex:1 1 0;display:flex;align-items:center;justify-content:center;font:600 12px/1 var(--f-disp);font-style:normal}
.sw::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--edge)}
.sw.sw-empty{overflow:visible}
.sw.sw-empty::after{content:none}
.tip{position:absolute;z-index:20;padding:8px 12px;background:var(--s1);border:1px solid var(--line-strong);border-radius:var(--r-tooltip);box-shadow:var(--sh-popover);pointer-events:none;white-space:nowrap}
.tip[hidden]{display:none}
.tip b{display:block;font:600 13px/1.45 var(--f-sans);color:var(--t1)}
.tip span{display:block;font:var(--ty-small);color:var(--t2)}

/* ===== rack ===== */
.grp + .grp{margin-top:64px}
.ghead{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.ghead h3{font:var(--ty-card);color:var(--t2);white-space:nowrap}
.ghead::after{content:"";flex:1;height:1px;background:var(--line-subtle)}
.grp.fold .rows{display:none}
.grp .unfold{margin-top:0}
.rrow{position:relative}
.rrow + .rrow{margin-top:44px}
.rlight{position:absolute;left:0;right:0;top:-40px;height:calc(40px + var(--rack-h));background:linear-gradient(rgba(var(--lamp-rgb),.05),rgba(var(--lamp-rgb),0) 70%);pointer-events:none}
.rrow:first-child .rlight{clip-path:inset(16px 0 0 0)}
.plank{position:absolute;left:-16px;right:-16px;top:var(--rack-h);height:12px;border-radius:2px;background:linear-gradient(var(--stand-top) 0 3px,var(--stand-front) 3px 100%);box-shadow:var(--sh-plank)}
.rslots{position:relative;display:grid;grid-template-columns:repeat(var(--rn),var(--rack-w));column-gap:var(--rg)}
.slot{position:relative;display:block;width:var(--rack-w);border-radius:2px}
a.slot:focus-visible{outline-offset:6px}
.slot .cv{position:relative;z-index:1;width:var(--rack-w);box-shadow:var(--sh-cover-rack);transition:transform var(--ease),box-shadow var(--ease)}
.slot .sglow{position:absolute;left:50%;top:calc(var(--rack-h) - 3.5px);width:160px;height:10px;margin-left:-80px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 30%,transparent),transparent);opacity:0;transition:opacity var(--ease);pointer-events:none}
a.slot:hover .cv{transform:translateY(-6px);box-shadow:var(--sh-cover-rack-hover)}
a.slot:hover .sglow{opacity:1}

/* ================= metrics ================= */
function niceGrid(lo,hi,refs,px){
  var steps=[0.01,0.02,0.025,0.05,0.1,0.2,0.25,0.5,1,2,2.5,5,10,20,25,50,100];
  for(var i=0;i<steps.length;i++){
    var st=steps[i];
    for(var o=0;o<2;o++){
      var off=o?st/2:0, vals=[];
      for(var v=Math.ceil((lo-off)/st-1e-9)*st+off; v<=hi+1e-9; v+=st){
        var vv=Math.round(v*1e6)/1e6;
        if(refs.some(function(r){return Math.abs(r-vv)*px<18;})) continue;
        vals.push(vv);
      }
      if(vals.length===3) return {vals:vals,dec:st>=1&&off%1===0?0:(Math.round(st*10)===st*10&&Math.round(off*10)===off*10?1:2)};
    }
  }
  return {vals:[],dec:0};
}
function chartCard(o){
  var pts=daily(o.key), W=MODE.cw, H=MODE.chh, GL=40, GR=16;
  var lastV=pts.length?pts[pts.length-1].v:null;
  var head='<div class="chead"><div><h3>'+esc(o.title)+'</h3><p class="desc">'+esc(o.desc)+'</p></div><span class="val">'+(lastV==null?'—':o.fmt(lastV))+'</span></div>';
  if(!pts.length) return '<figure class="card">'+head+'</figure>';
  var vs=pts.map(function(p){return p.v;}); if(o.ref!=null) vs.push(o.ref);
  var lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs), pad=(hi-lo)*.1||1; lo-=pad; hi+=pad;
  var x0=dn(pts[0].d), x1=dn(pts[pts.length-1].d);
  function X(d){return x1===x0?(GL+W-GR)/2:GL+(W-GL-GR)*(dn(d)-x0)/(x1-x0);}
  function Y(v){return H*(1-(v-lo)/(hi-lo));}
  var refs=o.ref!=null?[o.ref]:[], gr=niceGrid(lo,hi,refs,H/(hi-lo)), s='';
  var zeroIn=o.zero&&lo<0&&hi>0;
  gr.vals.forEach(function(v){ if(!(zeroIn&&v===0)) s+='<line class="g" x1="0" x2="'+W+'" y1="'+(Y(v)+.5).toFixed(1)+'" y2="'+(Y(v)+.5).toFixed(1)+'"/>'; });
  if(zeroIn) s+='<line class="z" x1="0" x2="'+W+'" y1="'+(Y(0)+.5).toFixed(1)+'" y2="'+(Y(0)+.5).toFixed(1)+'"/>';
  if(o.ref!=null) s+='<line class="rf" x1="0" x2="'+W+'" y1="'+(Y(o.ref)+.5).toFixed(1)+'" y2="'+(Y(o.ref)+.5).toFixed(1)+'"/>';
  var d='', prev=null;
  pts.forEach(function(p){
    var cmd=(!prev||dn(p.d)-dn(prev.d)>1)?'M':'L';
    d+=cmd+X(p.d).toFixed(1)+' '+Y(p.v).toFixed(1);
    prev=p;
  });
  s+='<path class="ln" d="'+d+'"/>';
  var lp=pts[pts.length-1];
  s+='<circle class="dt" cx="'+X(lp.d).toFixed(1)+'" cy="'+Y(lp.v).toFixed(1)+'" r="5"/>';
  gr.vals.forEach(function(v){ s+='<text x="0" y="'+(Y(v)-5).toFixed(1)+'">'+numS(v,gr.dec)+'</text>'; });
  if(o.ref!=null) s+='<text x="0" y="'+(Y(o.ref)-5).toFixed(1)+'">'+esc(o.refLabel)+'</text>';
  var mid=(x0+x1)/2, mp=pts[0];
  pts.forEach(function(p){ if(Math.abs(dn(p.d)-mid)<Math.abs(dn(mp.d)-mid)) mp=p; });

function showTip(c){

/* search */
function pad2(n){return String(n).padStart(2,'0');}
function dateQuery(s){
  var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(m) return {y:m[1],md:pad2(m[2])+'-'+pad2(m[3])};
  m=s.match(/^(\d{1,2})[.\/](\d{1,2})$/); if(m) return {y:null,md:pad2(m[1])+'-'+pad2(m[2])};
  return null;
}
function find(raw,scope){
  var s=raw.trim(); if(!s||!B.length) return null;
  var dq=dateQuery(s), sl=s.toLowerCase(), out=[];
  B.slice().reverse().forEach(function(b){
    var m={date:false,text:null}, h=hlOf(b).t;
    if(scope==='전체'||scope==='날짜'){
      if(dq){ if(b.date.slice(5)===dq.md&&(!dq.y||b.date.slice(0,4)===dq.y)) m.date=true; }
      else if(b.date.indexOf(s)>=0||mdot(b.date).indexOf(s)>=0) m.date=true;
    }
    if(scope==='전체'){ if([b.title,b.headline,b.note].some(function(x){return x&&x.toLowerCase().indexOf(sl)>=0;})) m.text=s; }
    if(scope==='헤드라인'){ if(h.toLowerCase().indexOf(sl)>=0) m.text=s; }
    if(scope==='국면'){
      var want=parts(s.toUpperCase()), ps=parts(b.phase);
      if(want.length===1?ps.indexOf(want[0])>=0:(want.length>1&&want.join('→')===ps.join('→'))) m.ph=true;
    }
    if(m.date||m.text||m.ph){ if(m.text&&h.toLowerCase().indexOf(sl)<0) m.text=null; out.push({b:b,m:m}); }
  });
  return out;
}
function renderResults(){
  var res=find(q.value,qs.value);
  if(!res){qres.hidden=true; qlive.textContent=''; return;}
  qlive.textContent=res.length+'호 찾음';
  if(!res.length){qres.innerHTML='<p class="rs-empty">맞는 호가 없습니다. 날짜는 09.24처럼 적어 보세요.</p>'; qres.hidden=false; return;}
  qres.innerHTML=res.slice(0,6).map(function(r){var b=r.b, h=hlOf(b), t=b.url?'a':'div';
    return '<'+t+' class="rs-row"'+(b.url?ext(b.url):'')+'><span class="d">'+(r.m.date?'<mark>'+mdot(b.date)+'</mark>':mdot(b.date))+'</span>'+badge(b.phase,'s')+'<span class="h">'+(r.m.text?hiText(h.t,r.m.text):esc(h.t))+'</span></'+t+'>';}).join('')
    +'<div class="rs-foot"><button type="button" class="btn-txt" id="qall">발행 목록에서 '+res.length+'호 모두 보기</button></div>';

}

  lbody.innerHTML=res.length?res.map(function(r,i){return rowHTML(r.b,i,r.m);}).join(''):'<p class="lempty">‘'+esc(term)+'’에 맞는 호가 없습니다. 날짜는 09.24처럼 적어 보세요.</p>';

function csvCell(v){ if(v==null) return ''; var s=String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function buildCsv(){
  var head=['날짜','회차','국면','전날 국면','임시 기준','BTC.D','ΣSTABLECOIN.D','ΣSTABLECOIN.D 1개월 %p','BTCUSD 1개월 %','간략판','발행 실행','조회(KST)','발행 시각','제목','주소'];
  var rows=B.map(function(b){return [b.date,b.seq,parts(b.phase).join('→'),parts(b.prevPhase).join('→'),b.provisional?'예':'',b.btcd,b.stableD,b.stable1m,b.btc1m,b.lite?'예':'',run(b),b.window,b.publishedAt,b.title,b.url||''];});
  return '﻿'+[head].concat(rows).map(function(r){return r.map(csvCell).join(',');}).join('\r\n')+'\r\n';
}
function saveCsv(){
  var msg=$('#dlmsg'), btn=$('#csvbtn');
  if(!DL||!B.length) return;
  msg.textContent='저장 창을 열었습니다.';
  DL.save({filename:'crypto-brief-indicators-'+kstNow().date+'.csv', data:buildCsv()}).then(function(){msg.textContent='CSV를 저장했습니다.';},function(e){
    var c=e&&e.code; msg.textContent=c==='declined'?'저장을 취소했습니다.':c==='rate_limited'?'저장 창이 이미 열려 있습니다. 잠시 뒤 다시 눌러 주세요.':'이 화면에서는 파일을 저장할 수 없습니다.';
    if(c==='unavailable'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed'){DL=null; btn.hidden=true;}
  });
}

/* page-level listeners, attached once */
window.addEventListener('scroll',spy,{passive:true});
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&q&&!q.disabled&&!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'')){
    e.preventDefault(); if(MODE.narrow){var b=$('#nbS'); if(b&&!$('#top').classList.contains('sopen')) b.click();} q.focus();
  }
  if(e.key==='Escape'){ if(qres&&!qres.hidden){qres.hidden=true; q.focus();} else closePanels(); }
});
document.addEventListener('click',function(e){
  if(qres&&!e.target.closest('.search')) qres.hidden=true;
  if(!e.target.closest('.top')) closePanels();
});
var rt=null;
window.addEventListener('resize',function(){
  clearTimeout(rt);
  rt=setTimeout(function(){
    var m=computeMode();
    if(MODE&&m.key===MODE.key){MODE=m; applyZoom(); return;}
    render();
  },150);
});

/* ================= start ================= */
BK.grain();
render();
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){BK.fit(document,true); fitHeadline(); setTimeout(function(){document.body.setAttribute('data-ready','1');},150);});}

var claude=window.claude;
if(!claude||typeof claude.use!=='function'){S.status='unavailable'; render(); return;}
claude.use('downloads').then(function(x){DL=x||null; var b=$('#csvbtn'); if(b) b.hidden=!DL;},function(){DL=null;});
claude.use('db').then(function(db){
  if(!db){S.status='unavailable'; render(); return;}
  var gotB=false;
  db.collection('briefs').onSnapshot(function(snap){
    gotB=true; S.status='ready';
    setData(snap.docs.filter(function(d){return d.exists!==false;}).map(function(d){return {id:d.id,data:d.data()};}));
    render();
  },function(){ if(!gotB){S.status='unavailable'; render();} });
  db.collection('related').onSnapshot(function(snap){
    S.related=snap.docs.filter(function(d){return d.exists!==false;}).map(function(d){var x=d.data()||{}; return {id:d.id,date:x.date?String(x.date).slice(0,10):'',title:x.title?String(x.title):'',url:safeUrl(x.url)};});
    render();
  },function(){});
},function(){S.status='unavailable'; render();});
})();
</script>
