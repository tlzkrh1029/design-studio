<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/gothic-a1/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/gothic-a1/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/gothic-a1/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/gothic-a1/800.css">
<link rel="stylesheet" href="node_modules/@fontsource/outfit/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/oswald/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/oswald/600.css">
<link rel="stylesheet" href="mz.css">
<style>
body{margin:0;background:#FFFFFF;font-family:'Gothic A1',sans-serif;color:#141B0F}
.sec{padding:28px 32px}
.sec h2{font-size:15px;margin:0 0 16px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.big{width:var(--w,340px)}
.lab{font-size:12px;margin-top:8px;color:#56614B;font-family:monospace}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:34px 24px;max-width:1180px}
.cat{display:grid;grid-template-columns:repeat(var(--n,6),var(--cw,236px));gap:40px 30px}
.cat figure{margin:0}
.cat figcaption{margin-top:12px;font-size:15px;line-height:1.35;color:#141B0F}
.cat figcaption b{font-weight:800;margin-right:6px}
.cat figcaption span{display:block;font-size:12.5px;color:#56614B;font-weight:600;margin-top:2px}
.sch{display:grid;grid-template-columns:170px repeat(6,var(--cw,132px));gap:22px 18px;align-items:center}
.sch .nm{font-size:16px;font-weight:800;line-height:1.3}
.sch .nm small{display:block;font-size:12px;font-weight:600;color:#56614B;margin-top:4px}
.sch .hh{font-size:12px;color:#56614B;font-weight:700;text-align:center}
</style></head><body>
<div id="app"></div>
<script src="data.js"></script>
<script>
(function(){
<<MZ>>
function num(v){if(v==null||v==='') return null; if(typeof v==='number') return isFinite(v)?v:null; var n=parseFloat(String(v).replace(/[−–]/g,'-').replace(/[,%p\s+]/g,'')); return isFinite(n)?n:null;}
function normalize(list){
  return list.map(function(r){var x=r.data||{}; return {id:r.id,date:String(x.date||'').slice(0,10),seq:Math.max(1,parseInt(x.seq,10)||1),title:x.title?String(x.title):'',url:null,
    phase:x.phase?String(x.phase):null,prevPhase:x.prevPhase?String(x.prevPhase):null,provisional:x.provisional===true,headline:x.headline?String(x.headline):'',
    btcd:num(x.btcd),stableD:num(x.stableD),stable1m:num(x.stable1m),btc1m:num(x.btc1m),lite:x.lite===true,window:x.window?String(x.window):'',run:x.run?String(x.run):'',
    note:x.note?String(x.note):'',publishedAt:'',registeredAt:'',registeredBy:''};})
  .filter(function(b){return /^\d{4}-\d\d-\d\d$/.test(b.date);})
  .sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.seq-b.seq;});
}
var B=normalize(window.RAW);
BK.grain();
var app=document.getElementById('app');
function find(id){for(var i=0;i<B.length;i++){if(B[i].id===id) return i;} return -1;}
var FK={BTC:'BTC.D',ALT:'알트',STABLE:'스테이블',MIX:'세 몫 비교',PRICE:'가격',MACRO:'정책·일정',TYPE:'국면'};
var q=location.hash.slice(1).split('&'), mode=q[0]||'shelf', arg={}; q.slice(1).forEach(function(kv){var p=kv.split('='); arg[p[0]]=decodeURIComponent(p[1]||'');});
var out='';
if(mode==='big'){
  out+='<div class="sec" id="cap" style="display:inline-block;width:'+(arg.width||1300)+'px"><div class="row">';
  B.slice().reverse().slice(+(arg.from||0),+(arg.from||0)+(+(arg.n||12))).forEach(function(b){var i=B.indexOf(b); out+='<div class="big" style="--w:'+(arg.w||340)+'px">'+BK.html(b,B,i+1)+'<div class="lab">'+b.id+' · '+BK.pick(b,B)+'</div></div>';});
  out+='</div></div>';
}
if(mode==='shelf'){
  out+='<div class="sec" id="cap" style="display:inline-block"><ul class="books" style="list-style:none;padding:0;margin:0;width:'+(arg.width||1004)+'px">';
  B.slice().reverse().forEach(function(b){var i=B.indexOf(b); out+='<li>'+BK.html(b,B,i+1)+'<div class="lab">'+b.date.slice(5)+(b.seq>1?'-'+b.seq:'')+'</div></li>';});
  out+='</ul></div>';
}
if(mode==='row'){
  var ids=(arg.ids||'2026-09-30-1,2026-09-29-1,2026-09-28-1,2026-09-27-1,2026-09-26-1').split(',');
  out+='<div class="sec" id="cap" style="display:inline-block;padding:24px"><div class="row" style="gap:36px;flex-wrap:nowrap">';
  ids.forEach(function(id){var i=find(id); out+='<div class="big" style="--w:'+(arg.w||400)+'px">'+BK.html(B[i],B,i+1)+'</div>';});
  out+='</div></div>';
}
if(mode==='catalog'){
  var plan=BK.plan(B), use={}, list=BK.scenes, from=+(arg.from||0), to=+(arg.to||list.length);
  out+='<div class="sec" id="cap" style="display:inline-block;padding:32px 36px"><div class="cat" style="--n:'+(arg.n||6)+';--cw:'+(arg.cw||236)+'px">';
  list.slice(from,to).forEach(function(s,k){
    var si=from+k, best=null, bu=1e9;
    for(var i=B.length-1;i>=0;i--){var b=B[i], F=plan[b.id].focus; if(s.f.indexOf(F)<0||!BK.can(b,B,i+1,s.id,F)) continue; var u=use[b.id]||0; if(u<bu){bu=u; best=[i,F];}}
    if(!best){ for(var j=B.length-1;j>=0&&!best;j--){ for(var t=0;t<s.f.length;t++){ if(BK.can(B[j],B,j+1,s.id,s.f[t])){best=[j,s.f[t]]; break;} } } }
    if(!best){ out+='<figure><div style="aspect-ratio:68/100;background:#eee"></div><figcaption>'+s.id+' 없음</figcaption></figure>'; return; }
    var b=B[best[0]]; use[b.id]=(use[b.id]||0)+1;
    var force={scene:s.id,focus:best[1],scheme:[0,5,1,8,3,2,6,9,7,4,10,11][si%12],hue:(si*137.508+24)%360};
    out+='<figure>'+BK.html(b,B,best[0]+1,force)+'<figcaption><b>'+(si+1<10?'0':'')+(si+1)+'</b>'+s.ko+'<span>'+s.f.map(function(f){return FK[f];}).join(' · ')+'</span></figcaption></figure>';
  });
  out+='</div></div>';
}
if(mode==='schemes'){
  var i30=find(arg.id||'2026-09-30-1'), hues=[20,80,140,200,260,320];
  out+='<div class="sec" id="cap" style="display:inline-block;padding:32px 36px"><div class="sch" style="--cw:'+(arg.cw||132)+'px">';
  out+='<div></div>'+hues.map(function(h){return '<div class="hh">색상 '+h+'°</div>';}).join('');
  BK.schemes.forEach(function(nm,si){
    out+='<div class="nm">'+(si+1<10?'0':'')+(si+1)+' '+nm+'<small>'+([1,6,10].indexOf(si)>=0?'어두운 바탕':si===5?'진한 색 바탕':'밝은 바탕')+'</small></div>';
    hues.forEach(function(h){out+=BK.html(B[i30],B,i30+1,{scheme:si,hue:h,scene:arg.scene||null});});
  });
  out+='</div></div>';
}
app.innerHTML=out; document.fonts.ready.then(function(){BK.fit(app,true); document.body.setAttribute('data-ready','1');});
})();
</script></body></html>
