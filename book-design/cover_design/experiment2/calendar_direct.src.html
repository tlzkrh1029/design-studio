<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>크립토 브리핑 서고</title>
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/outfit/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/outfit/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/outfit/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/oswald/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/oswald/600.css">
<link rel="stylesheet" href="../mz.css">
<style>
:root{
  /* ground and ink */
  --page:#E4E9EF; --card:#FFFFFF; --soft:#F3F6F9;
  --ink:#152031; --ink2:#4B5768; --ink3:#5F6A7A;
  --line:#E3E8EE; --line2:#C9D1DB; --q:#D9DFE7;
  --sun:#C8372D; --sat:#2B5DC4;
  /* today: taken from the latest cover at runtime (9/30: deep teal + peach) */
  --acc:#022B3B; --acc2:#FCB8A5; --acc-tint:#FEEDE8; --acc-line:#7D959E;
  /* type */
  --f-ui:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'Outfit','Gothic A1',sans-serif;
  /* shape */
  --r-card:20px; --r-ctl:12px;
  --sh-card:0 1px 2px rgba(21,32,49,.05),0 20px 44px -28px rgba(21,32,49,.30);
  /* layout (desktop 1440) */
  --page-w:1360px; --side-w:380px; --gap:24px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page); color:var(--ink); font-family:var(--f-ui); font-size:14px; line-height:1.5; font-weight:500;
  -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:break-word}
a{color:inherit; text-decoration:none}
button{font:inherit; color:inherit; cursor:pointer}
p,h1,h2,h3,dl,dd,ol{margin:0}
svg.i{width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.num{font-family:var(--f-num); font-feature-settings:"tnum" 1}
.wrap{width:var(--page-w); margin:0 auto; padding-bottom:48px}
.card{background:var(--card); border-radius:var(--r-card); box-shadow:var(--sh-card)}
.eyebrow{font-size:12px; font-weight:800; letter-spacing:.04em; color:var(--ink2)}

/* ---------- header ---------- */
.top{display:flex; align-items:center; gap:16px; height:100px}
.brand{display:flex; align-items:center; gap:14px; margin-right:auto}
.logo{width:46px; height:46px; border-radius:13px; background:var(--ink); color:#fff; display:grid; place-items:center}
.logo svg.i{width:26px; height:26px; stroke-width:1.6}
.brand h1{font-size:21px; font-weight:800; letter-spacing:-.015em; line-height:1.25}
.brand p{font-size:13px; color:var(--ink2); margin-top:2px}
.search{display:flex; align-items:center; width:452px; height:46px; background:#fff; border-radius:var(--r-ctl); box-shadow:0 1px 2px rgba(21,32,49,.06)}
.scope{display:flex; align-items:center; gap:6px; height:100%; padding:0 12px 0 16px; border:0; background:none; font-size:13px; font-weight:800; border-right:1px solid var(--line)}
.scope svg.i{width:14px; height:14px; color:var(--ink2)}
.search label{flex:1; min-width:0; display:flex; align-items:center; gap:10px; padding:0 16px 0 14px; color:var(--ink2)}
.search input{flex:1; min-width:0; border:0; outline:0; background:none; font:inherit; font-size:14px; color:var(--ink)}
.search input::placeholder{color:var(--ink3)}
.sib{display:flex; align-items:center; gap:8px; height:46px; padding:0 16px; border-radius:var(--r-ctl); border:1px solid var(--line2); font-size:13px; font-weight:700; white-space:nowrap}
.sib small{font-size:12px; font-weight:600; color:var(--ink2)}
.sib svg.i{width:14px; height:14px}

/* ---------- main: calendar + side ---------- */
.main{display:grid; grid-template-columns:1fr var(--side-w); gap:var(--gap); align-items:stretch}

/* calendar card */
.cal{overflow:hidden}
.cal-head{display:flex; align-items:flex-end; gap:24px; padding:22px 24px 20px}
.mo{display:flex; align-items:flex-end; gap:16px}
.mo-y{display:block; font-size:13px; font-weight:800; color:var(--ink2); letter-spacing:.02em}
.mo h2{display:flex; align-items:baseline; gap:2px; font-size:30px; font-weight:800; line-height:1; margin-top:4px}
.mo h2 .num{font-size:50px; font-weight:600; letter-spacing:-.02em; line-height:.9}
.mo-nav{display:flex; gap:6px; padding-bottom:2px}
.mo-nav button{width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:#fff; display:grid; place-items:center; color:var(--line2); cursor:default}
.mo-nav button svg.i{width:14px; height:14px}
.cal-sub{flex:1; font-size:13px; color:var(--ink2); line-height:1.55; padding-bottom:3px; text-wrap:balance}
.views{display:flex; padding:3px; background:var(--soft); border-radius:10px; border:1px solid var(--line)}
.views button{border:0; background:none; height:30px; padding:0 14px; border-radius:7px; font-size:13px; font-weight:700; color:var(--ink2)}
.views button.on{background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(21,32,49,.12)}

.wdays{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--soft)}
.wdays span{padding:7px 12px 6px; font-size:12px; font-weight:800; color:var(--ink2)}
.sun{color:var(--sun)!important} .sat{color:var(--sat)!important}

.wk{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-template-rows:40px 16px auto; position:relative; isolation:isolate; border-bottom:1px solid var(--line)}
.wk:last-child{border-bottom:0}
.cl{grid-row:1/4; border-left:1px solid var(--line)}
.cl.c0{border-left:0}
.cl.out,.cl.pre{background:var(--soft)}
.cl.today{background:var(--acc-tint)}
/* phase band under the dates: one continuous band per run of the same phase, like a multi-day event */
.ln{grid-row:2; align-self:start; height:7px; margin:0 6px; border-radius:4px; z-index:1}
.ln.cl-l{margin-left:0; border-top-left-radius:0; border-bottom-left-radius:0}
.ln.cl-r{margin-right:0; border-top-right-radius:0; border-bottom-right-radius:0}
.dr{grid-row:1; z-index:2; display:flex; align-items:center; gap:6px; padding:12px 10px 0 11px; min-width:0; height:40px}
.dn{font-family:var(--f-num); font-size:16px; font-weight:600; line-height:1; letter-spacing:-.01em}
.dn.faint{color:var(--ink3); font-weight:500; font-size:14px}
.dn.tday{display:grid; place-items:center; width:26px; height:26px; margin:-5px 0 -5px -4px; border-radius:50%; background:var(--acc); color:var(--acc2)!important; font-size:14px}
.tag{font-size:12px; font-weight:800; color:var(--acc)}
.dr .sp{flex:1}
.runs{display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:10px; background:var(--ink); color:#fff; font-size:11px; font-weight:800; letter-spacing:.01em}
.clip{display:inline-grid; place-items:center; width:20px; height:20px; border-radius:6px; color:var(--ink2); border:1px solid var(--line2)}
.clip svg.i{width:12px; height:12px}
/* phase marks */
.sq{display:inline-grid; place-items:center; width:18px; height:18px; border-radius:4px; font-family:var(--f-num); font-style:normal; font-size:11px; font-weight:700; line-height:1; flex:none}
.sq-q{background:var(--q); color:var(--ink2)}
svg.arr{width:7px; height:10px; flex:none; color:var(--ink2); margin:0 2px}
.pc{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; white-space:nowrap}
.pm{display:inline-flex; align-items:center}

.cv{grid-row:3; display:block; padding:0 10px 16px; z-index:2; min-width:0}
.slot{grid-row:3; z-index:2; margin:0 10px 16px; aspect-ratio:68/100; border:1.5px dashed var(--line2); border-radius:3px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-align:center; padding:8px}
.slot b{font-size:12px; font-weight:700; color:var(--ink2)}
.slot span{font-size:11px; color:var(--ink3); line-height:1.4}
.slot.pre{border:0}
.slot.next{border-color:var(--acc-line); background:rgba(255,255,255,.6)}
.slot.next .num{font-size:22px; font-weight:600; color:var(--acc); line-height:1.1}
.slot.next b{color:var(--acc)}
/* notes that sit in the out-of-month corners */
.note{grid-row:1/4; z-index:2; padding:18px 18px 16px 16px; display:flex; flex-direction:column}
.note h3{font-size:12px; font-weight:800; letter-spacing:.04em; color:var(--ink2); margin-bottom:12px}
.lg{display:grid; gap:7px}
.lg div{display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:var(--ink)}
.lg .lg-sep{height:1px; background:var(--line2); margin:3px 0}
.st{display:grid; gap:0}
.st div{display:flex; align-items:baseline; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line)}
.st div:last-child{border-bottom:0}
.st span{font-size:12px; color:var(--ink2); font-weight:600}
.st b{font-family:var(--f-num); font-size:19px; font-weight:600; line-height:1}
.st b small{font-family:var(--f-ui); font-size:11px; font-weight:700; color:var(--ink2); margin-left:2px}

/* same-day runs */
.multi{border-top:1px solid var(--line); padding:20px 24px 26px}
.multi-head{display:flex; align-items:baseline; gap:12px; margin-bottom:16px}
.multi-head h3{font-size:16px; font-weight:800}
.multi-head p{font-size:13px; color:var(--ink2)}
.mgs{display:flex; justify-content:space-between}
.mg-h{display:flex; align-items:center; gap:8px; height:22px; margin-bottom:10px; font-size:13px; font-weight:800}
.mg-h .num{font-size:15px; font-weight:600}
.mg-h em{font-style:normal; font-size:12px; font-weight:700; color:var(--ink2)}
.mg-row{display:flex; gap:12px}
.mg-it{width:var(--mw,104px)}
.mg-it a{display:block}
.mg-cap{margin-top:12px; font-size:12px; line-height:1.45; min-height:35px}
.mg-cap b{font-weight:800}
.mg-cap i{font-style:normal; color:var(--ink2); font-weight:600; margin-left:5px}
.mg-cap span{display:block; color:var(--ink2); font-weight:600}

/* ---------- side ---------- */
.side{display:flex; flex-direction:column; gap:20px}
.side > .docs{flex:1}
.pick{overflow:hidden}
.pk-top{background:var(--acc-tint); padding:20px 24px 24px}
.pk-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:16px}
.pk-head .eyebrow{color:var(--acc)}
.pk-date{font-size:24px; font-weight:800; letter-spacing:-.02em; line-height:1.25; margin-top:4px}
.pk-date span{font-weight:700; color:var(--ink2); font-size:18px; margin-left:4px}
.pk-vol{text-align:right; font-size:12px; color:var(--ink2); font-weight:600; line-height:1.45}
.pk-vol b{display:block; font-family:var(--f-num); font-size:22px; font-weight:600; color:var(--ink); line-height:1.1}
.pk-cover{display:block}
.pk-body{padding:18px 24px 22px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px}
.chip{display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border-radius:8px; background:var(--soft); border:1px solid var(--line); font-size:12px; font-weight:700; color:var(--ink)}
.chip .sq{width:18px; height:18px}
.chip.ph{padding-left:5px}
.ind > div{display:grid; grid-template-columns:1fr auto; align-items:center; column-gap:12px; padding:11px 0; border-top:1px solid var(--line)}
.ind dt{font-size:13px; font-weight:800}
.ind .sub{grid-column:1; font-size:12px; color:var(--ink2); font-weight:500; margin-top:1px}
.ind dd.v{grid-column:2; grid-row:1/3; font-family:var(--f-num); font-size:22px; font-weight:600; letter-spacing:-.01em; text-align:right}
.ind dd.v small{font-size:14px; font-weight:600; margin-left:1px; color:var(--ink2)}
.cta{display:flex; align-items:center; justify-content:center; gap:10px; height:54px; margin-top:16px; border-radius:14px; background:var(--acc); color:var(--acc2); font-size:16px; font-weight:800; letter-spacing:-.01em}
.cta svg.i{width:18px; height:18px; stroke-width:2}
.pk-nav{display:flex; justify-content:space-between; align-items:center; margin-top:14px; font-size:13px; font-weight:700}
.pk-nav a,.pk-nav span{display:inline-flex; align-items:center; gap:4px}
.pk-nav span{color:var(--ink3); font-weight:600}
.pk-nav svg.i{width:14px; height:14px}

.sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.sec-head h2{font-size:17px; font-weight:800; letter-spacing:-.01em}
.more{display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; color:var(--ink2)}
.more svg.i{width:13px; height:13px}
.recent{padding:22px 24px 6px}
.ag{list-style:none; padding:0; margin-top:10px}
.ag a{display:grid; grid-template-columns:34px 1fr; gap:14px; padding:18px 0 17px; border-top:1px solid var(--line)}
.ag-d{position:relative; text-align:center; padding-top:1px}
.ag-d b{display:block; font-family:var(--f-num); font-size:22px; font-weight:600; line-height:1}
.ag-d span{display:block; font-size:12px; font-weight:700; color:var(--ink2); margin-top:3px}
.ag-d i{display:block; height:4px; border-radius:2px; margin:7px 3px 0}
.ag-m{font-size:12px; color:var(--ink2); font-weight:600}
.ag-h{font-size:14px; font-weight:700; line-height:1.45; margin-top:2px; letter-spacing:-.01em; text-wrap:balance}
.docs{padding:20px 24px 22px}
.doc{display:grid; grid-template-columns:38px 1fr 16px; gap:12px; align-items:center; margin-top:14px; padding:12px 14px; border-radius:12px; border:1px solid var(--line)}
.doc-ic{width:38px; height:38px; border-radius:10px; background:var(--soft); display:grid; place-items:center; color:var(--ink2)}
.doc b{display:block; font-size:14px; font-weight:800}
.doc span{display:block; font-size:12px; color:var(--ink2); margin-top:1px}
.doc > svg.i{color:var(--ink2)}
.docs .lead{font-size:12px; color:var(--ink2); margin-top:12px; line-height:1.6; text-wrap:balance}

/* ---------- flow: phases + indicators on one day axis ---------- */
.flow{margin-top:var(--gap); padding:24px 28px 18px}
.fl-head{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:14px}
.fl-head h2{font-size:22px; font-weight:800; letter-spacing:-.015em}
.fl-head p{font-size:13px; color:var(--ink2); margin-top:4px}
.btns{display:flex; gap:8px}
.btn{display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 14px; border-radius:10px; border:1px solid var(--line2); background:#fff; font-size:13px; font-weight:700}
.btn svg.i{width:14px; height:14px; color:var(--ink2)}
.fl-row{display:grid; grid-template-columns:var(--lab-w,236px) 1fr; border-top:1px solid var(--line)}
.fl-row.axis{border-top:0}
.fl-row.mid{align-items:center}
.fl-row.mid .fl-lab{padding:10px 16px 10px 0}
.fl-lab{padding:14px 16px 12px 0}
.fl-n{font-size:13px; font-weight:800}
.fl-v{font-family:var(--f-num); font-size:26px; font-weight:600; letter-spacing:-.015em; line-height:1.15; margin-top:3px}
.fl-v small{font-size:15px; color:var(--ink2); margin-left:2px}
.fl-s{font-size:12px; color:var(--ink2); margin-top:4px; line-height:1.45; text-wrap:balance}
.fl-s b{font-weight:700; color:var(--ink)}
.fl-plot{position:relative}
.fl-plot svg{display:block; overflow:visible}
.fx text{font-family:var(--f-num); font-size:11px; fill:var(--ink2)}
.fx .ax-d{font-size:13px; font-weight:600; fill:var(--ink)}
.fx .ax-w{font-family:var(--f-ui); font-size:10px; font-weight:700; fill:var(--ink3)}
.fx .ax-d.sun,.fx .ax-w.sun{fill:var(--sun)} .fx .ax-d.sat,.fx .ax-w.sat{fill:var(--sat)}
.fx .ax-d.td{fill:var(--acc2)}
.fx .tk{font-size:11px; fill:var(--ink3)}
.fx .rl{font-family:var(--f-ui); font-size:11px; font-weight:700; fill:var(--ink2)}
.fx .ph-l{font-size:11px; font-weight:700}
.fx .gap-l{font-family:var(--f-ui); font-size:10px; font-weight:700; fill:var(--ink2)}
.fl-foot{display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--line); padding-top:14px; margin-top:2px; font-size:12px; color:var(--ink2)}
.fl-foot .lgd{display:flex; gap:18px; align-items:center}
.fl-foot .lgd span{display:inline-flex; align-items:center; gap:6px}
.fl-foot svg{display:block}

/* ---------- footer ---------- */
.foot{margin-top:40px; display:grid; grid-template-columns:330px 1fr; gap:48px; padding-top:28px; border-top:1px solid var(--line2)}
.foot h2{font-size:17px; font-weight:800}
.foot .lead{font-size:13px; color:var(--ink2); line-height:1.7; margin-top:10px}
.upd{display:grid; grid-template-columns:repeat(3,1fr); gap:20px 32px}
.upd div{display:grid; gap:4px; align-content:start}
.upd dt{font-family:var(--f-num); font-size:15px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:8px}
.upd dt::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--ink2)}
.upd dd{font-size:12.5px; color:var(--ink2); line-height:1.65}
.disc{margin-top:28px; padding-top:16px; border-top:1px solid var(--line2); display:flex; justify-content:space-between; font-size:12px; color:var(--ink2)}

/* ---------- narrow screens (390px): one column, calendar without covers ---------- */
@media (max-width:760px){
  :root{--page-w:auto}
  .wrap{padding:0 16px 32px}
  .top{flex-wrap:wrap; height:auto; padding:16px 0}
  .search{order:3; width:100%}
  .sib{display:none}
  .main{grid-template-columns:1fr}
  .side{order:-1}
  .cal-head{flex-wrap:wrap}
  .cal-sub{flex-basis:100%}
  .cv,.slot,.note{display:none}
  .wk{grid-template-rows:34px 14px 0}
  .dr{padding:14px 4px 0 6px}
  .dr{padding:12px 2px 0 6px; gap:3px}
  .dr .pc,.dr .clip,.dr .tag{display:none}
  .dr .runs{width:7px; height:7px; padding:0; font-size:0; border-radius:50%}
  .dn.tday{width:24px; height:24px; margin:-4px 0 -4px -5px}
  .wdays span{padding:7px 6px 6px}
  .multi{display:none}
  .flow{padding:20px 16px; overflow-x:auto}
  .foot{grid-template-columns:1fr}
  .upd{grid-template-columns:1fr}
}
</style>

</defs></svg>
<div id="app"></div>

<script>
(function(){
<<MZ>>
<<COMMON>>

/* ================= setup ================= */
var TODAY=L.date, Y=+TODAY.slice(0,4), MO=+TODAY.slice(5,7);
var DM=dayMap(), DAYS=Object.keys(DM).sort(), P=pal(L);
function pad(n){return (n<10?'0':'')+n;}
function ds(n){return new Date(n*864e5).toISOString().slice(0,10);}
function dow(d){return new Date(dn(d)*864e5).getUTCDay();}
function dd(d){return +d.slice(8);}
function mm(d){return +d.slice(5,7);}
var M1=Y+'-'+pad(MO)+'-01', ND=new Date(Date.UTC(Y,MO,0)).getUTCDate();
var START=dn(M1)-dow(M1), WEEKS=Math.ceil((dow(M1)+ND)/7);
var FIRST=B[0].date, NEXT=ds(dn(TODAY)+1);
function lastOf(d){var l=DM[d]; return l?l[l.length-1]:null;}
function kindOf(d){var b=lastOf(d); if(!b) return null; var ps=parts(b.phase); return ps.length?ps.join('>'):'?';}
function isSplit(k){return k&&k.indexOf('>')>=0;}
function isGap(d){return d>FIRST&&d<=TODAY&&!DM[d];}

/* today's accent comes from the latest cover: a dark ground colour plus its light frame colour */
function hx(h){h=h.replace('#',''); return [0,2,4].map(function(i){return parseInt(h.substr(i,2),16);});}
function mix(a,b,t){var A=hx(a),C=hx(b); return '#'+A.map(function(v,i){var x=Math.round(v*t+C[i]*(1-t)); return ('0'+x.toString(16)).slice(-2);}).join('');}
var ACC=(function(){
  var dark=null, light=null, cs=[P.bg,P.fr,P.ink,P.c1,P.c3], ls=[P.fr,P.c3,P.c2];
  for(var i=0;i<cs.length&&!dark;i++) if(BK.contrast(cs[i],'#FFFFFF')>=7) dark=cs[i];
  dark=dark||'#152031';
  for(var j=0;j<ls.length&&!light;j++) if(BK.contrast(ls[j],dark)>=4.5&&BK.contrast(ls[j],'#FFFFFF')<2.2) light=ls[j];
  return light?{dark:dark,light:light,tint:mix(light,'#FFFFFF',.26)}:{dark:dark,light:'#FFFFFF',tint:mix(dark,'#FFFFFF',.08)};
})();
var R=document.documentElement.style;
R.setProperty('--acc',ACC.dark); R.setProperty('--acc2',ACC.light); R.setProperty('--acc-tint',ACC.tint); R.setProperty('--acc-line',mix(ACC.dark,'#FFFFFF',.5));

var ARR='<svg class="arr" viewBox="0 0 7 10" aria-hidden="true"><path d="M1.5 1.5L5 5 1.5 8.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ================= calendar ================= */
function calendar(){
  var h='<section class="cal card" aria-label="'+MO+'월 달력">';
  h+='<div class="cal-head"><div class="mo"><div><span class="mo-y">'+Y+'년</span><h2><span class="num">'+MO+'</span>월</h2></div>'
    +'<div class="mo-nav"><button type="button" disabled aria-label="이전 달">'+I.left+'</button><button type="button" disabled aria-label="다음 달">'+I.right+'</button></div></div>'
    +'<p class="cal-sub">날짜 칸마다 그날 발행한 호의 표지를 걸었습니다. 날짜 밑의 색 띠는 그날의 국면이고, 국면이 바뀐 날에만 이름을 적었습니다.</p>'
    +'<div class="views" role="tablist"><button type="button" class="on" role="tab" aria-selected="true">달력</button><button type="button" role="tab" aria-selected="false">목록</button></div></div>';
  h+='<div class="wdays">'+WD.map(function(w,i){return '<span class="'+(i===0?'sun':i===6?'sat':'')+'">'+w+'</span>';}).join('')+'</div>';

  /* name the phase only where it changes from the previous published day */
  var named={}, pk=null; DAYS.forEach(function(d){var k=kindOf(d); if(k!==pk) named[d]=1; pk=k;});

  for(var w=0;w<WEEKS;w++){
    var days=[]; for(var c=0;c<7;c++) days.push(ds(START+w*7+c));
    var inM=function(d){return mm(d)===MO;};
    h+='<div class="wk">';
    /* corners outside the month (not the next-issue day) become note cards */
    var lead=0; while(lead<7&&!inM(days[lead])) lead++;
    var trail=0; while(trail<7&&!inM(days[6-trail])&&days[6-trail]!==NEXT) trail++;
    for(c=0;c<7;c++){
      var d=days[c], cls='cl'+(c===0?' c0':''), span=1;
      if(c<lead){ if(c>0) continue; span=lead; cls+=' out'; }
      else if(c>=7-trail){ if(c>7-trail) continue; span=trail; cls+=' out'; }
      else if(d===TODAY) cls+=' today';
      else if(inM(d)&&d<FIRST) cls+=' pre';
      h+='<div class="'+cls+'" style="grid-column:'+(c+1)+' / span '+span+'"></div>';
    }
    /* phase line segments */
    var segs=[], cur=null;
    days.forEach(function(d,c){var k=kindOf(d); if(k&&cur&&cur.k===k&&!isSplit(k)) cur.e=c; else { if(cur) segs.push(cur); cur=k?{k:k,s:c,e:c}:null; }});
    if(cur) segs.push(cur);
    segs.forEach(function(s){
      var l=!isSplit(s.k)&&s.s===0&&kindOf(ds(dn(days[0])-1))===s.k, r=!isSplit(s.k)&&s.e===6&&kindOf(ds(dn(days[6])+1))===s.k;
      h+='<i class="ln'+(l?' cl-l':'')+(r?' cl-r':'')+'" style="grid-column:'+(s.s+1)+' / '+(s.e+2)+';background:'+lineBg(s.k)+'"></i>';
    });
    /* notes */
    if(lead>=2) h+='<div class="note" style="grid-column:1 / span '+lead+'">'+legendNote()+'</div>';
    if(trail>=2) h+='<div class="note" style="grid-column:'+(8-trail)+' / span '+trail+'">'+statsNote()+'</div>';
    /* day cells */
    days.forEach(function(d,c){
      if(c<lead||c>=7-trail) return;
      var col='grid-column:'+(c+1), wdc=c===0?' sun':c===6?' sat':'', list=DM[d], b=lastOf(d), k=kindOf(d);
      var num=inM(d)?String(dd(d)):mm(d)+'.'+dd(d);
      var row='<div class="dr" style="'+col+'">';
      if(d===TODAY) row+='<b class="dn tday">'+num+'</b><span class="tag">오늘</span>';
      else row+='<b class="dn'+wdc+(inM(d)&&d>=FIRST||d===NEXT?'':' faint')+'">'+num+'</b>';
      if(d===NEXT) row+='<span class="tag">내일</span>';
      if(b&&named[d]) row+='<span class="pc">'+mark(k)+(isSplit(k)?'':'<span>'+kname(k)+'</span>')+'</span>';
      row+='<span class="sp"></span>';
      if(d==='2026-09-08') row+='<span class="clip" title="부속 문서: UNI·ARB 관통 해부">'+I.clip+'</span>';
      if(list&&list.length>1) row+='<span class="runs">'+list.length+'회</span>';
      h+=row+'</div>';
      if(b) h+='<a class="cv" style="'+col+'" href="'+esc(b.url)+'" aria-label="'+esc(dayLabel(d)+' 제'+vol(b)+'호')+'">'+cover(b)+'</a>';
      else if(d===NEXT) h+='<div class="slot next" style="'+col+'"><span class="num">제'+(B.length+1)+'호</span><b>06:10 발행 예정</b></div>';
      else if(isGap(d)) h+='<div class="slot" style="'+col+'"><b>브리핑 없음</b></div>';
      else if(inM(d)&&d<FIRST) h+='<div class="slot pre" style="'+col+'"><b>기록 전</b><span>첫 호는<br>'+dayLabel(FIRST)+'</span></div>';
    });
    h+='</div>';
  }
  h+=multiRuns()+'</section>';
  return h;
}
function legendNote(){
  var r=['A','B','C','D','E'].map(function(p){return '<div>'+mark(p)+'<span>'+PHN[p]+'</span></div>';}).join('');
  return '<h3>국면 판정</h3><div class="lg">'+r+'<i class="lg-sep"></i><div>'+mark('A>C')+'<span>걸친 판정</span></div><div>'+mark('?')+'<span>미기록</span></div></div>';
}
function statsNote(){
  var inMonth=B.filter(function(b){return mm(b.date)===MO;});
  var pubDays=DAYS.filter(function(d){return mm(d)===MO;});
  var gaps=0; for(var n=dn(FIRST);n<=dn(TODAY);n++) if(isGap(ds(n))) gaps++;
  var multi=pubDays.filter(function(d){return DM[d].length>1;}).length;
  var rows=[['발행한 호',inMonth.length,'호'],['발행한 날',pubDays.length,'일'],['브리핑 없는 날',gaps,'일'],['여러 번 낸 날',multi,'일'],['지표 기록일',stats().days,'일']];
  return '<h3>'+MO+'월 기록</h3><div class="st">'+rows.map(function(r){return '<div><span>'+r[0]+'</span><b>'+r[1]+'<small>'+r[2]+'</small></b></div>';}).join('')+'</div>';
}
function multiRuns(){
  var md=DAYS.filter(function(d){return DM[d].length>1;});
  if(!md.length) return '';
  var h='<div class="multi"><div class="multi-head"><h3>하루에 여러 번 낸 날</h3><p>달력 칸에는 그날의 마지막 회차를 걸었습니다. 같은 날 앞선 회차까지 순서대로 펼치면 이렇습니다.</p></div><div class="mgs">';
  md.forEach(function(d){
    var l=DM[d];
    h+='<div class="mg"><div class="mg-h"><span class="num">'+mm(d)+'.'+dd(d)+'</span><em>'+wd(d)+'요일</em><span class="runs">'+l.length+'회</span></div><div class="mg-row">';
    l.forEach(function(b,i){
      var sub=runSub(b);
      h+='<div class="mg-it"><a href="'+esc(b.url)+'" aria-label="'+esc(dayLabel(d)+' '+b.seq+'회차')+'">'+cover(b)+'</a>'
        +'<p class="mg-cap"><b>'+b.seq+'회차</b><i>제'+vol(b)+'호</i>'+(sub?'<span>'+sub+'</span>':'')+'</p></div>';
    });
    h+='</div></div>';
  });
  return h+'</div></div>';
}

/* ================= flow: phase per day + three indicators, one shared day axis ================= */
var LABW=236, PLOTW=1360-56-LABW, GUT=46, PW=PLOTW-GUT, DW=PW/ND;
function X(day){return (day-.5)*DW;}
function bgCols(hgt,opt){
  var s='', td=dd(TODAY);
  for(var day=1;day<=ND;day++){
    var d=Y+'-'+pad(MO)+'-'+pad(day);
    if(isGap(d)) s+='<rect x="'+((day-1)*DW).toFixed(1)+'" y="0" width="'+DW.toFixed(1)+'" height="'+hgt+'" fill="url(#hatch)" opacity="'+(opt&&opt.solid?1:.7)+'"/>';
    if(dow(d)===0&&day>1) s+='<line x1="'+((day-1)*DW).toFixed(1)+'" x2="'+((day-1)*DW).toFixed(1)+'" y1="0" y2="'+hgt+'" style="stroke:var(--line)" stroke-width="1"/>';
  }
  s='<rect x="'+((td-1)*DW).toFixed(1)+'" y="0" width="'+DW.toFixed(1)+'" height="'+hgt+'" style="fill:var(--acc-tint)"/>'+s;
  return s;
}
function svgOpen(hgt){return '<svg class="fx" width="'+PLOTW+'" height="'+hgt+'" viewBox="0 0 '+PLOTW+' '+hgt+'">';}
function axisRow(){
  var hgt=44, s=svgOpen(hgt)+bgCols(hgt), td=dd(TODAY);
  for(var day=1;day<=ND;day++){
    var d=Y+'-'+pad(MO)+'-'+pad(day), w=dow(d), c=w===0?' sun':w===6?' sat':'';
    if(day===td) s+='<circle cx="'+X(day).toFixed(1)+'" cy="16" r="12" style="fill:var(--acc)"/>';
    s+='<text class="ax-d'+(day===td?' td':c)+'" x="'+X(day).toFixed(1)+'" y="20.5" text-anchor="middle">'+day+'</text>';
    s+='<text class="ax-w'+c+'" x="'+X(day).toFixed(1)+'" y="39" text-anchor="middle">'+WD[w]+'</text>';
  }
  return '<div class="fl-row axis"><div class="fl-lab" style="padding-top:12px"><p class="fl-s" style="margin:0">'+MO+'월 1일 ~ '+ND+'일 · 하루 한 칸</p></div><div class="fl-plot">'+s+'</svg></div></div>';
}
function phaseRow(){
  var hgt=40, y0=7, ph=26, s=svgOpen(hgt)+bgCols(hgt,{solid:1}), gl=null;
  for(var day=1;day<=ND;day++){
    var d=Y+'-'+pad(MO)+'-'+pad(day), k=kindOf(d), x=(day-1)*DW+1.5, w=DW-3;
    if(isGap(d)){ if(gl==null) gl=day; continue; }
    if(gl!=null){ s+=gapLabel(gl,day-1,y0,ph); gl=null; }
    if(!k) continue;
    if(k==='?'){ s+='<rect x="'+x.toFixed(1)+'" y="'+y0+'" width="'+w.toFixed(1)+'" height="'+ph+'" rx="4" style="fill:var(--q)"/><text class="ph-l" x="'+X(day).toFixed(1)+'" y="'+(y0+17)+'" text-anchor="middle" style="fill:var(--ink2)">?</text>'; continue; }
    var ps=k.split('>');
    if(ps.length===1){ s+='<rect x="'+x.toFixed(1)+'" y="'+y0+'" width="'+w.toFixed(1)+'" height="'+ph+'" rx="4" fill="'+PCOL[ps[0]]+'"/><text class="ph-l" x="'+X(day).toFixed(1)+'" y="'+(y0+17)+'" text-anchor="middle" style="fill:'+PINK[ps[0]]+'">'+ps[0]+'</text>'; }
    else {
      var hw=w/2;
      s+='<clipPath id="cp'+day+'"><rect x="'+x.toFixed(1)+'" y="'+y0+'" width="'+w.toFixed(1)+'" height="'+ph+'" rx="4"/></clipPath><g clip-path="url(#cp'+day+')">'
        +'<rect x="'+x.toFixed(1)+'" y="'+y0+'" width="'+hw.toFixed(1)+'" height="'+ph+'" fill="'+PCOL[ps[0]]+'"/><rect x="'+(x+hw).toFixed(1)+'" y="'+y0+'" width="'+hw.toFixed(1)+'" height="'+ph+'" fill="'+PCOL[ps[1]]+'"/></g>'
        +'<text class="ph-l" x="'+(x+hw/2).toFixed(1)+'" y="'+(y0+17)+'" text-anchor="middle" style="font-size:10px;fill:'+PINK[ps[0]]+'">'+ps[0]+'</text>'
        +'<text class="ph-l" x="'+(x+hw*1.5).toFixed(1)+'" y="'+(y0+17)+'" text-anchor="middle" style="font-size:10px;fill:'+PINK[ps[1]]+'">'+ps[1]+'</text>';
    }
  }
  if(gl!=null) s+=gapLabel(gl,ND,y0,ph);
  var pv=B.filter(function(b){return b.provisional;})[0], allPv=pv&&B.filter(function(b){return b.date>=pv.date;}).every(function(b){return b.provisional;});
  return '<div class="fl-row mid"><div class="fl-lab"><p class="fl-n">국면</p>'+(allPv?'<p class="fl-s">'+dayLabel(pv.date)+'부터 모두 <b>임시 기준</b></p>':'')+'</div><div class="fl-plot">'+s+'</svg></div></div>';
}
function gapLabel(a,b,y0,ph){var cx=((a-1)*DW+b*DW)/2; return '<text class="gap-l" x="'+cx.toFixed(1)+'" y="'+(y0+17)+'" text-anchor="middle">브리핑 없음</text>';}
function chartRow(key,o){
  var hgt=o.h||118, top=13, bot=13, ih=hgt-top-bot, lo=o.lo, hi=o.hi;
  function Yv(v){return top+(hi-v)/(hi-lo)*ih;}
  var pts=daily(key).filter(function(p){return mm(p.d)===MO;}).map(function(p){return {day:dd(p.d),v:p.v};});
  var s=svgOpen(hgt)+bgCols(hgt);
  o.ticks.forEach(function(t){var y=Yv(t).toFixed(1); s+='<line x1="0" x2="'+PW+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)" stroke-width="1"/><text class="tk" x="'+(PW+10)+'" y="'+(+y+3.5)+'">'+o.tf(t)+'</text>';});
  (o.refs||[]).forEach(function(r){var y=Yv(r.v).toFixed(1); s+='<line x1="0" x2="'+PW+'" y1="'+y+'" y2="'+y+'" stroke="'+r.c+'" stroke-width="1.6" stroke-dasharray="5 4"/>'
    +'<text class="rl" x="'+(r.x||6)+'" y="'+(+y+(r.below?14:-6))+'">'+r.t+'</text>';});
  /* segments split at missing days */
  var segs=[], cur=[];
  pts.forEach(function(p,i){ if(i&&p.day!==pts[i-1].day+1){segs.push(cur); cur=[];} cur.push(p); }); if(cur.length) segs.push(cur);
  var base=o.base!=null?Yv(o.base):top+ih;
  segs.forEach(function(sg_){
    var d=sg_.map(function(p,i){return (i?'L':'M')+X(p.day).toFixed(1)+' '+Yv(p.v).toFixed(1);}).join('');
    s+='<path d="'+d+'L'+X(sg_[sg_.length-1].day).toFixed(1)+' '+base.toFixed(1)+'L'+X(sg_[0].day).toFixed(1)+' '+base.toFixed(1)+'Z" style="fill:var(--ink)" opacity=".06"/>';
    s+='<path d="'+d+'" fill="none" style="stroke:var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  });
  pts.forEach(function(p,i){var last=i===pts.length-1; s+='<circle cx="'+X(p.day).toFixed(1)+'" cy="'+Yv(p.v).toFixed(1)+'" r="'+(last?5:2.4)+'" style="fill:'+(last?'var(--acc)':'var(--ink)')+';stroke:'+(last?'var(--acc2)':'#fff')+'" stroke-width="'+(last?2.5:1)+'"/>';});
  var lv=pts[pts.length-1];
  return '<div class="fl-row"><div class="fl-lab"><p class="fl-n">'+o.name+'</p><p class="fl-v">'+o.vf(lv.v)+'</p><p class="fl-s">'+o.sub+'</p></div><div class="fl-plot">'+s+'</svg></div></div>';
}

    +'<div class="btns"><button type="button" class="btn" aria-expanded="false">'+I.down+'날짜별 값 표 펼치기</button><button type="button" class="btn">'+I.dl+'CSV 내려받기</button></div></div>';

    vf:function(v){return f(v,2)+'<small>%</small>';},sub:'비트코인 점유율 · 전날 대비 <b>'+sg(dl.dB,2)+'%p</b>'});
  h+=chartRow('stable1m',{name:'ΣSTABLECOIN.D 1개월 변화',lo:-2.45,hi:1.35,ticks:[-2,-1,0,1],tf:function(t){return (t>0?'+':t<0?'−':'')+Math.abs(t).toFixed(1);},
    refs:[{v:1,c:PCOL.E,t:'+1.0%p · E 판정 임시 기준'}],base:0,
    vf:function(v){return sg(v,3)+'<small>%p</small>';},sub:'점유율 '+f(L.stableD,3)+'%<br>E 판정 임시 기준 <b>+1.0%p</b>'});
  h+=chartRow('btc1m',{name:'BTCUSD 1개월 변화',lo:-4,hi:27,ticks:[0,10,20],tf:function(t){return (t>0?'+':'')+t;},
    refs:[{v:0,c:PCOL.D,t:'0 · 이 아래가 D·E 판정의 전제',below:1}],base:0,
    vf:function(v){return sg(v,2)+'<small>%</small>';},sub:'<b>0 아래</b>로 내려가야 D·E 판정의 전제가 선다'});
  h+='<div class="fl-foot"><div class="lgd">'
    +'<span><svg width="22" height="10"><path d="M1 7L8 3L14 6L21 2" fill="none" stroke="#152031" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>그날 값</span>'
    +'<span><svg width="14" height="14"><circle cx="7" cy="7" r="4.5" style="fill:var(--acc);stroke:var(--acc2)" stroke-width="2"/></svg>오늘</span>'
    +'<span><svg width="22" height="10"><line x1="1" y1="5" x2="21" y2="5" stroke="#4B5768" stroke-width="1.6" stroke-dasharray="5 4"/></svg>판정 기준선</span>'
    +'<span><svg width="16" height="12"><rect width="16" height="12" fill="url(#hatch)"/></svg>브리핑 없는 날</span></div>'
    +'<span>값은 각 브리핑이 조회한 시점의 기록입니다</span></div>';
  return h+'</section>';
}
