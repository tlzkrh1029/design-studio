<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>크립토 브리핑 서고</title>
<!-- 페이지 글꼴: Gothic A1 400·500·700·800, Oswald 500, IBM Plex Mono 400·500 -->
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/oswald/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/500.css">
<!-- 표지 부품이 스스로 쓰는 글꼴(표지를 원래대로 그리기 위해서만): Gothic A1 600, Oswald 600, Outfit 700·800 -->
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/oswald/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/outfit/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/outfit/800.css">
<link rel="stylesheet" href="../mz.css">
<style>
:root {
  /* ── 바탕 ── */
  --bg: #0B0C0F;                 /* 페이지 바탕. 거의 검은 무채색 */
  --bg-raise: #15171C;           /* 검색창, 읽기 창, 표 머리처럼 한 단 떠 있는 면 */
  --bg-hover: #1C1F25;           /* 목록 행·흐름 날짜 열에 포인터를 올렸을 때 */
  --topbar-bg: rgba(11, 12, 15, 0.88); /* 고정 상단 막대. 뒤 내용을 흐리게 비친다 */

  /* ── 글자 (괄호는 --bg 대비 명암비) ── */
  --text-1: #F2EFEA;             /* 헤드라인, 제목, 본문 (약 17) */
  --text-2: #B9B4AC;             /* 보조 설명, 꼬리표, 증감 (약 9.5) */
  --text-3: #8A867F;             /* 축 눈금, 범례 등 가장 약한 글자 (약 5.4). 글자는 이보다 어둡게 쓰지 않는다 */

  /* ── 선 ── */
  --line-1: #23252B;             /* 구역·행 구분 머리카락선 */
  --line-2: #3A3D45;             /* 입력창·버튼 테두리 */
  --line-grid: #1C1E24;          /* 차트 눈금선 */
  --line-ref: #8A867F;           /* 차트 기준선(+1.0%p, 0) */
  --ref-dash: 4 4;               /* 기준선 점선 간격 (SVG stroke-dasharray) */

  /* ── 강조: 그날 표지의 테두리색. 아래 값은 9/30 표지(복숭아) ── */
  --accent: #F2B39F;
  --accent-text: #F2B39F;        /* 바탕 위 강조 글자. 테두리색이 --bg 대비 4.5 미만인 날은 흰색과 섞어 4.5 이상으로 올린다 */
  --accent-ink: #1B110D;         /* 강조색 면 위 글자 (약 10) */
  --accent-glow: color-mix(in srgb, var(--accent) 18%, transparent); /* 히어로 표지 뒤 번짐, 다음 호 자리의 빛 */
  --accent-soft: color-mix(in srgb, var(--accent) 22%, transparent); /* 검색어 강조 바탕 */

  /* ── 조명 ── */
  --light-beam: rgba(255, 240, 225, 0.075);  /* 히어로 위에서 떨어지는 빛 기둥 */
  --light-shelf: rgba(255, 240, 225, 0.045); /* 선반마다 위에서 비추는 띠 조명 */
  --vignette: rgba(0, 0, 0, 0.55);           /* 히어로 가장자리 어둠 */

  /* ── 선반과 빈 자리 ── */
  --shelf-top: #2C2F36;          /* 선반 윗면 */
  --shelf-face: #16181D;         /* 선반 앞면 */
  --shelf-top-height: 4px;
  --shelf-height: 14px;          /* 윗면을 포함한 전체 두께 */
  --slot-empty-border: 1px dashed #3A3D45;     /* 브리핑 없는 날의 빈 자리·빈 칸 */
  --slot-next-border: 1px dashed var(--accent); /* 다음 호 자리·칸 */

  /* ── 국면 (지금 쓰는 색 그대로). -ink는 그 칸 위 글자색 ── */
  --phase-a: #CB8242;
  --phase-a-ink: #0B0C0F;
  --phase-b: #A96CAF;
  --phase-b-ink: #0B0C0F;
  --phase-c: #056F15;
  --phase-c-ink: #FFFFFF;
  --phase-d: #594D99;
  --phase-d-ink: #FFFFFF;
  --phase-e: #2B97FF;
  --phase-e-ink: #0B0C0F;
  --phase-none: #3A3D45;         /* 국면이 없는 호의 '?' 칸 */
  --phase-none-ink: #F2EFEA;

  /* ── 차트 ── */
  --chart-line: #E6E1D9;         /* 지표 선 */
  --chart-line-width: 1.5px;
  --chart-point: 4px;            /* 날마다 찍는 점 지름 */
  --chart-point-today: 8px;      /* 오늘 점 지름. 색은 --accent */

  /* ── 글꼴 ── */
  --font-sans: "Gothic A1", sans-serif;                 /* 헤드라인, 제목, 본문 */
  --font-display: "Oswald", "Gothic A1", sans-serif;    /* 날짜, 큰 숫자, 국면 글자 */
  --font-mono: "IBM Plex Mono", "Gothic A1", monospace; /* 꼬리표, 축, 표 숫자 */

  /* ── 글자 크기 ── */
  --fs-hero-headline: 48px;
  --fs-metric: 36px;             /* 히어로 지표 값 */
  --fs-hero-date: 32px;
  --fs-section-title: 30px;
  --fs-phase-letter: 30px;       /* 히어로 국면 칸 글자 */
  --fs-phase-name: 22px;         /* 히어로 국면 이름 */
  --fs-lead: 18px;
  --fs-body: 16px;
  --fs-table: 15px;
  --fs-small: 14px;
  --fs-label: 13px;              /* 고정폭 라벨, 선반 꼬리표 */
  --fs-micro: 12px;              /* 차트 눈금, 흐름 칸 아래 날짜, 회차 번호 */

  /* ── 굵기 ── */
  --fw-body: 400;
  --fw-medium: 500;
  --fw-strong: 700;
  --fw-heavy: 800;               /* 헤드라인, 구역 제목 */
  --fw-display: 500;             /* Oswald 숫자 */

  /* ── 줄 높이와 자간 ── */
  --lh-headline: 1.24;
  --lh-title: 1.3;
  --lh-body: 1.6;
  --lh-label: 1.4;
  --lh-numeral: 1;
  --ls-headline: -0.02em;
  --ls-display: 0.01em;
  --ls-mono: 0.02em;

  /* ── 간격 ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --space-10: 128px;
  --section-gap: 128px;          /* 구역 사이 */
  --section-head-gap: 40px;      /* 구역 머리와 내용 사이 */

  /* ── 둥글기 ── */
  --radius-s: 4px;               /* 국면 칸, 칩 */
  --radius-m: 8px;               /* 버튼, 입력창, 읽기 창 */
  --radius-pill: 999px;          /* 실행 값 알약 */

  /* ── 그림자 (표지에는 아래·뒤로만) ── */
  --shadow-cover-hero: 0 48px 80px -28px rgba(0, 0, 0, 0.9), 0 14px 24px -12px rgba(0, 0, 0, 0.7);
  --shadow-cover: 0 18px 26px -14px rgba(0, 0, 0, 0.85);
  --shadow-cover-hover: 0 28px 36px -16px rgba(0, 0, 0, 0.9);
  --shadow-ledge: 0 12px 20px -8px rgba(0, 0, 0, 0.75);  /* 선반·받침 아래 */
  --shadow-popover: 0 16px 40px rgba(0, 0, 0, 0.6);       /* 읽기 창, 범위 선택 목록 */

  /* ── 레이아웃 ── */
  --page-width: 1440px;
  --content-width: 1280px;
  --gutter: 80px;
  --viewport-check-height: 900px; /* 완료 기준의 '첫 화면' 높이 */
  --topbar-height: 64px;
  --search-width: 360px;         /* 범위 선택 + 입력 */
  --control-height: 40px;        /* 검색창, 작은 버튼 */
  --button-height: 52px;         /* 히어로 버튼 */
  --hero-pad-top: 56px;
  --hero-stage-width: 560px;     /* 빛 기둥 + 표지 */
  --hero-col-gap: 80px;
  --hero-text-width: 640px;
  --phase-cell-hero: 56px;       /* 히어로 국면 칸 한 변 */
  --phase-chip: 28px;            /* 목록 국면 칸 한 변 */

  /* ── 표지 (비율 68:100 고정) ── */
  --cover-aspect: 68 / 100;
  --cover-hero: 440px;
  --cover-shelf: 140px;
  --cover-min: 96px;             /* 이보다 작게 그리지 않는다 */
  --gap-day: 20px;               /* 가판대에서 날과 날 사이 */
  --gap-same-day: 8px;           /* 같은 날 회차 사이 */
  --shelf-row-gap: 56px;         /* 선반과 선반 사이 */
  --tag-gap: 10px;               /* 선반과 꼬리표 사이 */

  /* ── 국면·지표 흐름 ── */
  --flow-label-width: 176px;     /* 줄 이름과 단위 */
  --flow-day-width: 36px;        /* 하루 한 열. 9/2~10/1의 30열 */
  --flow-week-gap: 6px;          /* 월요일 앞에 더하는 간격. 가판대의 주 단위와 리듬을 맞춘다 */
  --flow-cell-gap: 4px;
  --flow-cell-height: 40px;
  --flow-track-height: 112px;    /* 지표 한 줄 높이 */
  --flow-track-gap: 16px;

  /* ── 발행 목록 ── */
  --list-row-height: 60px;
  --col-no: 56px;
  --col-date: 120px;
  --col-phase: 64px;
  --col-num: 104px;              /* 지표 한 열 */
  --col-run: 112px;

  /* ── 움직임 ── */
  --dur-fast: 160ms;
  --dur-base: 280ms;
  --dur-slow: 700ms;             /* 빛 기둥이 켜지는 시간 */
  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
  --lift-hover: 4px;             /* 표지를 올렸을 때 떠오르는 높이 */
  --focus-width: 2px;            /* 초점 테두리. 색은 --accent */
  --focus-offset: 3px;

  /* ── 이 페이지에서 더한 값 (<check>에 보고) ── */
  --hairline: 1px;               /* 머리카락선·테두리 두께 */
  --mark-width: 2px;             /* 지금 메뉴 밑줄, 오늘 칸 테두리의 선 두께 */
  --topbar-blur: 12px;           /* 상단 막대 뒤 내용 흐림 */
  --beam-spread: 20deg;          /* 빛 기둥이 퍼지는 각 */
  --beam-soft: 5deg;             /* 빛 기둥 가장자리 번짐 */
  --beam-apex: -1150px;          /* 빛 기둥 꼭짓점(막대 위 바깥)의 높이 */
  --dot-issue: 4px;              /* 흐름 칸 아래 회차 점 지름 */
  --icon: 16px;                  /* 선 아이콘 크기 */
  --icon-stroke: 1.5px;          /* 선 아이콘 획 두께 */
  --section-desc-width: 560px;   /* 구역 머리 오른쪽 설명 폭 */
  --popover-width: 288px;        /* 흐름 읽기 창 폭 */
}

/* ───────── 바탕 ───────── */
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text-1); font-family: var(--font-sans); font-size: var(--fs-body);
  font-weight: var(--fw-body); line-height: var(--lh-body); word-break: keep-all; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
p, h1, h2, h3, dl, dd { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: var(--focus-width) solid var(--accent); outline-offset: var(--focus-offset); }
.wrap { width: var(--content-width); margin-inline: auto; }
.mono { font-family: var(--font-mono); letter-spacing: var(--ls-mono); }
.sr { position: absolute; width: var(--hairline); height: var(--hairline); overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
svg.ic { width: var(--icon); height: var(--icon); flex: none; fill: none; stroke: currentColor; stroke-width: var(--icon-stroke); stroke-linecap: round; stroke-linejoin: round; }

/* ───────── 상단 막대 ───────── */
.tb { position: sticky; top: 0; z-index: 30; height: var(--topbar-height); background: var(--topbar-bg);
  -webkit-backdrop-filter: blur(var(--topbar-blur)); backdrop-filter: blur(var(--topbar-blur)); border-bottom: var(--hairline) solid var(--line-1); }
.tb-in { height: 100%; display: flex; align-items: center; gap: var(--space-6); }
.logo { display: flex; align-items: baseline; gap: var(--space-2); white-space: nowrap; }
.logo b { font-weight: var(--fw-heavy); font-size: var(--fs-body); letter-spacing: var(--ls-mono); }
.logo span { font-size: var(--fs-label); color: var(--text-2); }
.nav { margin-left: auto; display: flex; gap: var(--space-6); height: 100%; }
.nav a { position: relative; display: flex; align-items: center; font-size: var(--fs-small); font-weight: var(--fw-medium); color: var(--text-2); white-space: nowrap; }
.nav a:hover { color: var(--text-1); }
.nav a.on { color: var(--text-1); }
.nav a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: calc(-1 * var(--hairline)); height: var(--mark-width); background: var(--text-1); }
.search { display: flex; align-items: center; width: var(--search-width); height: var(--control-height); margin: 0;
  border: var(--hairline) solid var(--line-2); border-radius: var(--radius-m); background: var(--bg-raise); }
.search:focus-within { border-color: var(--accent); }
.scope { position: relative; height: 100%; display: flex; align-items: center; border-right: var(--hairline) solid var(--line-2); }
.scope select { appearance: none; -webkit-appearance: none; height: 100%; padding: 0 calc(var(--space-3) + var(--icon)) 0 var(--space-3);
  background: transparent; border: 0; border-radius: var(--radius-m) 0 0 var(--radius-m); color: var(--text-1); font: inherit; font-size: var(--fs-small); cursor: pointer; }
.scope select:focus { outline: none; }
.scope option { background: var(--bg-raise); color: var(--text-1); }
.scope .ic { position: absolute; right: var(--space-2); color: var(--text-2); pointer-events: none; }
.search > .ic { margin: 0 var(--space-2) 0 var(--space-3); color: var(--text-2); }
.search input { flex: 1; min-width: 0; height: 100%; padding: 0 var(--space-3) 0 0; background: transparent; border: 0;
  color: var(--text-1); font: inherit; font-size: var(--fs-small); }
.search input::placeholder { color: var(--text-3); }
.search input:focus { outline: none; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }

/* ───────── 오늘의 호 (히어로) ───────── */
.hero { position: relative; padding: var(--hero-pad-top) 0 0; scroll-margin-top: var(--topbar-height); }
.hero-bg { position: absolute; inset: 0; pointer-events: none; }
.vig { position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 40%, transparent 40%, var(--vignette) 100%);
  -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent); mask-image: linear-gradient(to bottom, black 70%, transparent); }
.hero-grid { position: relative; display: grid; grid-template-columns: var(--hero-stage-width) var(--hero-text-width); column-gap: var(--hero-col-gap); align-items: center; }
.stage { position: relative; display: flex; flex-direction: column; align-items: center; }
.beam { position: absolute; top: calc(-1 * var(--hero-pad-top)); left: 50%; height: calc(100% + var(--hero-pad-top));
  width: calc(var(--hero-stage-width) + 2 * var(--space-8)); transform: translateX(-50%); pointer-events: none;
  background: conic-gradient(from calc(180deg - var(--beam-spread) / 2) at 50% var(--beam-apex),
    transparent 0deg, var(--light-beam) var(--beam-soft), var(--light-beam) calc(var(--beam-spread) - var(--beam-soft)), transparent var(--beam-spread));
  -webkit-mask-image: linear-gradient(to bottom, black, transparent 180%); mask-image: linear-gradient(to bottom, black, transparent 180%);
  animation: beam-on var(--dur-slow) var(--ease-out) both; }
@keyframes beam-on { from { opacity: 0; } to { opacity: 1; } }
.glow { position: absolute; inset: calc(-1 * var(--space-8)) calc(-1 * var(--space-6)); pointer-events: none;
  background: radial-gradient(closest-side, var(--accent-glow), transparent); }
.cv { position: relative; display: block; width: var(--cover-shelf); box-shadow: var(--shadow-cover);
  transition: transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out); }
.cv:hover { transform: translateY(calc(-1 * var(--lift-hover))); box-shadow: var(--shadow-cover-hover); }
.cv-hero { width: var(--cover-hero); box-shadow: var(--shadow-cover-hero); }
.cv-hero:hover { box-shadow: var(--shadow-cover-hero), var(--shadow-cover-hover); }
.plinth { position: relative; width: calc(var(--cover-hero) + 2 * var(--space-5)); height: var(--shelf-height);
  background: linear-gradient(var(--shelf-top) 0 var(--shelf-top-height), var(--shelf-face) var(--shelf-top-height)); box-shadow: var(--shadow-ledge); }

.hero-text { position: relative; }
.eyebrow { display: flex; align-items: center; gap: var(--space-3); font-family: var(--font-mono); font-size: var(--fs-label);
  letter-spacing: var(--ls-mono); line-height: var(--lh-label); color: var(--text-2); }
.eyebrow i { width: var(--space-5); height: var(--hairline); background: var(--text-3); }
.dateline { display: flex; align-items: baseline; gap: var(--space-3); margin-top: var(--space-4); }
.dateline b { font-family: var(--font-display); font-weight: var(--fw-display); font-size: var(--fs-hero-date); line-height: var(--lh-numeral); letter-spacing: var(--ls-display); }
.dateline span { font-size: var(--fs-body); font-weight: var(--fw-medium); color: var(--text-2); }
.hl { margin-top: var(--space-5); font-weight: var(--fw-heavy); font-size: var(--fs-hero-headline); line-height: var(--lh-headline);
  letter-spacing: var(--ls-headline); color: var(--text-1); text-wrap: balance; }
.hl span { display: block; text-wrap: wrap; }
.hl span:last-child { text-wrap: balance; }
.today-ph { display: flex; align-items: center; gap: var(--space-4); margin-top: var(--space-7); }
.today-ph .lab { font-family: var(--font-mono); font-size: var(--fs-label); letter-spacing: var(--ls-mono); line-height: var(--lh-label); color: var(--text-2); }
.today-ph .name { font-weight: var(--fw-heavy); font-size: var(--fs-phase-name); line-height: var(--lh-title); }
.today-sub { margin-top: var(--space-3); font-size: var(--fs-small); color: var(--text-2); }
.metrics { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; margin-top: var(--space-6); }
.metric { padding: 0 var(--space-6); border-left: var(--hairline) solid var(--line-1); }
.metric:first-child { padding-left: 0; border-left: 0; }
.metric dt { font-family: var(--font-mono); font-size: var(--fs-label); letter-spacing: var(--ls-mono); line-height: var(--lh-label); color: var(--text-2); white-space: nowrap; }
.metric .val { margin-top: var(--space-2); font-family: var(--font-display); font-weight: var(--fw-display); font-size: var(--fs-metric);
  line-height: var(--lh-numeral); letter-spacing: var(--ls-display); white-space: nowrap; }
.metric .val small { margin-left: var(--space-1); font-size: var(--fs-lead); color: var(--text-2); }
.metric .cmp { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-3); font-size: var(--fs-small); line-height: var(--lh-label); color: var(--text-2); white-space: nowrap; }
.metric .cmp + .cmp { margin-top: var(--space-1); }

      + '<div class="acts"><button type="button" class="btn-s" data-act="all">범위를 전체로</button><button type="button" class="btn-s" data-act="clear">검색 지우기</button></div>'
      + '<p class="eg">날짜로 찾으려면 <b>09.24</b>처럼 적어 보세요.</p></div>';
    return;
  }
  body.innerHTML = hits.map(function(h){
    var show = h.it.b.date !== lastDate; lastDate = h.it.b.date;
    var useRe = (scope === 'date') ? null : qRegex(q);
    var noteHit = h.inN && !h.inH && !!h.it.b.headline;
    return rowHTML(h.it, (h.inH || h.inN) ? useRe : null, h.inD, show, noteHit);
  }).join('');
}

];

var qEl = document.getElementById('q'), scEl = document.getElementById('q-scope'), listSec = document.getElementById('list');
var wasEmpty = true;
function runSearch(){
  var q = qEl.value.trim();
  renderList(q, scEl.value);
  if (q && wasEmpty) { var r = listSec.getBoundingClientRect(); if (r.top > window.innerHeight * 0.6 || r.bottom < 0) listSec.scrollIntoView({ block: 'start' }); }
  wasEmpty = !q;
}
qEl.addEventListener('input', runSearch);
scEl.addEventListener('change', runSearch);
qEl.addEventListener('keydown', function(e){ if (e.key === 'Escape') { qEl.value = ''; runSearch(); } if (e.key === 'Enter') listSec.scrollIntoView({ block: 'start' }); });
document.getElementById('tbl-body').addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if (!t) return;

var navLinks = [].slice.call(document.querySelectorAll('.nav a'));

if ('IntersectionObserver' in window) {

function popHTML(d){

  if (d === NEXT) return '<p class="pd">' + tagDate(d) + ' · 다음 호</p><p class="ph-line">' + NEXT_TIME + ' 발행 예정</p>';
  if (!iss) return '<p class="pd">' + tagDate(d) + '</p><p class="ph-line">브리핑 없음</p>';
  var b = iss[iss.length - 1];
  return '<p class="pd">' + tagDate(d) + (iss.length > 1 ? ' · ' + iss.length + '회 중 마지막' : '') + ' · 제' + vol(b) + '호</p>'

}
plot.addEventListener('mousemove', function(e){
  var r = plot.getBoundingClientRect(), x = e.clientX - r.left - LBLW, idx = -1;
  for (var i = 0; i < FD.length; i++) if (x >= colL(i) && x < colL(i) + DAYW) { idx = i; break; }
  if (idx < 0) { hlEl.classList.remove('on'); pop.hidden = true; return; }
  hlEl.style.left = (LBLW + colL(idx)) + 'px'; hlEl.classList.add('on');
  pop.innerHTML = popHTML(FD[idx]); pop.hidden = false;
  var px = LBLW + colL(idx) + DAYW + tk('--space-3'); if (px + POPW > CONTW) px = LBLW + colL(idx) - tk('--space-3') - POPW;
  pop.style.left = px + 'px'; pop.style.top = tk('--flow-cell-height') + 'px';
});
plot.addEventListener('mouseleave', function(){ hlEl.classList.remove('on'); pop.hidden = true; });

document.getElementById('csv').addEventListener('click', function(){
  var head = ['호', '날짜', '회차', '국면', '전날 국면', '임시 기준', '헤드라인', '메모', 'BTC.D(%)', 'ΣSTABLECOIN.D(%)', 'ΣSTABLECOIN.D 1개월(%p)', 'BTCUSD 1개월(%)', '실행', '링크'];
  var cell = function(v){ v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var rows = B.map(function(b){ return [vol(b), b.date, b.seq, b.phase || '', b.prevPhase || '', b.provisional ? '예' : '', b.headline, b.note, b.btcd, b.stableD, b.stable1m, b.btc1m, runLabel(b), b.url].map(cell).join(','); });
  var blob = new Blob(['﻿' + [head.join(',')].concat(rows).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'crypto-brief-archive.csv'; document.body.appendChild(a); a.click(); a.remove();
});

ready();
