<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>크립토 브리핑 서고</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 페이지 글꼴: Noto Serif KR, Gothic A1, Oswald, IBM Plex Mono. Outfit 700은 표지(.mz) 워드마크용 -->
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/oswald/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/oswald/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/outfit/700.css">
<link rel="stylesheet" href="../mz.css">
<style>
:root {
  /* ── 색: 종이 한 장과 먹 한 가지. 페이지의 색은 이것뿐이고 컬러는 표지에만 있다 ── */
  --bg: #F2EEE6;
  --bg-2: #E8E3D7;
  --text-1: #171614;
  --text-2: #47433C;
  --text-3: #625C53;
  --text-on-fill: #F2EEE6;
  --fill-1: var(--text-1);
  --fill-1-hover: #34302B;
  --line-1: var(--text-1);
  --line-2: #9E9789;
  --line-3: #CFC7B9;
  --line-ref: var(--text-1);
  --line-ref-dash: 4 4;
  --line-placeholder: 1.5px dashed var(--text-3);
  --grain-opacity: 0.05;

  /* ── 국면 무늬 ── */
  --phase-a-fill: var(--text-1);
  --phase-b-fill: repeating-linear-gradient(135deg, var(--text-1) 0 1.5px, transparent 1.5px 5px);
  --phase-c-fill: radial-gradient(circle, var(--text-1) 0 1.1px, transparent 1.5px) 0 0 / 4px 4px;
  --phase-d-fill: repeating-linear-gradient(0deg, var(--text-1) 0 1.5px, transparent 1.5px 4.5px);
  --phase-e-fill: repeating-linear-gradient(45deg, var(--text-1) 0 1px, transparent 1px 4px), repeating-linear-gradient(-45deg, var(--text-1) 0 1px, transparent 1px 4px);

  /* ── 글꼴 ── */
  --font-serif: "Noto Serif KR", serif;
  --font-sans: "Gothic A1", sans-serif;
  --font-num: "Oswald", "Gothic A1", sans-serif;
  --font-mono: "IBM Plex Mono", "Gothic A1", monospace;
  --figures: tabular-nums;

  --fs-masthead: 96px;
  --fs-headline: 52px;
  --fs-stat: 40px;
  --fs-section: 30px;
  --fs-stat-board: 26px;
  --fs-month: 22px;
  --fs-dek: 18px;
  --fs-title: 17px;
  --fs-cta: 17px;
  --fs-tl-letter: 17px;
  --fs-body: 15px;
  --fs-nav: 15px;
  --fs-subtitle: 15px;
  --fs-ear: 14px;
  --fs-table: 14px;
  --fs-caption: 13px;
  --fs-meta: 13px;
  --fs-label: 12px;

  --fw-masthead: 900;
  --fw-headline: 800;
  --fw-section: 800;
  --fw-title: 700;
  --fw-ui: 700;
  --fw-emph: 600;
  --fw-tl: 600;
  --fw-num: 500;
  --fw-meta: 500;
  --fw-body: 400;

  --lh-masthead: 1;
  --lh-headline: 1.22;
  --lh-title: 1.4;
  --lh-body: 1.7;
  --lh-ui: 1.4;
  --lh-num: 1;
  --ls-masthead: -0.02em;
  --ls-headline: -0.02em;
  --ls-label: 0.06em;
  --ls-subtitle: 0.14em;

  /* ── 간격 ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --section-gap: 72px;
  --section-head-gap: 24px;

  /* ── 괘선·모서리·그림자·움직임 ── */
  --rule-heavy: 4px;
  --rule-mid: 2px;
  --rule-hair: 1px;
  --rule-double-gap: 3px;
  --underline-w: 1px;
  --underline-offset: 0.22em;
  --radius: 0px;
  --radius-dot: 50%;
  --shadow-cover-lead: 0 1px 1px rgba(23, 22, 20, 0.14), 0 24px 40px -20px rgba(23, 22, 20, 0.45);
  --shadow-cover: 0 1px 1px rgba(23, 22, 20, 0.14), 0 10px 18px -10px rgba(23, 22, 20, 0.38);
  --shadow-cover-hover: 0 1px 1px rgba(23, 22, 20, 0.16), 0 16px 26px -12px rgba(23, 22, 20, 0.5);
  --focus-ring: 2px solid var(--text-1);
  --focus-offset: 3px;
  --icon-size: 18px;
  --icon-stroke: 1.5px;
  --dur-fast: 150ms;
  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);

  /* ── 판형 ── */
  --page-w: 1440px;
  --first-screen-h: 900px;
  --page-pad-x: 72px;
  --content-w: 1296px;
  --grid-gutter: 24px;
  --header-max-h: 240px;
  --ear-w: 280px;
  --nav-h: 52px;
  --nav-gap: 28px;
  --search-w: 400px;
  --input-h: 40px;
  --hero-pad-top: 28px;
  --hero-gap: 56px;
  --cta-h: 52px;
  --cta-pad-x: 28px;
  --measure: 640px;
  --board-label-w: 200px;
  --board-label-gap: 16px;
  --board-day-w: 36px;
  --tl-gap: 4px;
  --tl-cell-h: 44px;
  --tl-band-h: 10px;
  --chart-row-h: 96px;
  --chart-row-gap: 20px;
  --chart-line-w: 1.75px;
  --chart-dot: 6px;
  --axis-h: 28px;
  --index-cols: 8;
  --index-gap-x: 16px;
  --index-gap-y: 40px;
  --row-h: 34px;

  /* ── 표지 크기 ── */
  --cover-ratio: 68 / 100;
  --cover-lead: 400px;
  --cover-index: 148px;
  --cover-shelf: 104px;
  --cover-result: 96px;

  /* ── 추가한 토큰(역할 이름) ── */
  --tl-head-h: 18px;          /* 연표 칸 위 줄: 같은 국면 구간 이름과 ‘3회’ 회차 수 */
  --fs-stat-side: 18px;       /* 1면 판정·지표 칸에서 큰 숫자 옆에 붙는 단위(%, %p)와 국면 이름 */
  --grain-size: 160px;        /* 종이 결 잡음 한 장의 크기(반복 단위) */
}

/* ---------- 바탕 ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text-1);
  font-family: var(--font-sans); font-size: var(--fs-body); font-weight: var(--fw-body); line-height: var(--lh-body);
  font-variant-numeric: var(--figures); position: relative;
  word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased;
}
body::before {   /* 종이 결: 회색 잡음 한 장을 아주 옅게 */
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image: var(--paper-grain, none); background-size: var(--grain-size) var(--grain-size); opacity: var(--grain-opacity);
}
#app { position: relative; z-index: 1; width: 100%; max-width: var(--page-w); margin: 0 auto; padding: 0 var(--page-pad-x) var(--space-8);
  will-change: transform; /* 글자를 회색조로 다듬어(LCD 색 번짐 없음) 표지 밖에 색 픽셀이 생기지 않게 한다 */ }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: var(--focus-ring); outline-offset: var(--focus-offset); }
.ul { text-decoration: underline; text-decoration-thickness: var(--underline-w); text-underline-offset: var(--underline-offset); text-decoration-color: var(--line-2); }
.ul:hover { text-decoration-color: var(--line-1); }
.hov:hover { text-decoration: underline; text-decoration-thickness: var(--underline-w); text-underline-offset: var(--underline-offset); }
.mono { font-family: var(--font-mono); }
.t2 { color: var(--text-2); }
.t3 { color: var(--text-3); }
.na { color: var(--text-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { width: var(--icon-size); height: var(--icon-size); flex: none; fill: none; stroke: currentColor; stroke-width: var(--icon-stroke); stroke-linecap: square; stroke-linejoin: miter; }
b, strong { font-weight: var(--fw-ui); }

/* 꼬리표·무늬 조각 */
.tag {
  display: inline-block; font-family: var(--font-sans); font-size: var(--fs-label); font-weight: var(--fw-emph);
  line-height: var(--lh-ui); color: var(--text-2); border: var(--rule-hair) solid var(--line-2);
  padding: 0 var(--space-1); white-space: nowrap; border-radius: var(--radius);
}
.sw { display: inline-block; flex: none; width: var(--space-5); height: var(--tl-band-h); vertical-align: middle; }
.sw-2 { display: inline-flex; }
.sw-2 > span { flex: 1; }
.sw-q { border: var(--rule-hair) solid var(--line-2); }

/* ---------- 머리: 귀 · 제호 · 부제 · 메뉴 ---------- */
.mast { padding-top: var(--space-4); }
.dbl { height: calc(var(--rule-heavy) + var(--rule-double-gap) + var(--rule-hair)); border-top: var(--rule-heavy) solid var(--line-1); border-bottom: var(--rule-hair) solid var(--line-1); }
.dbl.rev { border-top-width: var(--rule-hair); border-bottom-width: var(--rule-heavy); }
.mast-row { display: grid; grid-template-columns: var(--ear-w) 1fr var(--ear-w); align-items: center; padding: var(--space-2) 0 var(--space-3); }
.masthead { margin: 0; font-family: var(--font-serif); font-weight: var(--fw-masthead); font-size: var(--fs-masthead); line-height: var(--lh-masthead); letter-spacing: var(--ls-masthead); text-align: center; }
.subtitle { margin: var(--space-3) 0 0; padding-left: var(--ls-subtitle); font-size: var(--fs-subtitle); font-weight: var(--fw-meta); letter-spacing: var(--ls-subtitle); line-height: var(--lh-ui); color: var(--text-2); text-align: center; }
.ear { font-size: var(--fs-ear); line-height: var(--lh-ui); color: var(--text-2); }
.ear p { margin: 0; }
.ear .d { font-weight: var(--fw-ui); color: var(--text-1); }
.ear-r { text-align: right; }
.ear .lnk { color: var(--text-1); font-weight: var(--fw-emph); }

.nav { display: flex; align-items: stretch; justify-content: space-between; height: var(--nav-h); border-bottom: var(--rule-hair) solid var(--line-2); }
.nav-list { display: flex; gap: var(--nav-gap); margin: 0; padding: 0; list-style: none; }
.nav-list a { display: flex; align-items: center; height: 100%; padding-top: var(--rule-mid); margin-bottom: calc(-1 * var(--rule-hair)); border-bottom: var(--rule-mid) solid transparent; font-size: var(--fs-nav); font-weight: var(--fw-ui); line-height: var(--lh-ui); }
.nav-list a[aria-current] { border-bottom-color: var(--line-1); }
.nav-list a:not([aria-current]):hover { border-bottom-color: var(--line-2); }

.search { display: flex; align-items: center; align-self: center; width: var(--search-w); height: var(--input-h); border-bottom: var(--rule-hair) solid var(--line-1); }
.scope { position: relative; display: flex; align-items: center; gap: var(--space-2); flex: none; height: 100%; padding-right: var(--space-3); color: var(--text-3); font-size: var(--fs-meta); }
.scope select {
  appearance: none; -webkit-appearance: none; border: 0; border-radius: var(--radius); background: transparent; height: 100%;
  font-family: var(--font-sans); font-size: var(--fs-meta); font-weight: var(--fw-ui); color: var(--text-2);
  padding: 0 calc(var(--icon-size) + var(--space-1)) 0 0; margin: 0; cursor: pointer;
}
.scope .ico { position: absolute; right: var(--space-3); pointer-events: none; color: var(--text-2); }
.field { display: flex; align-items: center; gap: var(--space-2); flex: 1; min-width: 0; height: 100%; padding-left: var(--space-3); border-left: var(--rule-hair) solid var(--line-3); color: var(--text-2); }
.field input { flex: 1; min-width: 0; height: 100%; border: 0; border-radius: var(--radius); background: transparent; padding: 0; font-family: var(--font-sans); font-size: var(--fs-meta); color: var(--text-1); }
.field input::placeholder { color: var(--text-3); }
.field input::-webkit-search-cancel-button { -webkit-appearance: none; }
.field input:focus-visible { outline: none; }
.search:focus-within { border-bottom-width: var(--rule-mid); }

/* 검색 결과: 메뉴 줄 바로 아래, 위아래 괘선 사이 한 단 */
.results { border-bottom: var(--rule-hair) solid var(--line-2); padding: var(--space-5) 0; }
.results[hidden] { display: none; }
.res-head { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--fs-meta); color: var(--text-2); margin-bottom: var(--space-4); }
.res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-5) var(--grid-gutter); }
.res-item { display: grid; grid-template-columns: var(--cover-result) 1fr; gap: var(--space-4); align-items: start; }
.res-item .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--text-2); line-height: var(--lh-ui); }
.res-item .ttl { font-weight: var(--fw-body); }   /* 일치한 낱말(--fw-emph)이 굵게 드러나도록 결과 헤드라인은 보통 굵기 */
.res-item mark, .res-none mark { background: var(--bg-2); color: inherit; font-weight: var(--fw-emph); }
.res-none p { margin: 0 0 var(--space-1); }
.res-none .q { font-family: var(--font-serif); font-size: var(--fs-title); font-weight: var(--fw-title); color: var(--text-1); }
.btn-clear { margin-top: var(--space-3); border: 0; background: none; padding: 0; font-family: var(--font-sans); font-size: var(--fs-meta); font-weight: var(--fw-ui); color: var(--text-1); cursor: pointer; text-decoration: underline; text-decoration-thickness: var(--underline-w); text-underline-offset: var(--underline-offset); }

/* ---------- 표지 감싸개(표지 안쪽은 건드리지 않는다) ---------- */
.cv { display: block; position: relative; border-radius: var(--radius); box-shadow: var(--shadow-cover); transition: box-shadow var(--dur-fast) var(--ease-out); }
.cv:hover { box-shadow: var(--shadow-cover-hover); }
.cv:focus-visible { outline: none; }
.cv:focus-visible::after { content: ""; position: absolute; left: 0; right: 0; bottom: calc(-1 * var(--space-2)); height: var(--rule-mid); background: var(--line-1); }
.cv-lead { width: var(--cover-lead); box-shadow: var(--shadow-cover-lead); }
.cv-shelf { width: var(--cover-shelf); }
.cv-index { width: var(--cover-index); }
.cv-result { width: var(--cover-result); }

/* ---------- 1면 ---------- */
.front { display: grid; grid-template-columns: var(--cover-lead) 1fr; column-gap: var(--hero-gap); padding-top: var(--hero-pad-top); }
.lead { margin: 0; }
.lead figcaption { margin-top: var(--space-3); font-size: var(--fs-caption); line-height: var(--lh-ui); color: var(--text-2); }
.lead figcaption .no { font-family: var(--font-mono); font-weight: var(--fw-meta); color: var(--text-1); }
.lead:focus-within figcaption .no { text-decoration: underline; text-underline-offset: var(--underline-offset); }
.story { display: flex; flex-direction: column; min-height: calc(var(--cover-lead) / (var(--cover-ratio))); }
.kicker { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: var(--space-2); border-bottom: var(--rule-hair) solid var(--line-2); font-size: var(--fs-meta); line-height: var(--lh-ui); }
.kicker b { letter-spacing: var(--ls-label); }
.kicker .mono { color: var(--text-2); }
.headline { margin: var(--space-4) 0 0; font-family: var(--font-serif); font-weight: var(--fw-headline); font-size: var(--fs-headline); line-height: var(--lh-headline); letter-spacing: var(--ls-headline); text-wrap: balance; }
.headline a:hover { text-decoration: underline; text-decoration-thickness: var(--rule-mid); text-underline-offset: var(--underline-offset); }
.dek { margin: var(--space-3) 0 0; max-width: var(--measure); font-family: var(--font-serif); font-size: var(--fs-dek); line-height: var(--lh-title); color: var(--text-2); }
.cta {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
  height: var(--cta-h); margin-top: var(--space-5); padding: 0 var(--cta-pad-x);
  background: var(--fill-1); color: var(--text-on-fill); border-radius: var(--radius);
  transition: background-color var(--dur-fast) var(--ease-out);
}
.cta:hover { background: var(--fill-1-hover); }
.cta:focus-visible { outline-offset: var(--focus-offset); }
.cta .t { display: flex; align-items: center; gap: var(--space-3); font-size: var(--fs-cta); font-weight: var(--fw-ui); line-height: var(--lh-ui); }
.cta .s { display: flex; align-items: center; gap: var(--space-2); font-size: var(--fs-meta); font-weight: var(--fw-body); line-height: var(--lh-ui); }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: var(--space-6); }
.stat { padding: 0 var(--space-5); border-left: var(--rule-hair) solid var(--line-2); min-width: 0; }
.stat:first-child { padding-left: 0; border-left: 0; }
.lbl { font-family: var(--font-mono); font-size: var(--fs-label); font-weight: var(--fw-meta); letter-spacing: var(--ls-label); line-height: var(--lh-ui); color: var(--text-2); white-space: nowrap; }
.big { display: block; margin-top: var(--space-2); font-family: var(--font-num); font-weight: var(--fw-num); font-size: var(--fs-stat); line-height: var(--lh-num); white-space: nowrap; }
.big .u { font-size: var(--fs-stat-side); }
.ph-big { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-2); height: var(--fs-stat); }
.ph-big .big { margin-top: 0; }
.ph-big .sw { width: var(--space-6); }
.ph-big .nm { font-size: var(--fs-stat-side); font-weight: var(--fw-emph); line-height: var(--lh-ui); }
.sub { margin-top: var(--space-2); font-family: var(--font-mono); font-size: var(--fs-meta); line-height: var(--lh-ui); color: var(--text-2); white-space: nowrap; }
.sub .tag { margin-right: var(--space-1); }

.shelf { margin-top: auto; padding-top: var(--space-4); border-top: var(--rule-hair) solid var(--line-2); }
.shelf-head { font-size: var(--fs-meta); line-height: var(--lh-ui); color: var(--text-2); }
.shelf-head b { color: var(--text-1); letter-spacing: var(--ls-label); margin-right: var(--space-2); }
.shelf-row { display: grid; grid-template-columns: 1fr 1fr var(--cover-shelf); gap: var(--grid-gutter); margin-top: var(--space-3); }
.sh-item { display: grid; grid-template-columns: var(--cover-shelf) 1fr; column-gap: var(--space-4); align-items: start; }
.sh-meta { font-family: var(--font-mono); font-size: var(--fs-meta); line-height: var(--lh-ui); color: var(--text-2); }
.ttl { display: block; margin: var(--space-1) 0 0; font-family: var(--font-serif); font-weight: var(--fw-title); font-size: var(--fs-title); line-height: var(--lh-title); }
.ttl.note { font-weight: var(--fw-body); color: var(--text-2); }
.sh-item:focus-within .ttl { text-decoration: underline; text-underline-offset: var(--underline-offset); }
.next { width: var(--cover-shelf); aspect-ratio: var(--cover-ratio); border: var(--line-placeholder); border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1); padding: var(--space-2); text-align: center; font-size: var(--fs-label); line-height: var(--lh-ui); color: var(--text-2); }
.next .k { font-size: var(--fs-meta); font-weight: var(--fw-ui); color: var(--text-1); }
.next .mono { font-size: var(--fs-label); }
.next .t3 { margin-top: var(--space-1); }

/* ---------- 구역 머리 ---------- */
.sec { margin-top: var(--section-gap); }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-5); border-top: var(--rule-heavy) solid var(--line-1); padding-top: var(--space-3); margin-bottom: var(--section-head-gap); }
.sec-title { margin: 0; font-family: var(--font-serif); font-weight: var(--fw-section); font-size: var(--fs-section); line-height: var(--lh-title); }
.sec-memo { margin: 0; font-family: var(--font-mono); font-size: var(--fs-meta); line-height: var(--lh-ui); color: var(--text-2); text-align: right; }
.sec-memo a { color: var(--text-1); }

function niceDomain(vs, ref, want){
  var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  if(ref != null){ lo = Math.min(lo, ref); hi = Math.max(hi, ref); }
  var span = (hi - lo) || 1, raw = span / want, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  var step = [1, 2, 2.5, 5, 10].map(function(k){ return k * mag; }).filter(function(k){ return k >= raw - 1e-12; })[0];
  var pad = span * 0.12, dlo = lo - pad, dhi = hi + pad, ticks = [];
  for(var t = Math.ceil(dlo / step) * step; t <= dhi + 1e-9; t += step) ticks.push(Math.round(t / step) * step);
  var dec = step >= 1 ? 0 : step >= 0.1 ? 1 : 2;
  return {lo:dlo, hi:dhi, ticks:ticks, dec:dec};
}
function chartHTML(key, o){

function indexHTML(){
  var slots = [];   /* 최신 호부터: 날짜 내림차순, 같은 날도 늦은 회차부터 */
  var gi = GAPS.length - 1;
  for(var i = DAYS.length - 1; i >= 0; i--){
    var d = DAYS[i], list = DM[d];
    if(!list){ var g = GAPS.filter(function(x){ return x.i1 === i; })[0]; if(g){ slots.push({gap:g}); i = g.i0; } continue; }
    list.slice().reverse().forEach(function(b){ slots.push({b:b, n:list.length}); });
  }
  var html = '', brackets = '';
  slots.forEach(function(s, k){
    var r = Math.floor(k / COLS) + 1, c = k % COLS + 1, pos = 'grid-row:' + r + ';grid-column:' + c;
    if(s.gap){
      html += '<div class="ix-gap" style="' + pos + '" aria-label="' + esc(gapText(s.gap)) + ' 발행 없음"><span class="d">' + esc(gapText(s.gap)) + '</span><span class="x">발행 없음</span></div>';
      return;
    }
    var b = s.b, grp = s.n > 1;
    var cap = grp ? '<span class="no">' + no(b) + '</span> · ' + b.seq + '회' : '<span class="no">' + no(b) + '</span> · <span class="d">' + esc(shortD(b.date)) + '</span>';
    html += '<figure class="ix' + (grp ? ' grp' : '') + '" style="' + pos + '"><a class="cv cv-index" href="' + esc(b.url) + '" aria-label="' + no(b) + ' ' + esc(longD(b.date)) + (grp ? ' ' + b.seq + '회' : '') + ' 브리핑 열기">' + cover(b) + '</a><figcaption>' + cap + '</figcaption></figure>';
  });
  /* 같은 날 표지 묶음: 행이 바뀌면 행마다 괄호선 */
  var k = 0;
  while(k < slots.length){
    var s = slots[k];
    if(s.b && s.n > 1){
      var j = k; while(j + 1 < slots.length && slots[j+1].b && slots[j+1].b.date === s.b.date) j++;
      var a = k;
      while(a <= j){
        var row = Math.floor(a / COLS), e = Math.min(j, (row + 1) * COLS - 1);
        brackets += '<div class="ix-br" style="grid-row:' + (row + 1) + ';grid-column:' + (a % COLS + 1) + ' / span ' + (e - a + 1) + '">' + esc(shortD(s.b.date)) + '</div>';
        a = e + 1;
      }
      k = j + 1;
    } else k++;
  }
  var y = ymd(L.date);
  return '<section id="covers" class="sec" aria-labelledby="covers-t">'
    + '<header class="sec-head"><h2 class="sec-title" id="covers-t">표지 전체</h2><p class="sec-memo">' + B.length + '호 · 최신 호부터 · 같은 날 여러 호는 괄호선으로 묶음</p></header>'
    + '<div class="month"><div class="month-head"><h3 class="month-title">' + y.y + '년 ' + y.m + '월</h3><p class="sec-memo">' + no(B[0]) + ' ' + esc(shortD(B[0].date)) + ' – ' + no(L) + ' ' + esc(shortD(L.date)) + '</p></div>'
    + '<div class="ix-grid">' + html + brackets + '</div></div>'
  + '</section>';
}

      + '<ul class="doc-list"><li><span class="d">' + esc(shortD('2026-09-08')) + '</span><div><a class="ttl ul" href="' + docUrl + '">UNI·ARB 관통 해부</a><p>브리핑에서 파생된 종목 심층 분석</p></div></li></ul></div>'
    + '</section>'
    + '<section id="updates" class="sec" aria-labelledby="updates-t"><header class="sec-head"><h2 class="sec-title" id="updates-t">갱신 방식</h2><p class="sec-memo">등록된 기록으로 계산하는 페이지</p></header>'
      + '<p class="small">이 서고는 손으로 고치지 않는다. 브리핑을 발행한 실행이 서고의 데이터베이스에 한 건을 등록하고, 이 페이지는 그 기록으로 목록과 타임라인과 표를 계산한다.</p>'
      + '<dl class="upd">' + upd.map(function(u){ return '<div><dt>' + u[0] + '</dt><dd>' + u[1] + '</dd></div>'; }).join('') + '</dl>'

/* ===== 검색(범위 + 입력). 결과는 메뉴 줄 아래 한 단 ===== */
function hay(b, scope){
  var dt = [b.date, mdd(b.date), shortD(b.date), longD(b.date), no(b), String(vol(b))].join(' ');
  var ph = [phLetters(phOf(b)), phName(phOf(b))].join(' ');
  if(scope === 'headline') return b.headline || '';
  if(scope === 'note') return b.note || '';
  if(scope === 'date') return dt;
  if(scope === 'phase') return ph;
  return [b.headline, b.note, b.title, dt, ph].join(' ');
}
function markText(t, q){
  t = String(t || ''); if(!q) return esc(t);
  var low = t.toLowerCase(), ql = q.toLowerCase(), out = '', from = 0, i;
  while((i = low.indexOf(ql, from)) >= 0){ out += esc(t.slice(from, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>'; from = i + q.length; }
  return out + esc(t.slice(from));
}
function runSearch(){
  var q = document.getElementById('q').value.trim(), sel = document.getElementById('scope'), scope = sel.value, scopeName = sel.options[sel.selectedIndex].text;
  var box = document.getElementById('results');
  if(!q){ box.hidden = true; box.innerHTML = ''; return; }
  var hits = B.slice().reverse().filter(function(b){ return hay(b, scope).toLowerCase().indexOf(q.toLowerCase()) >= 0; });
  if(!hits.length){
    box.innerHTML = '<div class="res-none"><p class="q">‘' + esc(q) + '’에 맞는 호가 없습니다.</p><p class="t2">현재 범위: ' + esc(scopeName) + '</p><p class="t2">범위를 ‘전체’로 넓히거나 다른 낱말로 찾아 보세요.</p><button type="button" class="btn-clear" id="q-clear">검색 지우기</button></div>';
  } else {
    box.innerHTML = '<div class="res-head"><span>‘' + esc(q) + '’ · 범위 ' + esc(scopeName) + ' · ' + hits.length + '호</span><button type="button" class="btn-clear" id="q-clear" style="margin:0">검색 지우기</button></div><div class="res-grid">'
      + hits.map(function(b){
        return '<div class="res-item"><a class="cv cv-result" href="' + esc(b.url) + '" aria-label="' + no(b) + ' 브리핑 열기">' + cover(b) + '</a><div><div class="meta">' + markText(no(b) + ' · ' + shortD(b.date) + (DM[b.date].length > 1 ? ' · ' + b.seq + '회' : ''), scope === 'date' || scope === 'all' ? q : '') + '</div>'
          + '<a class="ttl hov' + (b.headline ? '' : ' note') + '" href="' + esc(b.url) + '">' + markText(b.headline || b.note || b.title, q) + '</a></div></div>';
      }).join('') + '</div>';
    BK.fit(box, true);
  }
  box.hidden = false;
  var c = document.getElementById('q-clear'); if(c) c.onclick = function(){ document.getElementById('q').value = ''; runSearch(); document.getElementById('q').focus(); };
}

/* ===== 종이 결 ===== */
function paperGrain(){
  try{
    var c = document.createElement('canvas'); c.width = c.height = 160;
    var x = c.getContext('2d'), im = x.createImageData(160, 160), p = im.data;
    for(var i = 0; i < p.length; i += 4){ var v = (Math.random() * 256) | 0; p[i] = p[i+1] = p[i+2] = v; p[i+3] = 255; }
    x.putImageData(im, 0, 0);
    document.documentElement.style.setProperty('--paper-grain', 'url(' + c.toDataURL('image/png') + ')');
  }catch(e){}
}

paperGrain();
document.getElementById('app').innerHTML = mastHTML() + '<main>' + heroHTML() + boardHTML() + indexHTML() + listHTML() + annexHTML() + '</main>' + colophonHTML();
document.getElementById('q').addEventListener('input', runSearch);
document.getElementById('scope').addEventListener('change', runSearch);
ready();
})();
