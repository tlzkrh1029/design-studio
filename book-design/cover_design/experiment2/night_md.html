/* ---------- 상단 막대 ---------- */
.top { position: sticky; top: 0; z-index: 30; height: var(--topbar-h); background: var(--bg-raise); border-bottom: var(--stroke-hair) solid var(--line-1); }
.top-in { height: 100%; display: flex; align-items: center; gap: var(--space-7); }
.logo { display: flex; align-items: center; gap: var(--space-2); font-size: var(--fs-lead); font-weight: var(--fw-heavy); line-height: var(--lh-tight); white-space: nowrap; }

.search { margin-left: auto; width: var(--search-w); height: var(--input-h); display: flex; align-items: stretch; background: var(--bg-raise); border: var(--stroke-hair) solid var(--line-3); border-radius: var(--radius-md); font-size: var(--fs-small); }
.scope { position: relative; display: flex; align-items: center; border-right: var(--stroke-hair) solid var(--line-2); }

.q input { width: 100%; height: 100%; background: transparent; border: 0; color: var(--text-1); font: inherit; padding: 0 var(--space-3) 0 calc(var(--space-3) + var(--icon) + var(--space-2)); border-radius: 0 var(--radius-md) var(--radius-md) 0; }

.hero-in { display: flex; gap: var(--hero-gap); }
.stage { position: relative; flex: 0 0 var(--hero-cover-col); height: var(--stage-h); display: flex; flex-direction: column; align-items: center; }

.cone {
  position: absolute; left: 50%; top: calc(-1 * (var(--hero-pad-y) + var(--spot-rise)));
  width: calc(2 * tan(var(--spot-half)) * (var(--spot-drop) + var(--hero-pad-y))); height: calc(var(--spot-drop) + var(--hero-pad-y)); transform: translateX(-50%);
  background: conic-gradient(from calc(180deg - var(--spot-half)) at 50% 0,
    transparent 0deg, var(--spot-core) calc(var(--spot-half) * var(--spot-edge)), var(--spot-core) calc(var(--spot-half) * (2 - var(--spot-edge))),
    transparent calc(var(--spot-half) * 2), transparent 360deg);
  /* 상단 막대 밑에서 서서히 나타나 표지 꼭대기에서 다 밝아지고, 바닥을 지나 히어로 끝에서 사라진다 */
  -webkit-mask-image: linear-gradient(to bottom, transparent var(--spot-rise), #000 calc(var(--spot-rise) + var(--hero-pad-y)), #000 var(--spot-drop), transparent 100%);
          mask-image: linear-gradient(to bottom, transparent var(--spot-rise), #000 calc(var(--spot-rise) + var(--hero-pad-y)), #000 var(--spot-drop), transparent 100%);
}
/* 표지 뒤로 번지는 강조색 기미 */
.tint { position: absolute; left: 50%; top: calc(var(--cover-hero-h) / 2); width: var(--spot-width); height: calc(var(--cover-hero-h) + 2 * var(--space-9)); transform: translate(-50%, -50%); background: radial-gradient(closest-side, var(--spot-tint) calc((1 - var(--spot-edge)) * 100%), transparent); }
/* 받침대 아래 빛 웅덩이 */
.pool { position: absolute; left: 50%; top: var(--stage-h); width: var(--spot-width); height: calc(2 * var(--hero-pad-y)); transform: translate(-50%, -50%); background: radial-gradient(closest-side, var(--spot-floor) calc((1 - var(--spot-edge)) * 100%), transparent); }
.hero-cv { position: relative; z-index: 2; display: block; width: var(--cover-hero); box-shadow: var(--shadow-cover-hero); transition: transform var(--dur-fast) var(--ease); }

.plinth::after { content: ""; display: block; height: var(--plinth-face-h); background: var(--shelf-face); box-shadow: var(--shadow-shelf); }

.sw { width: var(--phase-swatch); height: var(--phase-swatch); border-radius: var(--radius-sm); display: flex; overflow: hidden; flex: none; font-family: var(--font-num); font-weight: var(--fw-semibold); font-size: var(--fs-lead); line-height: var(--lh-tight); }
.sw i, .chip i, .cell i { flex: 1 1 0; display: flex; align-items: center; justify-content: center; font-style: normal; }

.fig { position: relative; min-width: 0; }

.fig-k { font-family: var(--font-mono); font-size: var(--fs-micro); font-weight: var(--fw-medium); letter-spacing: var(--ls-label); color: var(--text-3); line-height: var(--lh-label); white-space: nowrap; }
.fig-v { margin-top: var(--space-2); font-family: var(--font-num); font-weight: var(--fw-medium); font-size: var(--fs-figure); line-height: var(--lh-tight); color: var(--text-1); white-space: nowrap; }

.btn { display: inline-flex; align-items: center; gap: var(--space-2); height: var(--btn-h); padding: 0 var(--btn-pad-x); border-radius: var(--radius-md); font-size: var(--fs-body); font-weight: var(--fw-semibold); line-height: var(--lh-tight); white-space: nowrap; transition: background-color var(--dur-fast) var(--ease); }
.btn-pri { background: var(--accent); color: var(--accent-ink); }

.btn-pri:hover .ic { transform: translateX(var(--space-1)); }
.btn-sec { border: var(--stroke-hair) solid var(--line-3); color: var(--text-1); }
.btn-sec:hover { background: var(--bg-raise); }

/* ---------- 구역 공통 ---------- */
.sec { margin-top: var(--section-gap); scroll-margin-top: var(--topbar-h); }

.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-5); padding-bottom: var(--space-4); border-bottom: var(--stroke-hair) solid var(--line-1); margin-bottom: var(--section-head-gap); }

  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 var(--space-8)); mask-image: linear-gradient(to bottom, transparent, #000 var(--space-8)); }
.shelf-name { position: relative; margin-bottom: var(--space-3); font-size: var(--fs-caption); color: var(--text-2); line-height: var(--lh-label); white-space: nowrap; }

.shelf-unit { position: relative; }
.board { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--shelf-top-h) + var(--shelf-face-h)); background: linear-gradient(to bottom, var(--shelf-top) 0, var(--shelf-top) var(--shelf-top-h), var(--shelf-face) var(--shelf-top-h)); box-shadow: var(--shadow-shelf); }
.items { position: relative; display: flex; align-items: flex-end; gap: var(--gap-day); }
.day { display: flex; flex-direction: column; }
.covers { display: flex; gap: var(--gap-round); }
.cv { display: block; width: var(--cover-shelf); box-shadow: var(--shadow-cover); transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
.cv:hover { transform: translateY(var(--lift)); box-shadow: var(--shadow-cover-hover); }
.tags { display: flex; gap: var(--gap-round); height: var(--shelf-face-h); margin-top: var(--shelf-top-h); }

.tc + .tc { justify-content: flex-end; }
.is-empty .tc { width: var(--slot-empty); }
.dl { font-size: var(--fs-caption); color: var(--text-2); line-height: var(--lh-label); white-space: nowrap; }
.dl em { font-style: normal; font-weight: var(--fw-semibold); color: var(--accent); margin-left: var(--space-1); }
.dl.dim { color: var(--text-3); }
.mk { display: inline-flex; align-items: center; gap: var(--space-1); flex: none; }

function tok(n){return getComputedStyle(RT).getPropertyValue(n).trim();}
function tpx(n){return parseFloat(tok(n));}

/* 다른 날에는 최신 호 테두리색을 강조색으로 쓰고, 바탕 대비 4.5:1 미만이면 --text-1 쪽으로 섞어 밝힌다 */
(function(){
  if(L.date===ACCENT_DAY) return;
  var a=pal(L).fr, bg=tok('--bg'), t1=tok('--text-1');
  function mix(x,y,t){var p=parseInt(x.slice(1),16),q=parseInt(y.slice(1),16);function c(s){return Math.round(((p>>s)&255)*(1-t)+((q>>s)&255)*t);}return '#'+((1<<24)+(c(16)<<16)+(c(8)<<8)+c(0)).toString(16).slice(1);}
  for(var i=0;i<20&&BK.contrast(a,bg)<4.5;i++) a=mix(a,t1,.1);
  var n=parseInt(a.slice(1),16), rgb=((n>>16)&255)+', '+((n>>8)&255)+', '+(n&255);
  RT.style.setProperty('--accent',a); RT.style.setProperty('--accent-line','rgba('+rgb+', 0.55)'); RT.style.setProperty('--spot-tint','rgba('+rgb+', 0.10)');
})();

/* ===== 날짜·숫자 도우미 ===== */
function p2(n){return (n<10?'0':'')+n;}
function isoOf(t){var x=new Date(t*864e5); return x.getUTCFullYear()+'-'+p2(x.getUTCMonth()+1)+'-'+p2(x.getUTCDate());}
function addD(d,n){return isoOf(dn(d)+n);}
function dowOf(d){return new Date(dn(d)*864e5).getUTCDay();}
function monOf(d){return addD(d,-((dowOf(d)+6)%7));}
function decs(v){var s=String(v), i=s.indexOf('.'); return i<0?0:s.length-i-1;}
function nRaw(v){return v==null?null:(v<0?'−':'')+String(Math.abs(v));}            /* 데이터 자릿수 그대로 */
function nSgn(v){return v==null?null:(v===0?'0':(v>0?'+':'−')+String(Math.abs(v)));}
function dDiff(a,b){var d=Math.max(decs(a),decs(b)), x=a-b, s=Math.abs(x).toFixed(d); return Number(s)===0?null:(x>0?'+':'−')+s;}
function sigma(s){return esc(s).replace(/Σ/g,'<span class="ko">Σ</span>');}
function wdSpan(d){return '<span class="ko">'+wd(d)+'</span>';}

/* ===== 국면 표식: 정사각 칩·띠 칸·히어로 견본이 같은 구조를 쓴다 ===== */
function phMark(p, cls, extra){
  var ps=parts(p), t=esc(phaseText(p));
  if(!ps.length) return '<span class="'+cls+' is-q'+(extra||'')+'" title="'+t+'">?</span>';
  return '<span class="'+cls+(extra||'')+'" title="'+t+'">'+ps.map(function(k){var l=k.toLowerCase(); return '<i style="background:var(--phase-'+l+');color:var(--on-phase-'+l+')">'+k+'</i>';}).join('')+'</span>';
}

/* ===== 작은 추세선(히어로): 날짜 열 기준, 빈 날은 끊고, 기준선과 오늘 점 ===== */
function sparkSVG(key, ref, w){
  var h=tpx('--spark-h'), pad=tpx('--space-1'), n=DAYS.length, map={};
  daily(key).forEach(function(o){map[o.d]=o.v;});
  var vs=[]; DAYS.forEach(function(d){ if(map[d]!=null) vs.push(map[d]); }); if(ref!=null) vs.push(ref);
  var lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs), rg=(hi-lo)||1;
  function X(i){return pad+(w-2*pad)*i/(n-1);} function Y(v){return pad+(h-2*pad)*(hi-v)/rg;}
  var s='<svg class="spk" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">';
  if(ref!=null){var ry=Math.round(Y(ref))+.5; s+='<line class="ref" x1="0" x2="'+w+'" y1="'+ry+'" y2="'+ry+'"/>';}
  s+=segs(DAYS, map, X, Y);
  var ti=DAYS.indexOf(L.date); if(ti>=0&&map[L.date]!=null) s+='<circle class="dot" cx="'+X(ti).toFixed(1)+'" cy="'+Y(map[L.date]).toFixed(1)+'" r="'+(tpx('--chart-dot')/2)+'"/>';
  return s+'</svg>';
}
function segs(days, map, X, Y){
  var out='', cur=[];
  function flush(){ if(cur.length>1) out+='<path class="ln" d="'+cur.map(function(q,i){return (i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1);}).join('')+'"/>'; else if(cur.length===1) out+='<circle class="pt" cx="'+cur[0][0].toFixed(1)+'" cy="'+cur[0][1].toFixed(1)+'" r="'+tpx('--stroke-mark')+'"/>'; cur=[]; }
  days.forEach(function(d,i){ if(map[d]==null){flush(); return;} cur.push([X(i),Y(map[d])]); });
  flush(); return out;
}

  +'</div></header>';

/* ===== 오늘의 호 ===== */
function balancedHeadline(h){
  var best=-1, diff=1e9, re=/, /g, m;
  while((m=re.exec(h))){ var a=m.index+1, d=Math.abs(a-(h.length-a-1)); if(d<diff){diff=d; best=a;} }
  if(best<0) return esc(h);
  return esc(h.slice(0,best))+'<br>'+esc(h.slice(best+1));
}
function heroHTML(){
  var ps=parts(L.phase), pv=prevOf(L);
  var dB=(pv&&L.btcd!=null)?dDiff(L.btcd,pv.btcd):null;
  var sub1=pv&&L.btcd!=null?(dB?'전날 '+dB+'%p':'전날과 같음'):'전날 기록 없음';
  var figW=Math.floor((tpx('--hero-text-max')-2*tpx('--space-7'))/3);
  function fig(k,v,unit,sub,key,ref){
    return '<div class="fig"><p class="fig-k">'+k+'</p>'
      +'<p class="fig-v">'+(v==null?'<span class="none">—</span>':v+'<small>'+unit+'</small>')+'</p>'
      +'<p class="fig-s">'+sub+'</p>'+sparkSVG(key,ref,figW)+'</div>';
  }
  var name=ps.length?ps.map(function(k){return PHN[k];}).join(' → '):'국면 미기록';
  var prev=L.prevPhase?'<span class="ph-prev">전날 <span class="m">'+esc(parts(L.prevPhase).join('→'))+'</span></span>':'';
  return '<section class="hero" id="today" aria-label="오늘의 호"><div class="wrap hero-in">'
    +'<div class="stage">'
      +'<div class="light" aria-hidden="true"><div class="cone"></div><div class="tint"></div><div class="pool"></div></div>'
      +'<a class="hero-cv" href="'+esc(L.url)+'" target="_blank" rel="noopener" aria-label="제'+vol(L)+'호 브리핑 펼치기"><div style="width:var(--cover-hero)">'+cover(L)+'</div></a>'
      +'<div class="plinth" aria-hidden="true"></div>'
    +'</div>'
    +'<div class="hero-text">'
      +'<p class="eyebrow">'+(isToday?'오늘의 호':'최신 호')+' · 제'+vol(L)+'호</p>'
      +'<p class="dateline"><span class="hdate">'+L.date.replace(/-/g,'.')+'</span><span class="hrun">'+wd(L.date)+'요일 · '+esc(runLabel(L))+'</span></p>'
      +(L.headline?'<h1 class="hl">'+balancedHeadline(L.headline)+'</h1>':'<h1 class="hl is-note">'+esc(L.note||L.title)+'</h1>')
      +'<div class="phase-row">'+phMark(L.phase,'sw')+'<span class="ph-name">'+esc(name)+'</span>'
        +(L.provisional?'<span class="tag">임시 기준</span>':'')+prev+'</div>'
      +'<div class="figs">'
        +fig('BTC.D',nRaw(L.btcd),'%',esc(sub1),'btcd',pv?pv.btcd:null)
        +fig(sigma('ΣSTABLECOIN.D')+' <span class="ko">1개월</span>',nSgn(L.stable1m),'%p','현재 '+(L.stableD==null?'—':nRaw(L.stableD)+'%')+' · E 기준 +1.0%p','stable1m',1.0)
        +fig('BTCUSD <span class="ko">1개월</span>',nSgn(L.btc1m),'%','D·E 전제: 0 아래','btc1m',0)
      +'</div>'
      +'<div class="btns"><a class="btn btn-pri" href="'+esc(L.url)+'" target="_blank" rel="noopener">브리핑 펼치기'+IC.right+'</a>'
        +'<a class="btn btn-sec" href="#stand">지난 호 넘겨 보기</a></div>'
    +'</div>'
  +'</div></section>';
}

/* ===== 가판대: 한 주에 선반 하나, 맨 위가 이번 주 ===== */
function cvHTML(b){
  var t='제'+vol(b)+'호 · '+b.date.replace(/-/g,'.')+' '+wd(b.date)+(b.seq>1?' · '+b.seq+'회차':'')+' 브리핑 열기';
  return '<a class="cv" href="'+esc(b.url)+'" target="_blank" rel="noopener" title="'+esc(t)+'" aria-label="'+esc(t)+'"><div style="width:var(--cover-shelf)">'+cover(b)+'</div></a>';
}
function dayHTML(d){
  var list=DM[d];
  if(!list) return '<div class="day is-empty"><div class="slot-empty">발행 없음</div><div class="tags"><div class="tc"><span class="dl dim"><span class="m">'+mdot(d)+'</span> '+wdSpan(d)+'</span></div></div></div>';
  var multi=list.length>1, today=(d===TODAY);
  var label='<span class="dl"><span class="m">'+mdot(d)+'</span> '+wdSpan(d)+(multi?' · '+list.length+'회':'')+(today?'<em>오늘</em>':'')+'</span>';
  return '<div class="day"><div class="covers">'+list.map(cvHTML).join('')+'</div>'
    +'<div class="tags">'+list.map(function(b,i){
      return '<div class="tc">'+(i===0?label:'')+'<span class="mk">'+(multi?'<span class="rn">'+b.seq+'</span>':'')+phMark(b.phase,'chip')+'</span></div>';
    }).join('')+'</div></div>';
}
function nextHTML(d){
  return '<div class="day is-next"><div class="slot-next"><b>다음 호</b><span class="nd"><span class="m">'+mdot(d)+'</span> '+wd(d)+'</span><span class="nt"><span class="m">06:10</span> 발행 예정</span></div><div class="tags"></div></div>';
}
function standHTML(){
  var weeks=weekList(), shelves=weeks.map(function(m,wi){
    var start=m<FIRST?FIRST:m, end=addD(m,6), last=end<TODAY?end:TODAY, items='', n=0;
    for(var d=start; d<=last; d=addD(d,1)){ items+=dayHTML(d); if(DM[d]) n+=DM[d].length; }
    if(wi===0) items+=nextHTML(addD(TODAY,1));
    var pre=wi===0?'<b>이번 주</b> · ':(wi===weeks.length-1?'<b>첫 주</b> · ':'');
    return '<div class="shelf"><p class="shelf-name">'+pre+'<span class="m">'+mdot(start)+'–'+mdot(end)+'</span> · '+n+'호</p>'
      +'<div class="shelf-unit"><div class="board" aria-hidden="true"></div><div class="items">'+items+'</div></div></div>';
  }).join('');
  var days=Object.keys(DM).length;
  return '<section class="sec wrap" id="stand"><div class="sec-head"><h2>가판대</h2><p>'+monthSpan()+' · '+B.length+'호 · 발행 '+days+'일</p></div>'
    +'<div class="shelves">'+shelves+'</div></section>';
}

/* ===== 국면과 지표: 국면 띠와 차트 셋이 같은 날짜 열을 쓴다 ===== */
function flowHTML(){
  var CW=tpx('--day-col');
  var cols='', wks='';
  DAYS.forEach(function(d,i){
    var list=DM[d], b=list?list[list.length-1]:null, mon=dowOf(d)===1, td=(d===TODAY);
    var cell=!b?'<span class="cell is-none" title="'+mdot(d)+' 브리핑 없음"></span>':phMark(b.phase,'cell',td?' is-today':'');
    cols+='<div class="col">'+cell+'<span class="dn'+(td?' is-today':mon?' is-mon':'')+'">'+(+d.slice(8))+'</span>'
      +'<span class="rc">'+(list&&list.length>1?list.length+'회':'')+'</span></div>';
    if(i>0&&mon) wks+='<i class="wk" style="left:'+(i*CW)+'px"></i>';
  });
  var legend='<ul class="legend">'+['A','B','C','D','E'].map(function(k){return '<li>'+phMark(k,'chip')+esc(PHN[k])+'</li>';}).join('')
    +'<li>'+phMark('C→D','chip')+'걸친 판정</li><li>'+phMark(null,'chip')+'국면 미기록</li><li><span class="chip is-none"></span>브리핑 없음</li></ul>';
  var st=stats();
  return '<section class="sec wrap" id="flow"><div class="sec-head"><h2>국면과 지표</h2><p>'+mdS(FIRST)+'–'+mdS(TODAY)+' · 지표 기록 '+st.days+'일</p></div>'
    +'<div class="flow">'
      +'<div class="fl-row"><div class="fl-label"><p class="fl-name">국면</p><p class="fl-desc">하루 한 칸<br>마지막 회차 기준</p></div>'
        +'<div class="fl-track">'+wks+cols+'</div></div>'
      +legend
      +'<div class="charts">'
        +chartHTML({key:'btcd', name:'BTC.D', desc:'점유율 %', lo:58.9, hi:60.5, ticks:[59,59.5,60], tf:function(v){return v.toFixed(1);}})
        +chartHTML({key:'stable1m', name:'ΣSTABLECOIN.D', desc:'1개월 변화 %p', lo:-2.5, hi:2.0, ticks:[-2,-1,0], zero:true, ref:{v:1.0, side:'above', label:'E 기준 +1.0%p', tick:'+1.0'}, tf:function(v){return v===0?'0':nSgn(v)+'.0';}})
        +chartHTML({key:'btc1m', name:'BTCUSD', desc:'1개월 변화 %', lo:-8, hi:28, ticks:[10,20], ref:{v:0, side:'below', label:'D·E 전제: 0 아래', tick:'0'}, tf:function(v){return nSgn(v);}})
      +'</div>'
    +'</div></section>';
}
function mdS(d){return (+d.slice(5,7))+'.'+d.slice(8);}
function monthSpan(){var a=FIRST, b=L.date; return a.slice(0,4)+'년 '+(+a.slice(5,7))+'월'+(a.slice(0,7)===b.slice(0,7)?'':'–'+(a.slice(0,4)===b.slice(0,4)?'':b.slice(0,4)+'년 ')+(+b.slice(5,7))+'월');}
function chartHTML(c){
  var W=tpx('--content-width'), H=tpx('--chart-h'), LW=tpx('--flow-label-w'), CW=tpx('--day-col'), G=tpx('--space-2');
  var map={}; daily(c.key).forEach(function(o){map[o.d]=o.v;});
  function X(i){return LW+CW*i+CW/2;} function Y(v){return (c.hi-v)/(c.hi-c.lo)*H;} function snap(y){return Math.round(y)+.5;}
  var s='<svg class="chart" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(c.name+' '+c.desc+' 날짜별 추이')+'">';
  if(c.ref){ var ry=snap(Y(c.ref.v)); s+=c.ref.side==='above'?'<rect class="zone" x="'+LW+'" y="0" width="'+(W-LW)+'" height="'+ry+'"/>':'<rect class="zone" x="'+LW+'" y="'+ry+'" width="'+(W-LW)+'" height="'+(H-ry)+'"/>'; }
  c.ticks.forEach(function(v){ var y=snap(Y(v)); s+='<line class="grid" x1="'+LW+'" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text class="t-end" x="'+(LW-G)+'" y="'+y+'">'+c.tf(v)+'</text>'; });
  DAYS.forEach(function(d,i){ if(i>0&&dowOf(d)===1){ var x=LW+CW*i+.5; s+='<line class="wkl" x1="'+x+'" x2="'+x+'" y1="0" y2="'+H+'"/>'; } });
  if(c.ref){ var y2=snap(Y(c.ref.v));
    s+='<line class="ref" x1="'+LW+'" x2="'+W+'" y1="'+y2+'" y2="'+y2+'"/><text class="t-end" x="'+(LW-G)+'" y="'+y2+'">'+c.ref.tick+'</text>'
      +'<text class="t-ref" x="'+(LW+G)+'" y="'+(c.ref.side==='above'?y2-G:y2+G+tpx('--fs-caption'))+'">'+esc(c.ref.label)+'</text>'; }
  s+=segs(DAYS, map, X, Y);
  var ti=DAYS.indexOf(L.date);
  if(ti>=0&&map[L.date]!=null){ var cx=X(ti), cy=Y(map[L.date]);
    s+='<circle class="dot" cx="'+cx+'" cy="'+cy.toFixed(1)+'" r="'+(tpx('--chart-dot')/2)+'"/>'
      +'<text class="t-val" x="'+(cx+tpx('--chart-dot')/2)+'" y="'+(cy-G-tpx('--space-1')).toFixed(1)+'">'+(c.key==='btcd'?nRaw(map[L.date]):nSgn(map[L.date]))+'</text>'; }
  s+='</svg>';
  return '<div class="ch"><div class="fl-label"><p class="fl-name m">'+sigma(c.name)+'</p><p class="fl-desc">'+esc(c.desc)+'</p></div>'+s+'</div>';
}

/* ===== 발행 목록: 목록과 지표 표를 합친다 ===== */

  if(r==='실행 기록 없음') return '<span class="none">—</span>';

function rowsHTML(list){
  var seen={};
  return list.map(function(b){
    var first=!seen[b.date]; seen[b.date]=1; var multi=DM[b.date].length>1;
    var dcell=first?'<span class="m">'+mdot(b.date)+'</span><span class="sub">'+wd(b.date)+(multi?' · '+b.seq+'회차':'')+'</span>':'<span class="sub">'+b.seq+'회차</span>';

    return '<tr><td class="c-date">'+dcell+'</td><td>'+phMark(b.phase,'chip')+'</td><td class="c-hl">'+hl+'</td>'
      +'<td class="c-num r">'+nc(b.btcd)+'</td><td class="c-num r">'+nc(b.stable1m,1)+'</td><td class="c-num r">'+nc(b.btc1m,1)+'</td><td>'+runCell(b)+'</td></tr>';
  }).join('');

/* ===== 검색과 목록 상태 ===== */
var state={q:'', scope:'all', all:false};
function matches(b,q,scope){
  if(scope!=='all' && monOf(b.date)!==scope) return false;
  if(!q) return true;
  var m=q.match(/^(\d{1,2})\s*[.\/\-월]\s*(\d{1,2})\s*일?$/);
  if(m) return +b.date.slice(5,7)===+m[1] && +b.date.slice(8)===+m[2];
  m=q.match(/^(\d{1,2})\s*일$/); if(m) return +b.date.slice(8)===+m[1];
  var hay=[b.headline,b.note,b.title,runLabel(b),phaseText(b.phase),b.date,mdot(b.date)].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every(function(w){return hay.indexOf(w)>=0;});
}
function renderList(){
  var body=document.getElementById('list-body'), sum=document.getElementById('list-sum');
  var q=state.q.trim(), newest=B.slice().reverse(), searching=q||state.scope!=='all';
  var hits=newest.filter(function(b){return matches(b,q,state.scope);});
  if(searching){
    var sc=document.getElementById('scope'), scl=state.scope==='all'?'':sc.options[sc.selectedIndex].text+' 범위 · ';
    sum.textContent=scl+(q?'‘'+q+'’ ':'')+'검색 결과 '+hits.length+'호';
    body.innerHTML=hits.length?tableHTML(hits)
      :'<div class="empty-q"><p>‘'+esc(q)+'’에 맞는 호가 없습니다.</p><p>범위를 넓히거나 날짜를 9.24처럼 넣어 보세요.</p><button class="btn btn-sec" type="button" data-act="clear">검색 지우기</button></div>';
    return;
  }
  var shown=state.all?newest:newest.slice(0,RECENT);
  sum.textContent=(state.all?'전체 ':'최근 ')+shown.length+'호 · 헤드라인을 누르면 그 호 브리핑이 열립니다';
  body.innerHTML=tableHTML(shown)+'<div class="list-foot"><button class="btn btn-sec" type="button" data-act="all">'+(state.all?'최근 '+RECENT+'호만 보기':B.length+'호 모두 보기')+IC.down+'</button></div>';
}
function bind(){
  var qi=document.getElementById('q'), sc=document.getElementById('scope');
  qi.addEventListener('input',function(){state.q=qi.value; renderList();});
  sc.addEventListener('change',function(){state.scope=sc.value; renderList();});
  document.getElementById('list-body').addEventListener('click',function(e){
    var t=e.target.closest('[data-act]'); if(!t) return;
    if(t.getAttribute('data-act')==='all'){state.all=!state.all; renderList();}
    else {state.q=''; state.scope='all'; qi.value=''; sc.value='all'; renderList(); qi.focus();}
  });
}

document.getElementById('app').innerHTML=topHTML()+'<main>'+heroHTML()+standHTML()+flowHTML()+listHTML()+'</main>'+footHTML();
renderList();
bind();
ready();
})();
