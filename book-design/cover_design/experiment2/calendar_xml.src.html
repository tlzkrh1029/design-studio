<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>크립토 브리핑 서고</title>
<!-- 페이지 글꼴: --font-ui, --font-num, --font-data, --font-headline -->

<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/800.css">

<link rel="stylesheet" href="../node_modules/@fontsource/outfit/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/outfit/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/outfit/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/600.css">

<link rel="stylesheet" href="../node_modules/@fontsource/outfit/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/oswald/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/oswald/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/oswald/700.css">
<link rel="stylesheet" href="../mz.css">
<style>
:root {
  /* 바탕: 벽과 종이 */
  --bg-page: #DCE3EA;
  --bg-card: #FFFFFF;
  --bg-sunken: #F2F5F8;
  --bg-hover: var(--bg-sunken);
  --bg-selected: #E4EFF1;
  --bg-match: #FFF1C7;

  /* 글자 */
  --text-1: #15202E;
  --text-2: #465262;
  --text-3: #576373;
  --text-sunday: #A93A32;
  --text-on-accent: #FFFFFF;
  --icon-disabled: #A9B3C0;

  /* 선 */
  --line: #DCE3EA;
  --line-strong: #C3CCD7;
  --line-empty: #848F9D;
  --line-ref: #6B7684;
  --slot-border-w: 1.5px;

  /* 강조 */
  --accent: #022B3B;
  --accent-hover: #0B3D50;
  --accent-soft: #F2B39F;

  /* 국면 */
  --phase-a: #CB8242;
  --phase-b: #A96CAF;
  --phase-c: #056F15;
  --phase-d: #594D99;
  --phase-e: #2B97FF;
  --phase-none: #AEB7C3;

  /* 차트 */
  --chart-line: #15202E;
  --chart-area: rgba(21, 32, 46, 0.06);
  --chart-grid: #E6EBF0;
  --chart-select: var(--accent);
  --chart-line-w: 2px;
  --chart-ref-w: 1.5px;
  --chart-ref-dash: 4 4;
  --chart-dot-r: 3.5px;
  --chart-h: 168px;

  /* 글꼴 */
  --font-ui: "Gothic A1", sans-serif;
  --font-num: "Outfit", "Gothic A1", sans-serif;
  --font-data: "IBM Plex Mono", "Gothic A1", monospace;
  --font-headline: "Noto Serif KR", serif;

  /* 글자 크기 */
  --fs-month: 34px;
  --fs-metric: 28px;
  --fs-day-title: 26px;
  --fs-headline: 22px;
  --fs-metric-sm: 22px;
  --fs-section: 20px;
  --fs-brand: 18px;
  --fs-body: 15px;
  --fs-cell-date: 15px;
  --fs-data: 14px;
  --fs-label: 13px;
  --fs-micro: 12px;

  /* 굵기 */
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;
  --fw-heavy: 800;

  /* 줄 간격과 자간 */
  --lh-tight: 1.15;
  --lh-snug: 1.3;
  --lh-headline: 1.45;
  --lh-body: 1.55;
  --ls-month: -0.02em;
  --ls-num: -0.01em;

  /* 간격 */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-14: 56px;
  --space-16: 64px;

  /* 모서리 */
  --radius-card: 16px;
  --radius-control: 10px;
  --radius-cell: 10px;
  --radius-slot: 2px;
  --radius-pill: 999px;

  /* 그림자 */
  --shadow-card: 0 1px 2px rgba(21, 32, 46, 0.05), 0 12px 32px -20px rgba(21, 32, 46, 0.28);
  --shadow-cover: 0 1px 2px rgba(21, 32, 46, 0.14), 0 6px 12px -6px rgba(21, 32, 46, 0.32);
  --shadow-cover-hover: 0 2px 3px rgba(21, 32, 46, 0.14), 0 12px 20px -8px rgba(21, 32, 46, 0.38);
  --shadow-cover-lg: 0 2px 4px rgba(21, 32, 46, 0.12), 0 24px 40px -20px rgba(21, 32, 46, 0.45);
  --shadow-pop: 0 4px 8px rgba(21, 32, 46, 0.06), 0 24px 48px -16px rgba(21, 32, 46, 0.30);
  --focus-ring: 0 0 0 2px var(--bg-card), 0 0 0 4px var(--accent);

  /* 움직임 */
  --dur-fast: 120ms;
  --dur: 180ms;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --lift: -2px;
  --settle: -4px;

  /* 배치 */
  --page-width: 1440px;
  --first-screen-h: 900px;
  --gutter: 40px;
  --content-width: 1360px;
  --header-h: 80px;
  --col-gap: 24px;
  --cal-width: 936px;
  --panel-width: 400px;
  --panel-sticky-top: 16px;
  --card-pad: 24px;
  --panel-pad: 28px;
  --section-gap: 56px;
  --cal-col-gap: 2px;
  --cal-row-gap: 16px;
  --cell-pad: 8px;
  --date-row-h: 22px;
  --shelf-h: 8px;
  --floor-h: 1px;
  --legend-swatch-w: 20px;
  --brand-mark: 40px;
  --control-h: 40px;
  --cta-h: 52px;
  --tag-h: 20px;
  --search-w: 360px;
  --dropdown-w: 440px;
  --dropdown-max-h: 420px;
  --table-row-h: 44px;
  --icon-size: 18px;
  --icon-stroke: 1.75px;
  --plate-pad: 4px;

  /* 표지 */
  --cover-ratio: 68 / 100;
  --cover-cell: 104px;
  --cover-panel: 248px;
  --cover-panel-2: 156px;
  --cover-panel-3: 100px;

  /* 새로 더한 토큰 (check에 적음) */
  --line-w: 1px;            /* 가는 선·테두리 두께: --line, --line-strong 구분선과 입력칸·꼬리표 테두리 */
  --ring-w: 2px;            /* 고른 날 칸의 --accent 고리 두께 */
  --chart-select-w: 1.5px;  /* 차트의 고른 날 세로선 두께 */
}

/* ---------- 바탕 ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg-page); }
body { margin: 0; background: var(--bg-page); color: var(--text-1); font-family: var(--font-ui); font-size: var(--fs-body);
  font-weight: var(--fw-regular); line-height: var(--lh-body); word-break: keep-all; overflow-wrap: break-word; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus { outline: none; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.page { width: var(--page-width); margin: 0 auto; padding: 0 var(--gutter) var(--space-16); }
.card { background: var(--bg-card); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
.ic { width: var(--icon-size); height: var(--icon-size); flex: none; fill: none; stroke: currentColor; stroke-width: var(--icon-stroke);
  stroke-linecap: round; stroke-linejoin: round; }
.ic * { vector-effect: non-scaling-stroke; }
.n, .t { font-family: var(--font-data); }

/* 국면 색: 선반·견본에만 */
.pa { background: var(--phase-a); } .pb { background: var(--phase-b); } .pc { background: var(--phase-c); }
.pd { background: var(--phase-d); } .pe { background: var(--phase-e); } .pn { background: var(--phase-none); }
.shelf-sw { display: inline-flex; flex: none; width: var(--legend-swatch-w); height: var(--shelf-h); }
.shelf-sw i, .shelf i { flex: 1 1 0; }

/* 꼬리표 */
.tag { display: inline-flex; align-items: center; flex: none; height: var(--tag-h); padding: 0 var(--space-2); border-radius: var(--radius-pill);
  font-family: var(--font-ui); font-size: var(--fs-micro); font-weight: var(--fw-bold); line-height: var(--lh-tight); white-space: nowrap; }
.tag.today { background: var(--accent-soft); color: var(--text-1); }
.tag.line { background: var(--bg-card); color: var(--text-1); border: var(--line-w) solid var(--line-strong); }

/* 단추와 링크 */
.btn { display: inline-flex; align-items: center; gap: var(--space-2); height: var(--control-h); padding: 0 var(--space-4); border: 0;
  border-radius: var(--radius-control); background: var(--bg-card); box-shadow: var(--shadow-card); color: var(--text-1);
  font-size: var(--fs-label); font-weight: var(--fw-semibold); text-decoration: none; white-space: nowrap; cursor: pointer; }
.btn:hover { background: var(--bg-hover); }
.btn.line { box-shadow: none; border: var(--line-w) solid var(--line-strong); }
.lnk { display: inline-flex; align-items: center; gap: var(--space-1); padding: 0; border: 0; background: none; border-radius: var(--radius-control);
  color: var(--accent); font-size: var(--fs-label); font-weight: var(--fw-semibold); line-height: var(--lh-snug); text-decoration: none; cursor: pointer; }
.lnk:hover { text-decoration: underline; text-underline-offset: var(--space-1); }

/* ---------- 머리 ---------- */
.hd { height: var(--header-h); display: flex; align-items: center; gap: var(--space-2); }
.brand { display: flex; align-items: center; gap: var(--space-3); margin-right: auto; }
.mark { width: var(--brand-mark); height: var(--brand-mark); flex: none; display: grid; place-items: center; border-radius: var(--radius-control);
  background: var(--text-1); color: var(--bg-card); }
.mark .ic { width: calc(var(--icon-size) + var(--space-1)); height: calc(var(--icon-size) + var(--space-1)); }
.brand h1 { margin: 0; font-size: var(--fs-brand); font-weight: var(--fw-heavy); line-height: var(--lh-tight); }
.brand p { margin: var(--space-1) 0 0; font-size: var(--fs-label); color: var(--text-2); line-height: var(--lh-snug); }
.brand p .t { font-size: var(--fs-micro); }

.search { position: relative; width: var(--search-w); height: var(--control-h); display: flex; align-items: center; margin-right: var(--space-2);
  background: var(--bg-card); border: var(--line-w) solid var(--line-strong); border-radius: var(--radius-control); }
.search:has(input:focus-visible) { box-shadow: var(--focus-ring); }
.search input:focus-visible { box-shadow: none; }
.scope { position: relative; display: flex; align-items: center; height: 100%; flex: none; }
.scope select { appearance: none; height: 100%; border: 0; background: transparent; padding: 0 var(--space-8) 0 var(--space-3);
  border-radius: var(--radius-control) 0 0 var(--radius-control); font-size: var(--fs-label); font-weight: var(--fw-semibold); color: var(--text-1); cursor: pointer; }
.scope .ic { position: absolute; right: var(--space-2); color: var(--text-2); pointer-events: none; }
.search .vr { width: var(--line-w); align-self: stretch; margin: var(--space-2) 0; background: var(--line-strong); flex: none; }
.search .ic-s { margin-left: var(--space-3); color: var(--text-2); }
.search input { flex: 1 1 auto; min-width: 0; height: 100%; padding: 0 var(--space-3) 0 var(--space-2); border: 0; background: transparent;
  border-radius: 0 var(--radius-control) var(--radius-control) 0; font-size: var(--fs-label); }
.search input::placeholder { color: var(--text-3); opacity: 1; }
.search input::-webkit-search-cancel-button { appearance: none; }
.sib { display: inline-flex; align-items: center; gap: var(--space-2); height: var(--control-h); margin-left: var(--space-2);
  padding: 0 var(--space-1) 0 var(--space-4); border-left: var(--line-w) solid var(--line-strong); border-radius: 0;
  font-size: var(--fs-label); color: var(--text-2); text-decoration: none; white-space: nowrap; }
.sib b { color: var(--text-1); font-weight: var(--fw-semibold); }
.sib:hover b { text-decoration: underline; text-underline-offset: var(--space-1); }

/* 검색 결과 목록 */
.dd { position: absolute; top: calc(100% + var(--space-2)); right: 0; z-index: 30; width: var(--dropdown-w); max-height: var(--dropdown-max-h);
  overflow: auto; padding: var(--space-2); background: var(--bg-card); border-radius: var(--radius-card); box-shadow: var(--shadow-pop); }
.dd[hidden] { display: none; }
.dd-hd { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) var(--space-3);
  font-size: var(--fs-label); color: var(--text-2); }
.dd-hd b { color: var(--text-1); }
.dd ul { list-style: none; margin: 0; padding: 0; }
.dd-it { width: 100%; display: grid; grid-template-columns: auto auto 1fr; align-items: baseline; column-gap: var(--space-3); padding: var(--space-3);
  border: 0; border-radius: var(--radius-control); background: none; text-align: left; cursor: pointer; }
.dd-it:hover { background: var(--bg-hover); }
.dd-it .n { font-size: var(--fs-label); color: var(--text-2); white-space: nowrap; }
.dd-it .no { font-size: var(--fs-label); font-weight: var(--fw-semibold); white-space: nowrap; }
.dd-it .h { font-family: var(--font-headline); font-size: var(--fs-data); font-weight: var(--fw-medium); line-height: var(--lh-headline); }
.dd-it .m { font-size: var(--fs-data); line-height: var(--lh-body); }
.dd-it .m .tag { margin-right: var(--space-1); }
mark { background: var(--bg-match); color: inherit; border-radius: var(--radius-slot); }
.dd-empty { padding: var(--space-4) var(--space-3) var(--space-3); }
.dd-empty .msg { margin: 0; font-size: var(--fs-body); font-weight: var(--fw-bold); }
.dd-empty .how { margin: var(--space-1) 0 var(--space-4); font-size: var(--fs-label); color: var(--text-2); }

/* ---------- 본문 2열 ---------- */
.main { display: grid; grid-template-columns: var(--cal-width) var(--panel-width); column-gap: var(--col-gap); align-items: start; margin-top: var(--space-4); }

/* 달력 카드 */
.cal { padding: var(--card-pad); }
.cal-hd { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
.month { display: flex; align-items: center; gap: var(--space-3); }
.month h2 { margin: 0; font-family: var(--font-num); font-size: var(--fs-month); font-weight: var(--fw-bold); line-height: var(--lh-tight);
  letter-spacing: var(--ls-month); white-space: nowrap; }
.rbtn { width: var(--control-h); height: var(--control-h); display: grid; place-items: center; padding: 0; border: var(--line-w) solid var(--line-strong);
  border-radius: var(--radius-pill); background: var(--bg-card); color: var(--text-1); cursor: pointer; }
.rbtn[aria-disabled="true"] { color: var(--icon-disabled); border-color: var(--line); cursor: not-allowed; }
.sum { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; column-gap: var(--space-2); row-gap: var(--space-1);
  margin: 0; padding: 0; list-style: none; font-size: var(--fs-label); color: var(--text-2); line-height: var(--lh-snug); }
.sum li { display: inline-flex; align-items: center; gap: var(--space-1); white-space: nowrap; }
.sum li + li::before { content: "·"; margin-right: var(--space-1); color: var(--text-2); }
.sum b { font-family: var(--font-num); font-size: var(--fs-body); font-weight: var(--fw-semibold); letter-spacing: var(--ls-num); color: var(--text-1); }
.sum .tag, .sum .sw-empty { margin-right: var(--space-1); }
.sw-empty { display: inline-flex; flex-direction: column; align-items: center; width: var(--legend-swatch-w); }
.sw-empty i { width: var(--space-3); aspect-ratio: var(--cover-ratio); border: var(--line-w) dashed var(--line-empty); background: var(--bg-sunken);
  border-radius: var(--radius-slot); }
.sw-empty::after { content: ""; align-self: stretch; border-top: var(--floor-h) solid var(--line-strong); }
.legend { display: flex; flex-wrap: wrap; align-items: center; column-gap: var(--space-5); row-gap: var(--space-2); margin: var(--space-4) 0 0; padding: 0;
  list-style: none; font-size: var(--fs-label); color: var(--text-2); line-height: var(--lh-snug); }
.legend li { display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap; }
.legend .k { font-family: var(--font-num); font-weight: var(--fw-semibold); color: var(--text-1); }
.legend .lg-note { margin-left: auto; color: var(--text-2); }

.wk, .grid { display: grid; grid-template-columns: repeat(7, 1fr); column-gap: var(--cal-col-gap); }
.wk { margin-top: var(--space-6); font-size: var(--fs-label); font-weight: var(--fw-semibold); color: var(--text-2); line-height: var(--lh-snug); }
.wk span { width: var(--cover-cell); margin: 0 auto; }
.wk .sun { color: var(--text-sunday); }
.grid { row-gap: var(--cal-row-gap); margin-top: var(--space-1); }

.day { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 0; margin: 0;
  padding: var(--cell-pad) 0 var(--space-2); border: 0; border-radius: var(--radius-cell); background: transparent; text-align: left; }
button.day { cursor: pointer; }
.dr { width: var(--cover-cell); height: var(--date-row-h); display: flex; align-items: center; gap: var(--space-1); }
.dn { font-family: var(--font-num); font-size: var(--fs-cell-date); font-weight: var(--fw-semibold); line-height: var(--lh-tight);
  letter-spacing: var(--ls-num); color: var(--text-1); margin-right: var(--space-1); }
.day.sun .dn { color: var(--text-sunday); }
.day.s-out .dn, .day.s-pre .dn { color: var(--text-3); font-weight: var(--fw-medium); }
.day.s-next .dn { color: var(--text-2); font-weight: var(--fw-medium); }
.pre-note { font-size: var(--fs-micro); color: var(--text-3); }
.dr .end { margin-left: auto; display: inline-flex; align-items: center; gap: var(--space-1); }
.ph { font-family: var(--font-num); font-size: var(--fs-label); font-weight: var(--fw-semibold); line-height: var(--lh-tight); color: var(--text-1); white-space: nowrap; }
.slot-wrap { width: var(--cover-cell); margin-top: var(--space-2); }
.cv { display: block; border-radius: var(--radius-slot); box-shadow: var(--shadow-cover); }
.shelf { align-self: stretch; display: flex; height: var(--shelf-h); }
.floor { align-self: stretch; height: var(--shelf-h); border-top: var(--floor-h) solid var(--line-strong); }
.slot { width: 100%; aspect-ratio: var(--cover-ratio); display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--space-1); padding: var(--space-2); border-radius: var(--radius-slot); text-align: center; font-size: var(--fs-micro); line-height: var(--lh-snug); }
.slot.empty { border: var(--slot-border-w) dashed var(--line-empty); background: var(--bg-sunken); color: var(--text-3); }
.slot.next { border: var(--slot-border-w) dashed var(--accent); color: var(--text-2); }
.slot.next b { font-family: var(--font-num); font-size: var(--fs-body); font-weight: var(--fw-semibold); color: var(--text-1); }

/* 칸 상태: 바탕은 호버·고름·검색일 때만 */
button.day:hover { background: var(--bg-hover); }
button.day:hover .cv { box-shadow: var(--shadow-cover-hover); }
.day.match, .day.match:hover { background: var(--bg-match); }
.day.sel, .day.sel:hover { background: var(--bg-selected); }
.day.sel.match { background: var(--bg-match); }
.day.sel::after { content: ""; position: absolute; inset: 0; border: var(--ring-w) solid var(--accent); border-radius: var(--radius-cell); pointer-events: none; }

/* ---------- 오른쪽 칸 ---------- */
.panel { position: sticky; top: var(--panel-sticky-top); padding: var(--panel-pad); }
.p-top { display: flex; align-items: center; gap: var(--space-2); min-height: var(--tag-h); font-size: var(--fs-label); color: var(--text-2); line-height: var(--lh-snug); }
.p-lab { font-weight: var(--fw-semibold); }
.p-run { font-size: var(--fs-micro); }
.p-top .lnk { margin-left: auto; }
.p-date { display: flex; align-items: baseline; gap: var(--space-3); margin-top: var(--space-2); }
.p-date h2 { margin: 0; font-family: var(--font-num); font-size: var(--fs-day-title); font-weight: var(--fw-bold); line-height: var(--lh-tight);
  letter-spacing: var(--ls-num); white-space: nowrap; }
.p-no { margin-left: auto; font-family: var(--font-num); font-size: var(--fs-body); font-weight: var(--fw-semibold); white-space: nowrap; }
.p-covers { display: flex; justify-content: center; gap: var(--space-4); margin-top: var(--space-4); }
.p-covers .cv { box-shadow: var(--shadow-cover-lg); }
.p-covers.n2, .p-covers.n3 { gap: var(--space-2); }

  else { B.forEach(function(x){ if(x.date<d) prev=x; if(x.date>d&&!next) next=x; }); }

function chartsHTML(){

    }).join('')+'</div></section>';

function niceStep(raw){ var p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p; return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p; }
function drawCharts(){ CH.forEach(drawChart); }
function drawChart(c){
  var host=document.getElementById('plot-'+c.key), valEl=document.getElementById('val-'+c.key);
  var W=Math.floor(host.getBoundingClientRect().width), H=tok('--chart-h');
  var pl=tok('--space-10'), pr=tok('--space-2'), pt=tok('--space-4'), pb=tok('--space-6'), gapT=tok('--space-2');
  var pts=daily(c.key), vals=pts.map(function(p){return p.v;}); if(c.ref!=null) vals.push(c.ref);
  var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals), rg=(hi-lo)||1, step=niceStep(rg/4);
  lo-=rg*0.08; hi+=rg*0.08;
  var x0=dn(M_START), x1=M_END_N;
  function X(d){ return pl+(dn(d)-x0)/(x1-x0)*(W-pl-pr); }
  function Yv(v){ return pt+(hi-v)/(hi-lo)*(H-pt-pb); }
  var base=H-pb, s='';
  for(var k=Math.ceil(lo/step); k*step<=hi+1e-9; k++){
    var t=Math.round(k*step*1e6)/1e6, y=Yv(t).toFixed(1);
    s+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/><text class="tk" x="'+(pl-gapT)+'" y="'+y+'" dy="0.32em" text-anchor="end">'+c.tick(t)+'</text>';
  }
  /* 선: 이어진 날끼리만 잇고 빈 날에서 끊는다 */
  var segs=[], cur=[];
  pts.forEach(function(p,i){ if(i&&dn(p.d)-dn(pts[i-1].d)>1){ segs.push(cur); cur=[]; } cur.push(p); }); if(cur.length) segs.push(cur);
  segs.forEach(function(g){
    var dpath=g.map(function(p,i){ return (i?'L':'M')+X(p.d).toFixed(1)+' '+Yv(p.v).toFixed(1); }).join('');
    s+='<path class="area" d="'+dpath+'L'+X(g[g.length-1].d).toFixed(1)+' '+base+'L'+X(g[0].d).toFixed(1)+' '+base+'Z"/>';
    s+='<path class="ln" d="'+dpath+'"/>';
  });
  /* 기준선 */
  if(c.ref!=null){ var ry=Yv(c.ref).toFixed(1);
    s+='<line class="ref" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+ry+'" y2="'+ry+'"/><text class="rl" x="'+(pl+gapT)+'" y="'+(ry-gapT)+'">'+c.refLab+'</text>'; }
  /* 끝점 */
  var last=pts[pts.length-1]; s+='<circle class="end" cx="'+X(last.d).toFixed(1)+'" cy="'+Yv(last.v).toFixed(1)+'"/>';
  /* 날짜 축과 고른 날 */
  var xs=X(S.date), lab=dotd(S.date), half=tok('--space-6');
  [1,10,20,M_END_N-dn(M_START)+1].forEach(function(dd){
    var d=M_START.slice(0,8)+(dd<10?'0':'')+dd, x=X(d);
    if(Math.abs(x-xs)<half*1.25) return;
    s+='<text class="tk" x="'+x.toFixed(1)+'" y="'+(H-gapT/2)+'" text-anchor="middle">'+dotd(d)+'</text>';
  });
  var sv=null; pts.forEach(function(p){ if(p.d===S.date) sv=p.v; });
  s+='<line class="sl" x1="'+xs.toFixed(1)+'" x2="'+xs.toFixed(1)+'" y1="'+(pt-gapT)+'" y2="'+base+'"/>';
  if(sv!=null) s+='<circle class="sd" cx="'+xs.toFixed(1)+'" cy="'+Yv(sv).toFixed(1)+'"/>';
  var anc='middle', lx=xs; if(xs+half>W){ anc='end'; lx=W; } else if(xs-half<0){ anc='start'; lx=0; }
  s+='<text class="st" x="'+lx.toFixed(1)+'" y="'+(H-gapT/2)+'" text-anchor="'+anc+'">'+lab+'</text>';
  var label=c.name+' '+MO+'월 추이. '+md(S.date)+' '+(sv==null?'기록 없음':(c.key==='btcd'?f(sv,c.dp):sg(sv,c.dp))+c.unit);
  host.innerHTML='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">'+s+'</svg>';
  /* 큰 값: 고른 날의 대표 회차 */
  var b=rep(S.date), cap=c.cap(b,sv);
  valEl.innerHTML=sv==null
    ?'<b class="na">—</b><span>'+md(S.date)+' · '+(DM[S.date]?'기록 없음':'브리핑 없음')+'</span>'
    :'<b>'+(c.key==='btcd'?f(sv,c.dp):sg(sv,c.dp))+c.unit+'</b><span>'+md(S.date)+(cap?' · '+esc(cap):'')+'</span>';
}

  var d=c.getAttribute('data-d'), step={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key], tgt=null;
  if(step){ for(var m=dn(d)+step; m>=dn(FIRST)&&m<=dn(TODAY); m+=step){ var x=ds(m); if(selectable(x)){ tgt=x; break; } if(Math.abs(step)===7) break; } }
  else if(e.key==='Home') tgt=FIRST; else if(e.key==='End') tgt=TODAY;
  if(!tgt) return;
  e.preventDefault(); select(tgt); var el=grid.querySelector('[data-d="'+tgt+'"]'); if(el) el.focus();
});
/* 오른쪽 칸 */
panel.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]'), s=e.target.closest('[data-iss]');
  if(g){ var id=g.getAttribute('data-go'); if(id==='today') select(TODAY,L.id); else { var b=byId(id); if(b) select(b.date,b.id); } }
  else if(s){ S.id=s.getAttribute('data-iss'); renderPanel(true); var p=panel.querySelector('[data-iss="'+S.id+'"]'); if(p) p.focus(); }
});
/* 표 */
tbody.addEventListener('click',function(e){
  if(e.target.closest('a')) return;
  var tr=e.target.closest('tr'); if(tr) select(tr.getAttribute('data-d'), tr.getAttribute('data-id'));
});
document.getElementById('csv').addEventListener('click',csvDownload);

/* ---------- 검색 ---------- */
var qEl=document.getElementById('q'), scopeEl=document.getElementById('scope'), dd=document.getElementById('dd'), form=document.getElementById('search');
function parseDate(t){
  var m;
  if((m=t.match(/^(\d{4})\s*[-.\/년]\s*(\d{1,2})\s*[-.\/월]\s*(\d{1,2})\s*일?\.?$/))) return mk(+m[1],+m[2],+m[3]);
  if((m=t.match(/^(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\.?$/))) return mk(YR,+m[1],+m[2]);
  if((m=t.match(/^(\d{1,2})\s*월\s*(\d{1,2})\s*일?$/))) return mk(YR,+m[1],+m[2]);
  if((m=t.match(/^(\d{1,2})\s*일$/))) return mk(YR,MO,+m[1]);
  return null;
  function mk(y,mo,da){ if(mo<1||mo>12||da<1||da>31) return 'x'; return y+'-'+(mo<10?'0':'')+mo+'-'+(da<10?'0':'')+da; }
}
function hilite(text,ql){
  var lo=text.toLowerCase(), out='', i=0, j;
  while((j=lo.indexOf(ql,i))>=0){ out+=esc(text.slice(i,j))+'<mark>'+esc(text.slice(j,j+ql.length))+'</mark>'; i=j+ql.length; }
  return out+esc(text.slice(i));
}
function openDD(html){ dd.innerHTML=html; dd.hidden=false; qEl.setAttribute('aria-expanded','true'); }
function closeDD(){ dd.hidden=true; dd.innerHTML=''; qEl.setAttribute('aria-expanded','false'); }
function clearSearch(){ qEl.value=''; S.match={}; updateCal(); closeDD(); qEl.focus(); }
function emptyHTML(t){
  return '<div class="dd-empty" role="status"><p class="msg">‘'+esc(t)+'’에 맞는 호가 없습니다</p>'
    +'<p class="how">날짜는 9/24처럼, 낱말은 헤드라인·메모에 든 말로 찾습니다.</p>'
    +'<button type="button" class="btn line" data-clear>검색 지우기</button></div>';
}
function runSearch(){
  var t=qEl.value.trim(); S.scope=scopeEl.value;
  if(!t){ S.match={}; updateCal(); closeDD(); return; }
  var d=parseDate(t);
  if(d){ S.match={}; updateCal();
    if(d!=='x'&&selectable(d)){ closeDD(); select(d); return; }
    openDD(emptyHTML(t)); return; }
  var mm=t.match(/^제?\s*(\d{1,3})\s*호$/);
  if(mm){ var b0=B[+mm[1]-1]; S.match={}; updateCal(); if(b0){ closeDD(); select(b0.date,b0.id); return; } openDD(emptyHTML(t)); return; }
  var ql=t.toLowerCase(), hits=B.filter(function(b){
    var fs=S.scope==='headline'?[b.headline]:S.scope==='note'?[b.note]:[b.headline,b.note,b.title];
    return fs.some(function(x){ return x&&x.toLowerCase().indexOf(ql)>=0; });
  });
  S.match={}; hits.forEach(function(b){ S.match[b.date]=1; }); updateCal();
  if(!hits.length){ openDD(emptyHTML(t)); return; }
  var h='<div class="dd-hd" role="status"><span>‘<b>'+esc(t)+'</b>’ · '+hits.length+'건</span><button type="button" class="lnk" data-clear>검색 지우기</button></div><ul>';
  hits.slice().reverse().forEach(function(b){
    var useNote=!b.headline||(S.scope==='note')||(b.headline.toLowerCase().indexOf(ql)<0&&b.note&&b.note.toLowerCase().indexOf(ql)>=0);
    h+='<li><button type="button" class="dd-it" data-go="'+b.id+'"><span class="n">'+mdot(b.date)+' '+wd(b.date)+'</span><span class="no">제'+vol(b)+'호</span>'
      +(useNote?'<span class="m"><span class="tag line">메모</span>'+hilite(b.note||'',ql)+'</span>':'<span class="h">'+hilite(b.headline,ql)+'</span>')+'</button></li>';
  });
  openDD(h+'</ul>');
}
var timer=null;
qEl.addEventListener('input',function(){ clearTimeout(timer); timer=setTimeout(runSearch,200); });
scopeEl.addEventListener('change',function(){ if(qEl.value.trim()) runSearch(); });
form.addEventListener('submit',function(e){ e.preventDefault(); clearTimeout(timer); runSearch(); });
qEl.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if(!dd.hidden) closeDD(); else if(qEl.value) clearSearch(); } });
dd.addEventListener('click',function(e){
  if(e.target.closest('[data-clear]')){ clearSearch(); return; }
  var g=e.target.closest('[data-go]'); if(g){ var b=byId(g.getAttribute('data-go')); if(b){ closeDD(); select(b.date,b.id); } }
});
document.addEventListener('click',function(e){ if(!dd.hidden&&!form.contains(e.target)) closeDD(); });
document.querySelectorAll('.rbtn[aria-disabled="true"]').forEach(function(b){ b.addEventListener('click',function(e){ e.preventDefault(); }); });
document.querySelector('.sib').addEventListener('click',function(e){ e.preventDefault(); });

ready();
})();
</script></body></html>
