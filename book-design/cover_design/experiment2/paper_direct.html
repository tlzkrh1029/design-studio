<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크립토 브리핑 서고</title>
<!-- page type: Noto Serif KR (nameplate, headlines, body), Gothic A1 (decks, labels), Oswald (figures), IBM Plex Mono (dates, tables) -->
<!-- covers also need Gothic A1 500-800, Outfit 500-800, Oswald 500-700 -->
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-kr/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gothic-a1/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/outfit/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/outfit/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/outfit/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/oswald/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/oswald/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/oswald/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/oswald/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/500.css">
<link rel="stylesheet" href="../mz.css">
<style>
/* ---------- tokens: newsprint and one ink. The covers are the only colour on the page. ---------- */
:root{
  --paper:#F2EEE5;          /* newsprint */
  --ink:#161513;            /* text, rules, solid phase C */
  --ink-2:#46423B;          /* secondary text, 8.5:1 on paper */
  --ink-3:#69645A;          /* meta text, 5.1:1 on paper */
  --hair:rgba(22,21,19,.24);/* column rules, hairlines */
  --tint:rgba(22,21,19,.055);/* no-issue days */
  --serif:'Noto Serif KR',serif;
  --sans:'Gothic A1',sans-serif;
  --num:'Oswald',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --page:1296px;            /* 1440 minus two 72px margins */
  --col-gap:32px;           /* gutter on each side of a column rule */
  --sec-gap:76px;           /* space before each section */
  --np:132px;               /* nameplate */
  --banner:76px;            /* lead headline */
  --h-sec:34px;             /* section titles */
  --body:16px;              /* serif body text */
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.6;
  word-break:keep-all; overflow-wrap:break-word; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
#app{position:relative; isolation:isolate; overflow:hidden}
#app::before{content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; background-image:var(--grain,none); background-size:170px 170px; mix-blend-mode:multiply; opacity:.22}
a{color:inherit; text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ink); outline-offset:4px}
.wrap{width:var(--page); margin:0 auto; padding-bottom:40px}
h1,h2,h3,p,figure,ul,ol,dl,dd{margin:0}
ul{padding:0; list-style:none}
.cv{display:block; width:max-content}
.cv>div{transition:transform .2s ease}
.cv:hover>div{transform:translateY(-3px)}

/* ---------- phase marks: ink textures instead of colour ---------- */
.ph-A{background:radial-gradient(circle,var(--ink) 0 1.05px,transparent 1.35px) 0 0/4px 4px,var(--paper)}
.ph-B{background:repeating-linear-gradient(45deg,var(--ink) 0 1.2px,transparent 1.2px 4.4px),var(--paper)}
.ph-C{background:var(--ink); color:var(--paper)}
.ph-D{background:repeating-linear-gradient(45deg,var(--ink) 0 1px,transparent 1px 4.6px),repeating-linear-gradient(-45deg,var(--ink) 0 1px,transparent 1px 4.6px),var(--paper)}
.ph-E{background:repeating-linear-gradient(0deg,var(--ink) 0 1.2px,transparent 1.2px 4.2px),var(--paper)}
.st{display:inline-flex; vertical-align:middle; height:var(--s,18px); min-width:var(--s,18px); border:1.5px solid var(--ink); overflow:hidden; flex-shrink:0}
.st i{flex:1 0 var(--s,18px); width:calc(var(--s,18px) - 3px); display:flex; align-items:center; justify-content:center; font-style:normal}
.st i+i{border-left:1.5px solid var(--ink)}
.st b{font:800 calc(var(--s,18px)*.56)/1 var(--sans); padding:.12em .2em .1em}
.st i:not(.ph-C) b{background:var(--paper)}
.st-q{border-style:dashed; background:var(--paper)}
.st-q i b{background:none; color:var(--ink-2)}

/* ---------- masthead ---------- */
.mast{padding-top:30px}
.mast-top{display:grid; grid-template-columns:212px 1fr 212px; align-items:center; gap:24px; padding-bottom:16px}
.np{text-align:center; font-family:var(--serif); font-weight:900; font-size:var(--np); line-height:1.04; letter-spacing:-.02em; white-space:nowrap}
.ear{border-top:3px solid var(--ink); border-bottom:1px solid var(--ink); padding:11px 0 13px; height:118px; display:flex; flex-direction:column}
.ear-k{font:800 11.5px/1 var(--sans); letter-spacing:.16em; color:var(--ink-2); margin-bottom:auto}
.ear-b{display:flex; align-items:center; gap:13px}
.ear-r .ear-b{justify-content:flex-start}
.ear-t b{display:block; font:800 23px/1.15 var(--serif); letter-spacing:-.01em}
.ear-t span{display:block; margin-top:5px; font:500 12.5px/1.35 var(--sans); color:var(--ink-2)}
.ear .st{--s:54px; border-width:0}
.ear .st b{font-size:31px; padding:0}
.ear-r{text-align:right}
.ear-r .ear-b{justify-content:flex-end}
.ear-num{font:500 46px/1 var(--num); letter-spacing:-.01em}
.folio{position:relative; border-top:4px solid var(--ink); margin-top:2px; padding:10px 0 9px; display:flex; justify-content:space-between; align-items:baseline;
  font:500 12.5px/1.4 var(--mono); letter-spacing:.01em; border-bottom:1px solid var(--ink)}
.folio::before{content:""; position:absolute; left:0; right:0; top:2px; height:1px; background:var(--ink)}
.folio .mid{font:600 13px/1.4 var(--sans); letter-spacing:.06em}
.idx{display:flex; align-items:center; justify-content:space-between; height:58px; border-bottom:3px solid var(--ink)}
.idx ul{display:flex; gap:28px}
.idx a{display:flex; align-items:baseline; gap:7px; font:700 15px/1 var(--sans); padding:8px 0 7px; border-bottom:2px solid transparent}
.idx a span{font:500 11.5px/1 var(--mono); color:var(--ink-3)}
.idx a.on{border-bottom-color:var(--ink)}
.idx a:hover{border-bottom-color:var(--ink)}
.find{display:flex; align-items:center; gap:14px}
.find .lbl{font:600 12px/1 var(--sans); color:var(--ink-3); letter-spacing:.04em}
.scope{display:flex; border:1px solid var(--ink)}
.scope button{font:600 12.5px/1 var(--sans); background:none; border:0; border-left:1px solid var(--ink); padding:8px 11px 7px; color:var(--ink); cursor:pointer}
.scope button:first-child{border-left:0}
.scope button.on{background:var(--ink); color:var(--paper)}
.qbox{display:flex; align-items:center; gap:9px; width:262px; border-bottom:1.5px solid var(--ink); padding:6px 2px 7px}
.qbox svg{flex-shrink:0}
.qbox input{flex:1; min-width:0; border:0; background:none; font:500 14px/1.2 var(--sans); color:var(--ink); padding:0}
.qbox input:focus{outline:none}
.qbox input::placeholder{color:var(--ink-3)}
.qn{font:500 12px/1 var(--mono); color:var(--ink-2); min-width:0}
.qn:empty{display:none}

/* ---------- 1면: lead story ---------- */
.front{padding-top:28px}
.kick{display:flex; align-items:center; gap:12px; font:700 14.5px/1 var(--sans)}
.kick .sep{width:1px; height:13px; background:var(--ink-3)}
.flag{display:inline-block; background:var(--ink); color:var(--paper); font:800 12px/1 var(--sans); letter-spacing:.08em; padding:6px 9px 5px}
.banner{margin-top:14px; font-family:var(--serif); font-weight:800; font-size:var(--banner); line-height:1.16; letter-spacing:-.028em}
.banner a{text-decoration-thickness:3px; text-underline-offset:10px}
.banner a:hover{text-decoration-line:underline}
.kick .go{margin-left:auto; display:inline-flex; align-items:center; gap:7px; font:700 13.5px/1 var(--sans); border-bottom:1.5px solid var(--ink); padding-bottom:4px}
.fcols{display:grid; grid-template-columns:492px 1fr 332px; margin-top:26px; border-top:1px solid var(--ink); padding-top:26px}
.lead{padding-right:var(--col-gap)}
.lead figcaption{display:flex; justify-content:space-between; gap:16px; margin-top:16px; padding-top:9px; border-top:1px solid var(--hair);
  font:500 12.5px/1.5 var(--sans); color:var(--ink-2)}
.lead figcaption .credit{font:500 11.5px/1.6 var(--mono); color:var(--ink-3); white-space:nowrap}
.story{padding:0 var(--col-gap); border-left:1px solid var(--hair); border-right:1px solid var(--hair); display:flex; flex-direction:column}
.deck li{position:relative; padding-left:16px; font:700 19px/1.5 var(--sans); letter-spacing:-.01em}
.deck li+li{margin-top:4px}
.deck li::before{content:""; position:absolute; left:0; top:.32em; bottom:.32em; width:4px; background:var(--ink)}
.dateline{margin-top:16px; padding:8px 0; border-top:1px solid var(--ink); border-bottom:1px solid var(--hair); font:500 12px/1.5 var(--mono); color:var(--ink-2); display:flex; justify-content:space-between}
.body{margin-top:22px; font-family:var(--serif); font-size:var(--body); line-height:1.86; letter-spacing:-.005em}
.body .lab{display:inline-block; margin-right:8px; font:800 11.5px/1 var(--sans); letter-spacing:.1em; border-bottom:2px solid var(--ink); padding-bottom:3px; vertical-align:2px}
.pages{margin-top:22px; border-top:1px solid var(--ink)}
.pages a{display:grid; grid-template-columns:44px 1fr auto; align-items:baseline; gap:10px; padding:9px 0 8px; border-bottom:1px solid var(--hair)}
.pages a:hover b{text-decoration:underline; text-underline-offset:3px}
.pages i{font:500 11.5px/1 var(--mono); font-style:normal; color:var(--ink-3)}
.pages b{font:700 14px/1.3 var(--sans)}
.pages span{display:block; margin-top:3px; font:500 12px/1.4 var(--sans); color:var(--ink-2)}
.pages svg{align-self:center; color:var(--ink-2)}
.body p+p{margin-top:12px; text-indent:0}
.body b{font-weight:700}
.figs{margin-top:24px; border-top:3px solid var(--ink)}
.figs-h{display:flex; justify-content:space-between; align-items:baseline; padding:8px 0 0; font:800 12px/1 var(--sans); letter-spacing:.12em}
.figs-h span{font:500 11.5px/1 var(--mono); letter-spacing:0; color:var(--ink-3)}
.figs-g{display:grid; grid-template-columns:repeat(3,1fr); margin-top:12px}
.fig{padding:0 0 2px 14px; border-left:1px solid var(--hair)}
.fig:first-child{padding-left:0; border-left:0}
.fig dt{font:700 12px/1.3 var(--sans); letter-spacing:.02em; white-space:nowrap}
.fig dd.v{font:500 36px/1.1 var(--num); letter-spacing:-.01em; margin-top:6px}
.fig dd.d{font:500 11.5px/1.4 var(--mono); color:var(--ink-2); margin-top:4px; white-space:nowrap}
.cta{margin-top:20px; display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--ink); color:var(--paper); padding:15px 18px 14px 20px}
.cta-t{display:block; font:800 18px/1.2 var(--sans); letter-spacing:-.01em}
.cta-s{display:block; margin-top:4px; font:500 11.5px/1.3 var(--mono); opacity:.86}
.cta svg{flex-shrink:0}
.cta:hover{background:#000}
.recent{padding-left:var(--col-gap)}
.rh{display:flex; justify-content:space-between; align-items:baseline; padding-bottom:9px; border-bottom:1px solid var(--ink)}
.rh b{font:800 12px/1 var(--sans); letter-spacing:.12em}
.rh a{font:600 12.5px/1 var(--sans); color:var(--ink-2)}
.rh a:hover{color:var(--ink)}
.ri{display:grid; grid-template-columns:100px 1fr; gap:16px; padding:13px 0; border-bottom:1px solid var(--hair)}
.ri:last-child{border-bottom:0; padding-bottom:0}
.rm{font:500 11.5px/1.3 var(--mono); color:var(--ink-2)}
.ri h3{margin-top:7px; font:700 16px/1.42 var(--serif); letter-spacing:-.015em; text-wrap:pretty}
.ri h3 a:hover{text-decoration:underline; text-underline-offset:3px}
.rp{margin-top:8px; display:flex; align-items:center; gap:6px; font:500 12px/1.3 var(--sans); color:var(--ink-2)}
.rp .st{--s:15px; border-width:1px}

/* ---------- section heads ---------- */
.sec{margin-top:var(--sec-gap)}
.sh{display:flex; align-items:center; gap:14px; border-top:3px solid var(--ink); padding:14px 0 13px; border-bottom:1px solid var(--ink)}
.sh h2{font:800 var(--h-sec)/1.1 var(--serif); letter-spacing:-.02em}
.sh .note{margin-left:auto; font:500 12.5px/1.5 var(--sans); color:var(--ink-2); text-align:right}
.sh .flag{align-self:center}

/* ---------- 2면: phase strip and indicator charts on one date axis ---------- */
.board{position:relative; margin-top:22px; height:var(--bh)}
.bt{position:absolute; left:0; right:0; display:flex; align-items:baseline; gap:14px; white-space:nowrap}
.bt h3{font:800 14.5px/1.2 var(--sans); letter-spacing:.01em}
.bt p{font:500 12.5px/1.2 var(--sans); color:var(--ink-2)}
.bt p b{color:var(--ink); font-weight:700}
.bd-plot{position:absolute; top:0; left:0; height:100%}
.bd-plot svg{position:absolute; inset:0; overflow:visible}
.bd-rule{position:absolute; left:0; right:0; height:0; border-top:1px solid var(--hair)}
.pc{position:absolute; height:38px; display:flex; border:1.5px solid var(--ink)}
.pc i{flex:1 1 0; display:flex; align-items:center; justify-content:center; font-style:normal; min-width:0}
.pc i+i{border-left:1.5px solid var(--ink)}
.pc b{font:800 14px/1 var(--sans); padding:2px 2px 1px}
.pc i:not(.ph-C) b{background:var(--paper)}
.pc.q{border-style:dashed; border-width:1.5px}
.pc.q b{color:var(--ink-2); font-weight:700}
.pc.today{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.pc-n{position:absolute; text-align:center; font:500 10.5px/1 var(--mono); color:var(--ink-2)}
.pc-gap{position:absolute; display:flex; align-items:center; justify-content:center; height:38px}
.pc-gap::before{content:""; position:absolute; left:6px; right:6px; top:50%; border-top:1px solid var(--ink-3)}
.pc-gap span{position:relative; background:var(--paper); padding:0 5px; font:600 11.5px/1 var(--sans); color:var(--ink-2)}
.g-grid{stroke:var(--ink); stroke-opacity:.14; stroke-width:1}
.g-zero{stroke:var(--ink); stroke-opacity:.42; stroke-width:1}
.g-week{stroke:var(--ink); stroke-opacity:.16; stroke-width:1}
.g-band{fill:var(--ink); fill-opacity:.05}
.g-tick{font:500 11px/1 var(--mono); fill:var(--ink-3); text-anchor:end}
.g-day{font:500 11.5px/1 var(--mono); fill:var(--ink); text-anchor:middle}
.g-wd{font:500 10.5px/1 var(--sans); fill:var(--ink-3); text-anchor:middle}
.g-today{fill:var(--ink)}
.g-day.on{fill:var(--paper); font-weight:500}
.g-mon{font:700 12px/1 var(--sans); fill:var(--ink)}
.g-line{fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linejoin:round; stroke-linecap:round}
.g-dot{fill:var(--ink)}
.g-last{fill:var(--ink); stroke:var(--paper); stroke-width:2}
.g-end{font:500 12px/1 var(--mono); fill:var(--ink)}
.g-ref{stroke:var(--ink); stroke-width:1.3; stroke-dasharray:5 4}
.g-reft{font:600 11.5px/1 var(--sans); fill:var(--ink); text-anchor:end}
.g-gap{font:500 10.5px/1 var(--sans); fill:var(--ink-3); text-anchor:middle}
.lg{display:flex; flex-wrap:wrap; align-items:center; gap:10px 22px; margin-top:20px; padding-top:14px; border-top:1px solid var(--ink); font:500 12.5px/1.4 var(--sans); color:var(--ink-2)}
.lg-i{display:inline-flex; align-items:center; gap:8px; white-space:nowrap}
.lg-i b{color:var(--ink); font-weight:800}
.lg .st{--s:20px}
.sw-gap{display:inline-block; width:26px; height:20px; background:var(--tint); position:relative}
.sw-gap::before{content:""; position:absolute; left:4px; right:4px; top:50%; border-top:1px solid var(--ink-3)}
.sw-n{font:500 11px/1 var(--mono); color:var(--ink); border:1px solid var(--hair); padding:4px 4px 3px}
.bd-note{margin-top:10px; font:500 12.5px/1.6 var(--sans); color:var(--ink-2)}

/* ---------- 3면: 축쇄판, every cover ---------- */
.month{display:flex; align-items:baseline; gap:12px; margin-top:22px}
.month b{font:800 20px/1 var(--serif); letter-spacing:-.01em}
.month span{font:500 12.5px/1 var(--mono); color:var(--ink-2)}
.month::after{content:""; flex:1; border-top:1px solid var(--hair); transform:translateY(-4px)}
.grid{display:grid; grid-template-columns:repeat(8,141px); column-gap:24px; row-gap:30px; margin-top:20px}
.ci figcaption{margin-top:12px; padding-top:7px; border-top:1px solid var(--ink)}
.cm{display:flex; justify-content:space-between; align-items:baseline; gap:6px}
.cm b{font:800 13px/1.2 var(--sans); letter-spacing:-.01em}
.cm span{font:500 11px/1.2 var(--mono); color:var(--ink-2); white-space:nowrap}
.cm span em{font-style:normal; font-family:var(--sans); font-weight:700; color:var(--ink)}
.ch{margin-top:5px; font:500 12.5px/1.5 var(--serif); letter-spacing:-.01em; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; min-height:4.5em}
.ch.nt{font-family:var(--sans); font-size:12px; color:var(--ink-2)}
.gapcell .gbox{width:141px; aspect-ratio:68/100; border:1px dashed var(--ink-3); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center;
  background:repeating-linear-gradient(-45deg,transparent 0 9px,rgba(22,21,19,.045) 9px 10px)}
.gbox b{font:800 22px/1 var(--serif)}
.gbox span{font:500 11.5px/1.5 var(--mono); color:var(--ink-2)}
.gbox small{font:500 12px/1.4 var(--sans); color:var(--ink-2)}
[hidden]{display:none!important}

/* ---------- 4면: publication record as a market table ---------- */
.tbar{display:flex; align-items:center; justify-content:space-between; margin-top:18px}
.tbar p{font:500 12.5px/1.5 var(--sans); color:var(--ink-2)}
.csv{display:inline-flex; align-items:center; gap:8px; font:700 13px/1 var(--sans); color:var(--ink); background:none; border:1.5px solid var(--ink); padding:9px 13px 8px; cursor:pointer}
.csv:hover{background:var(--ink); color:var(--paper)}
.tbl{width:100%; border-collapse:collapse; margin-top:12px; font-variant-numeric:tabular-nums}
.tbl th{font:700 11.5px/1.3 var(--sans); letter-spacing:.02em; text-align:left; padding:7px 8px; vertical-align:bottom; white-space:nowrap}
.tbl thead tr:first-child th{border-top:3px solid var(--ink); padding-top:9px}
.tbl thead tr:last-child th{border-bottom:1px solid var(--ink)}
.tbl th.grp{text-align:center; border-bottom:1px solid var(--hair); padding-bottom:5px}
.tbl th.sub{font-weight:600; color:var(--ink-2); padding-top:5px}
.tbl td{padding:6px 8px 5px; border-bottom:1px solid var(--hair); vertical-align:baseline; font:500 12.5px/1.5 var(--mono)}
.tbl .n{text-align:right; white-space:nowrap}
.tbl .vol{font-weight:500; width:44px}
.tbl .dt{white-space:nowrap; width:96px}
.tbl .dt span{font-family:var(--sans); color:var(--ink-2)}
.tbl .dt em{font-style:normal; display:block; font:600 11px/1.4 var(--sans); color:var(--ink-2)}
.tbl .ph{width:62px}
.tbl .ph .st{--s:19px; vertical-align:baseline}
.tbl td.hl{font:500 14px/1.5 var(--serif); letter-spacing:-.01em; width:auto}
.tbl td.hl a:hover{text-decoration:underline; text-underline-offset:3px}
.tbl td.hl .nt{font:500 13px/1.55 var(--sans); color:var(--ink-2)}
.tbl td.hl .nt::before{content:"메모"; display:inline-block; margin-right:7px; font:700 10.5px/1 var(--sans); border:1px solid var(--ink-3); padding:2px 4px 1px; vertical-align:2px; color:var(--ink-2)}
.tbl .run{white-space:nowrap; font:500 12.5px/1.5 var(--sans); color:var(--ink-2); width:112px}
.tbl tr.today td{background:rgba(22,21,19,.06)}
.tbl tr.today td.vol{font-weight:500; box-shadow:inset 4px 0 0 var(--ink)}
.tbl tr.gap td{font:500 12px/1.4 var(--sans); color:var(--ink-2); text-align:center; padding:9px 8px;
  background:repeating-linear-gradient(-45deg,transparent 0 9px,rgba(22,21,19,.05) 9px 10px)}
.tbl tbody tr:last-child td{border-bottom:3px solid var(--ink)}
.tbl .neg{white-space:nowrap}

/* ---------- 별지 · 알림 ---------- */
.tail{display:grid; grid-template-columns:400px 1fr; margin-top:var(--sec-gap); border-top:3px solid var(--ink)}
.tail>div{padding-top:14px}
.annex{padding-right:var(--col-gap)}
.notice{padding-left:var(--col-gap); border-left:1px solid var(--hair)}
.sh2{display:flex; align-items:center; gap:12px; padding-bottom:13px; border-bottom:1px solid var(--ink)}
.sh2 h2{font:800 26px/1.1 var(--serif); letter-spacing:-.02em}
.doc{margin-top:20px; padding-bottom:18px; border-bottom:1px solid var(--hair)}
.doc .dm{font:500 12px/1.4 var(--mono); color:var(--ink-2)}
.doc h3{margin-top:8px; font:800 26px/1.25 var(--serif); letter-spacing:-.02em}
.doc h3 a:hover{text-decoration:underline; text-underline-offset:4px}
.doc p{margin-top:6px; font:500 14px/1.6 var(--sans); color:var(--ink-2)}
.more{display:inline-flex; align-items:center; gap:7px; margin-top:14px; font:700 13.5px/1 var(--sans); border-bottom:1.5px solid var(--ink); padding-bottom:4px}
.ax-n{margin-top:14px; font:500 13.5px/1.7 var(--serif); color:var(--ink-2)}
.sister{margin-top:30px; border-top:3px solid var(--ink); padding-top:12px}
.sister .k{font:800 11.5px/1 var(--sans); letter-spacing:.14em; color:var(--ink-2)}
.sister a{display:inline-flex; align-items:center; gap:9px; margin-top:12px; font:800 22px/1.2 var(--serif); letter-spacing:-.02em; border-bottom:1.5px solid var(--ink); padding-bottom:4px}
.lede{margin-top:18px; font:500 16px/1.8 var(--serif)}
.steps{display:grid; grid-template-columns:1fr 1fr; column-gap:var(--col-gap); margin-top:16px}
.steps div{display:grid; grid-template-columns:58px 1fr; gap:12px; padding:12px 0; border-top:1px solid var(--hair)}
.steps dt{font:700 13px/1.6 var(--mono)}
.steps dd{font:500 13.5px/1.65 var(--sans); color:var(--ink-2)}

/* ---------- 판권 ---------- */
.colo{display:grid; grid-template-columns:auto 1fr; align-items:center; gap:40px; margin-top:44px; padding:18px 0 4px; border-top:4px solid var(--ink); position:relative}
.colo::before{content:""; position:absolute; left:0; right:0; top:2px; height:1px; background:var(--ink)}
.colo .cn b{display:block; font:900 28px/1.1 var(--serif); letter-spacing:-.02em}
.colo .cn span{display:block; margin-top:6px; font:500 12px/1.4 var(--mono); color:var(--ink-2)}
.colo .disc{justify-self:end; text-align:right; font:500 12.5px/1.65 var(--sans); color:var(--ink-2)}

/* ---------- narrow screens (not rendered here): single column, scrollable board and table ---------- */
@media (max-width:760px){
  :root{--page:calc(100vw - 32px); --np:52px; --banner:34px; --h-sec:26px; --sec-gap:52px}
  .mast-top{grid-template-columns:1fr; gap:12px}
  .ear{height:auto; flex-direction:row; align-items:center; justify-content:space-between}
  .ear-k{margin:0}
  .ear-r .ear-b,.ear-r{text-align:left; justify-content:flex-start}
  .folio{flex-wrap:wrap; gap:4px 12px} .folio .mid{display:none}
  .idx{height:auto; flex-direction:column; align-items:stretch; gap:12px; padding:10px 0}
  .idx ul{overflow-x:auto; gap:18px}
  .find{flex-wrap:wrap} .qbox{width:100%}
  .fcols{grid-template-columns:1fr; row-gap:28px}
  .lead,.story,.recent{padding:0; border:0}
  .lead .cv>div{width:min(358px,100%)!important}
  .board-scroll{overflow-x:auto}
  .grid{grid-template-columns:repeat(2,1fr); column-gap:16px}
  .tbl-scroll{overflow-x:auto}
  .tail{grid-template-columns:1fr} .notice{padding-left:0; border-left:0; margin-top:32px}
  .steps{grid-template-columns:1fr}
  .colo{grid-template-columns:1fr; gap:16px} .colo .disc{justify-self:start; text-align:left}
}

<div id="app"></div>
<script src="../data.js"></script>
<script>
(function(){
  /* Magazine covers for daily briefs. The frame stays the same on every issue (border, masthead, three
     cover lines, bottom strip) so the shelf reads as one publication. Inside it each issue gets its own
     colour scheme and hue, the day's headline in a kicker-lead-main hierarchy, and one of about forty
     pictures chosen from what the headline talks about and which indicators the brief recorded. */
  var BK=(function(){
  var PHN={A:'BTC!',B:'알트시즌?',C:'선별적',D:'STICKY BTC.D',E:'튀어?'};
  var WDK=['일','월','화','수','목','금','토'];
  var UID=0, FL=124;

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function n1(x){return Math.round(x*100)/100;}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function f2(v,d){return v==null?'–':v.toFixed(d);}
  function sgn(v,d){if(v==null) return '–'; var s=Math.abs(v).toFixed(d); return (Number(s)===0?'':(v>0?'+':'−'))+s;}
  function chg(v,d,unit){if(v==null) return ''; return Number(Math.abs(v).toFixed(d))===0?'전날과 같음':'전날 '+sgn(v,d)+unit;}
  function dnum(d){var a=d.split('-').map(Number); return Math.round(Date.UTC(a[0],a[1]-1,a[2])/864e5);}
  function parts(p){if(!p) return []; return String(p).split(/→|->|>/).map(function(s){return s.trim().toUpperCase();}).filter(function(s){return /^[A-E]$/.test(s);});}
  function hash(s){var h=2166136261>>>0; for(var i=0;i<s.length;i++){h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0;} return h;}
  function rng(seed){var a=seed>>>0; return function(){a=(a+0x6D2B79F5)>>>0; var t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296;};}
  function mixc(a,b,t){var x=parseInt(a.slice(1),16), y=parseInt(b.slice(1),16); var r=Math.round((x>>16)*(1-t)+(y>>16)*t), g=Math.round(((x>>8)&255)*(1-t)+((y>>8)&255)*t), bl=Math.round((x&255)*(1-t)+(y&255)*t); return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1).toUpperCase();}
  function vars(o){var s=''; for(var k in o){s+='--'+k+':'+o[k]+';';} return s;}

  /* ---- colour: OKLCH to sRGB, chroma lowered until the colour fits the sRGB gamut ---- */
  function toS(x){return x<=0.0031308?12.92*x:1.055*Math.pow(x,1/2.4)-0.055;}
  function toLin(x){return x<=0.04045?x/12.92:Math.pow((x+0.055)/1.055,2.4);}
  function okRGB(L,C,h){
    var hr=h*Math.PI/180, a=C*Math.cos(hr), b=C*Math.sin(hr);
    var l_=L+0.3963377774*a+0.2158037573*b, m_=L-0.1055613458*a-0.0638541728*b, s_=L-0.0894841775*a-1.2914855480*b;
    var l=l_*l_*l_, m=m_*m_*m_, s=s_*s_*s_;
    return [4.0767416621*l-3.3077115913*m+0.2309699292*s, -1.2684380046*l+2.6097574011*m-0.3413193965*s, -0.0041960863*l-0.7034186147*m+1.7076147010*s];
  }
  function hex3(c){return '#'+c.map(function(v){var x=Math.round(clamp(toS(clamp(v,0,1)),0,1)*255); return (x<16?'0':'')+x.toString(16);}).join('').toUpperCase();}
  function inG(c){return c[0]>=-1e-4&&c[0]<=1.0001&&c[1]>=-1e-4&&c[1]<=1.0001&&c[2]>=-1e-4&&c[2]<=1.0001;}
  function ok(L,C,h){
    h=((h%360)+360)%360; L=clamp(L,0,1);
    for(var i=0;i<60;i++){var c=okRGB(L,C,h); if(inG(c)) return hex3(c); C*=0.93;}
    return hex3(okRGB(L,0,h));
  }
  function lum(hx){var v=parseInt(hx.slice(1),16); return 0.2126*toLin((v>>16)/255)+0.7152*toLin(((v>>8)&255)/255)+0.0722*toLin((v&255)/255);}
  function cr(a,b){var x=lum(a), y=lum(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);}
  /* move lightness away from the ground until text on it reaches the contrast `min` */
  function readable(t,bg,min){
    var up=lum(bg)<0.2, L=t[0], c=ok(L,t[1],t[2]);
    for(var i=0;i<60 && cr(c,bg)<min;i++){ L=up?Math.min(1,L+0.02):Math.max(0,L-0.02); c=ok(L,t[1],t[2]); }
    return c;
  }
  /* twelve schemes. Each role is [L, C, hue offset from the issue hue] or [L, C, 0, fixed hue].
     bg: cover ground, ink: text and figures, fr: frame and masthead block, c1-c3: picture colours
     (c3 is the one piece the data points at, and the phase mark). hl:'fr' sets the main headline in the frame colour. */
  var SCH=[
    {n:'보색 라이트', bg:[.955,.028,0], ink:[.22,.04,0], fr:[.63,.17,180], c1:[.57,.14,0], c2:[.80,.09,25], c3:[.66,.19,180]},
    {n:'딥 드라마', dk:1, bg:[.27,.075,0], ink:[.97,.012,0], fr:[.84,.14,165], c1:[.56,.12,0], c2:[.74,.08,0], c3:[.86,.15,165], hl:'fr'},
    {n:'파스텔 삼색', bg:[.92,.05,0], ink:[.27,.06,240], fr:[.66,.15,120], c1:[.74,.11,240], c2:[.80,.09,60], c3:[.62,.17,120]},
    {n:'무채색과 포인트', bg:[.94,.006,0], ink:[.19,.01,0], fr:[.63,.19,0], c1:[.78,.012,0], c2:[.64,.014,0], c3:[.62,.19,0]},
    {n:'유사색', bg:[.93,.045,0], ink:[.24,.06,0], fr:[.56,.16,35], c1:[.66,.14,15], c2:[.78,.11,-20], c3:[.55,.18,55]},
    {n:'강한 바탕', bg:[.74,.14,0], ink:[.17,.03,180], fr:[.30,.07,180], c1:[.38,.10,180], c2:[.95,.025,0], c3:[.93,.11,60]},
    {n:'네온 나이트', dk:1, bg:[.19,.025,0], ink:[.98,0,0], fr:[.87,.19,100], c1:[.66,.17,100], c2:[.58,.19,280], c3:[.88,.20,100]},
    {n:'크림 인쇄', bg:[.945,.03,0,88], ink:[.22,.025,0,60], fr:[.52,.14,0], c1:[.57,.09,0], c2:[.73,.06,180], c3:[.60,.15,180]},
    {n:'밝은 삼색', bg:[.965,.015,0], ink:[.2,.03,0], fr:[.62,.17,120], c1:[.63,.16,0], c2:[.72,.15,240], c3:[.60,.19,120]},
    {n:'단색조', bg:[.89,.065,0], ink:[.2,.05,0], fr:[.44,.14,0], c1:[.6,.12,0], c2:[.73,.1,0], c3:[.34,.12,0]},
    {n:'한밤 금박', dk:1, bg:[.24,.06,0], ink:[.96,.02,0,85], fr:[.80,.14,0,85], c1:[.52,.10,0], c2:[.68,.07,0], c3:[.85,.15,0,85], hl:'fr'},
    {n:'블러시', bg:[.93,.04,0], ink:[.26,.08,0], fr:[.40,.13,0], c1:[.54,.15,0], c2:[.82,.07,0], c3:[.62,.16,200]}
  ];
  var DARKS=[1,6,10];
  /* one pass through all twelve schemes every twelve days, dark ones spread out (every fourth day) */
  var CYC=[0,5,1,8,3,2,6,9,7,4,10,11];
  function palette(si,H){
    var S=SCH[si], o={si:si, name:S.n, dark:!!S.dk, H:Math.round(H)}, R={};
    ['bg','ink','fr','c1','c2','c3'].forEach(function(k){
      var r=S[k], h=((((r.length>3?r[3]:H+r[2])%360)+360)%360), L=r[0], C=r[1];
      /* yellows go olive when they are dark: lift the bright picture colours near hue 100 */
      var dy=Math.abs(((h-100)%360+540)%360-180);
      if(k!=='bg'&&k!=='ink'&&C>=0.08&&L>=0.5&&dy<28) L=Math.max(L,0.76);
      R[k]=[L,C,h]; o[k]=ok(L,C,h);
    });
    /* picture colours must stand apart from the ground: darker on light grounds, lighter on dark ones */
    var bgL=R.bg[0];
    ['c1','c2','c3'].forEach(function(k){
      var r=R[k], L=r[0], up=o.dark||(bgL<0.85&&L>bgL), min=o.dark?2.1:1.55;
      for(var i=0;i<20&&cr(o[k],o.bg)<min;i++){ L=up?Math.min(.97,L+.03):Math.max(.2,L-.03); o[k]=ok(L,r[1],r[2]); }
      R[k]=[L,r[1],r[2]];
    });
    o.acc=readable(R.c3,o.bg,4.6);
    o.hl=(S.hl==='fr'&&cr(o.fr,o.bg)>=4.6)?o.fr:o.ink;
    o.frInk=cr('#FFFFFF',o.fr)>=cr('#17181A',o.fr)?'#FFFFFF':ok(.2,.03,R.fr[2]);
    o.c3Ink=cr('#FFFFFF',o.c3)>=cr('#17181A',o.c3)?'#FFFFFF':'#17181A';
    o.c2Ink=cr('#FFFFFF',o.c2)>=cr('#17181A',o.c2)?'#FFFFFF':'#17181A';
    o.c1Ink=cr('#FFFFFF',o.c1)>=cr('#17181A',o.c1)?'#FFFFFF':'#17181A';
    /* neutrals for poles, pipes, plinths: tinted with the ground hue, placed away from the ground lightness */
    var hb=R.bg[2], NL=o.dark?[.66,.58,.5,.42]:bgL<0.85?[.93,.87,.54,.38]:[.88,.79,.65,.46];
    o.n0=ok(NL[0],.014,hb); o.n1=ok(NL[1],.016,hb); o.n2=ok(NL[2],.018,hb); o.n3=ok(NL[3],.02,hb);
    o.paper=o.dark?ok(.92,.01,hb):'#FFFFFF';
    o.shadow=o.dark?'#000000':o.ink;
    return o;
  }
  function hueOf(b){return ((dnum(b.date)*137.508+(b.seq-1)*57)%360+360)%360;}
  function pickScheme(D,recent){
    var warn=D.P==='D'||D.P==='E', i=((dnum(D.b.date)+(D.b.seq-1)*5)%12+12)%12, last=recent.slice(-2);
    for(var k=0;k<12;k++){var s=CYC[(i+k)%12]; if(warn&&DARKS.indexOf(s)<0) continue; if(last.indexOf(s)<0) return s;}
    return CYC[i];
  }

  /* ---- data ---- */
  function prevOf(b,all){
    var p=null;
    all.forEach(function(x){ if((x.date<b.date||(x.date===b.date&&x.seq<b.seq)) && x.btcd!=null) p=x; });
    return p;
  }
  function valOf(x,key){ if(key==='alt') return (x.btcd!=null&&x.stableD!=null)?100-x.btcd-x.stableD:null; return x[key]; }
  function histOf(b,all,key,n){
    var m={}, order=[];
    all.forEach(function(x){
      var v=valOf(x,key);
      if((x.date<b.date||(x.date===b.date&&x.seq<=b.seq)) && v!=null){ if(!(x.date in m)) order.push(x.date); m[x.date]=v; }
    });
    return order.slice(-n).map(function(d){return {d:d,v:m[d]};});
  }
  /* headline: the clause after the last ', ' or ' — ' is the punchline (main), the part before it the lead */
  function split(h){
    h=String(h||'').trim(); if(!h) return {lead:'',main:''};
    var best=-1, sep='';
    [', ',' — ',' – '].forEach(function(s){var i=h.lastIndexOf(s); if(i>best && h.length-i-s.length>=6 && i>=4){best=i; sep=s;}});
    if(best<0) return {lead:'',main:h};
    return {lead:h.slice(0,best)+(sep===', '?',':''), main:h.slice(best+sep.length)};
  }
  /* numbers with a unit are the one emphasis inside a headline */
  function emph(t){return esc(t).replace(/([+−\-]?\d[\d,.]*\s?(?:%p|%|bp|달러|배))/g,'<em>$1</em>');}
  function textWidth(s){
    var w=0; for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);
      if(c>=0xAC00&&c<=0xD7A3) w+=0.97; else if(c===32) w+=0.26; else if(c>=48&&c<=57) w+=0.6;
      else if(c>=65&&c<=90) w+=0.68; else if(c>=97&&c<=122) w+=0.55; else if(c===37) w+=0.86; else w+=0.36;}
    return w;
  }
  function linesAt(s,fs,width){return Math.max(1,Math.ceil(textWidth(s)*fs*1.1/width));}
  function fitMain(main,hasLead,leadLines){
    var budget=33.4-(2.9*1.1+1.5)-(hasLead?(leadLines*3.55*1.34+1.5):0), W=87.2, sizes=[9,8.4,7.8,7.2,6.6,6,5.4,4.9,4.5];
    for(var i=0;i<sizes.length;i++){var f=sizes[i], L=linesAt(main,f,W); if(L<=4 && L*f*1.14<=budget) return {fs:f,lines:L};}
    var f0=4.5; return {fs:f0,lines:Math.max(1,Math.floor(budget/(f0*1.14)))};
  }
  /* what a clause is about. Share indicators first (earliest mention wins), then policy events, then price */
  var KW={
    BTC:/BTC\.?D|도미넌스|비트코인 점유율|계단|내려앉|밀렸|밀리|대형주/,
    ALT:/알트|꼬리|종목|계열|중소형|점유율/,
    STABLE:/현금|스테이블|STABLE|유동성|자금/i,
    MACRO:/연준|FOMC|금리|\d+bp|법안|표결|클로처|SEC|규제|의회|상원|하원|정책|대통령|관세/,
    PRICE:/\d[\d,]*달러|사이클선|숏|반등|되밀|급등|급락|신고가/
  };
  function kwFocus(t){
    if(!t) return null; var best=null, at=1e9;
    ['BTC','ALT','STABLE'].forEach(function(k){var m=KW[k].exec(t); if(m && m.index<at){at=m.index; best=k;}});
    if(best) return best;
    if(KW.MACRO.test(t)) return 'MACRO';
    if(KW.PRICE.test(t)) return 'PRICE';
    return null;
  }
  function info(b,all,vol){
    var ps=parts(b.phase), P=ps.length?ps[ps.length-1]:'X';
    var a=b.date.split('-').map(Number), wdi=new Date(dnum(b.date)*864e5).getUTCDay();
    var pv=prevOf(b,all), btc=b.btcd, st=b.stableD, alt=(btc!=null&&st!=null)?100-btc-st:null;
    var dB=(pv&&btc!=null&&pv.btcd!=null)?btc-pv.btcd:null, dS=(pv&&st!=null&&pv.stableD!=null)?st-pv.stableD:null;
    var dA=(dB!=null&&dS!=null)?-(dB+dS):null;
    var sp=split(b.headline), noteParts=String(b.note||'').split(/\s·\s/).map(function(s){return s.trim();}).filter(Boolean);
    var lead=sp.lead, main=sp.main;
    if(!main){ main=noteParts[0]||(ps.length?'국면 '+ps.join('→'):'첫 기록'); }
    var cache={};
    return {b:b, P:P, ps:ps, vol:vol, y:a[0], m:a[1], d:a[2], wd:WDK[wdi], wdi:wdi,
      btc:btc, st:st, alt:alt, dB:dB, dS:dS, dA:dA, b1m:b.btc1m, s1m:b.stable1m,
      lead:lead, main:main, noteParts:noteParts, headline:b.headline||'', note:b.note||'',
      r:rng(hash(b.date+'#'+b.seq)), id:'mz'+(++UID),
      hist:function(key,n){var k=key+'/'+n; return cache[k]||(cache[k]=histOf(b,all,key,n));}};
  }
  /* what the picture is about: the indicator the headline names, else the one that moved most since the previous brief */
  function focusOf(D){
    var has={BTC:D.btc!=null, ALT:D.alt!=null, STABLE:D.st!=null, MACRO:true, PRICE:D.b1m!=null};
    var src=[D.main, D.lead]; if(!D.headline) src.push(D.note);
    for(var i=0;i<src.length;i++){var f=kwFocus(src[i]); if(f&&has[f]) return f;}
    var c=[['BTC',D.dB],['STABLE',D.dS],['ALT',D.dA]].filter(function(q){return q[1]!=null;})
      .sort(function(x,y){return Math.abs(y[1])-Math.abs(x[1]);});
    if(c.length && Math.abs(c[0][1])>=0.15) return c[0][0];
    if(D.alt!=null) return 'MIX';
    if(D.btc!=null) return 'BTC';
    return 'TYPE';
  }
  var LAB={BTC:'BTC.D',ALT:'ALT',STABLE:'ΣSTABLECOIN.D'};
  function keyF(F){return F==='ALT'?'alt':F==='STABLE'?'stableD':F==='PRICE'?'btc1m':'btcd';}
  function shareOf(D,F){return F==='BTC'?D.btc:F==='ALT'?D.alt:F==='STABLE'?D.st:null;}
  function dOf(D,F){return F==='BTC'?D.dB:F==='ALT'?D.dA:F==='STABLE'?D.dS:null;}
  function mover(D){
    var c=[['BTC',D.dB],['STABLE',D.dS],['ALT',D.dA]].filter(function(q){return q[1]!=null;})
      .sort(function(x,y){return Math.abs(y[1])-Math.abs(x[1]);});
    return c.length?c[0][0]:(D.btc!=null?'BTC':null);
  }
  /* the share the picture points at: the named one, or for mixed pictures the one that moved most */
